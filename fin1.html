<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finances Perso</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;--bg1:#0e1520;--bg2:#111827;--bd:#1a2236;--bd2:#2d3748;
  --tx:#cbd5e1;--tx2:#64748b;--tx3:#94a3b8;
  --amb:#f59e0b;--grn:#22c55e;--red:#ef4444;--r2:#f87171;--blu:#60a5fa;
}
html,body{background:var(--bg);color:var(--tx);font-family:"DM Mono","Courier New",monospace;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
input[type=range]{accent-color:var(--amb);cursor:pointer;width:100%}
input,select{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-family:inherit;font-size:12px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--amb)}
select option{background:var(--bg1)}
input[type=date]{color-scheme:dark}
button{background:var(--bg1);border:1px solid var(--bd2);border-radius:6px;color:var(--tx3);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;transition:background .15s}
button:hover{background:var(--bd)}
button.pri{background:var(--amb);color:#080b10;border-color:var(--amb);font-weight:700}
button.pri:hover{background:#e08e00}
button.red{background:#1a0505;color:var(--red);border-color:#450a0a}
button.red:hover{background:#2a0707}
button.rbtn{padding:5px 10px;font-size:10px;letter-spacing:.08em}
button.rbtn.sel{background:var(--amb)!important;color:#080b10!important;border-color:var(--amb)!important;font-weight:700}
/* Layout */
#header{border-bottom:1px solid var(--bd);padding:16px 20px 12px;display:flex;align-items:baseline;gap:14px;background:var(--bg1)}
#header h1{font-size:20px;font-weight:700;color:#f8fafc;letter-spacing:-.02em}
#header .sub{font-size:10px;color:var(--tx2);letter-spacing:.15em;text-transform:uppercase}
#header .net{margin-left:auto;font-size:13px;font-weight:600}
#tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 14px;background:var(--bg1)}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--tx2);cursor:pointer;font-size:10px;font-family:inherit;letter-spacing:.13em;padding:10px 13px;text-transform:uppercase;transition:color .15s}
.tab.on{color:var(--amb);border-bottom-color:var(--amb)}
.tab:hover{background:none;color:var(--tx3)}
#body{padding:18px 16px 60px;max-width:720px;margin:0 auto}
/* Cards */
.card{background:var(--bg1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card.danger{background:#120404;border-color:#450a0a}
.card.success{background:#031a0e;border-color:#14532d}
.ctitle{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px;opacity:.8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);font-weight:400}
th:first-child{text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--bg2);text-align:right;color:var(--tx)}
td:first-child{text-align:left;color:var(--tx3)}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap}
.row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--bg2);gap:8px}
.row:last-child{border-bottom:none}
.alert{background:#120404;border:1px solid #450a0a55;border-radius:8px;padding:12px 14px;font-size:11px;color:var(--r2);line-height:1.8;margin-bottom:12px}
.div{border-top:1px solid var(--bd);margin:10px 0}
/* Indicator */
.ind-green{background:#031a0e;border:1px solid #14532d;color:var(--grn)}
.ind-yellow{background:#1c1200;border:1px solid #78350f;color:var(--amb)}
.ind-red{background:#120404;border:1px solid #450a0a;color:var(--red)}
.ind-box{border-radius:7px;padding:11px 14px;margin:10px 0}
/* Apps Script code block */
details summary{cursor:pointer;list-style:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)}
details summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--amb);margin-bottom:10px}
pre{background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:12px;font-size:10px;color:var(--tx3);overflow-x:auto;white-space:pre-wrap;line-height:1.7;margin-top:10px;font-family:inherit}
@media(max-width:520px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="header">
  <h1>FINANCES.PERSO</h1>
  <span class="sub" id="hdr-date"></span>
  <span class="net" id="hdr-net"></span>
</div>
<div id="tabs">
  <button class="tab on" onclick="sT(0)">Tableau de bord</button>
  <button class="tab" onclick="sT(1)">Abonnements</button>
  <button class="tab" onclick="sT(2)">Dette C1</button>
  <button class="tab" onclick="sT(3)">Objectif &amp; Projection</button>
</div>
<div id="body"></div>

<script>
// ── APPS SCRIPT CODE (copier-coller dans Google Apps Script) ─────────────────
const AS_CODE =
`function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss   = SpreadsheetApp.getActiveSpreadsheet();
    var sh   = ss.getSheetByName("Finances");
    if (!sh) {
      sh = ss.insertSheet("Finances");
      sh.appendRow(["Date","Desjardins","C1 Réel","C1 Attendu","Écart $","Indicateur","Raison","Note"]);
    }
    sh.appendRow([data.date, data.des, data.c1, data.expected, data.delta, data.indicator, data.reason, data.note]);
  } catch(err) {}
  return ContentService.createTextOutput("ok");
}`;

function escH(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── DATA ──────────────────────────────────────────────────────────────────────
const DEFAULT = {
  des:-5.00, c1:4395.57, ws:170.00,
  paye:1670.38, daily:40, ccPmt:450, apr:19.99,
  nextId:12, history:[],
  goal:{ startDate:new Date().toISOString().split("T")[0], startBalance:4395.57, targetBalance:0, months:18 },
  sheetsUrl:"",
  subs:[
    {id:1, nom:"Loyer",               amt:769.00, type:"d", cat:"logement" },
    {id:2, nom:"Turcot",              amt:300.00, type:"d", cat:"autre"    },
    {id:3, nom:"Beneva (assurance)",  amt:27.67,  type:"d", cat:"assurance"},
    {id:4, nom:"Gym",                 amt:28.74,  type:"c", cat:"santé"    },
    {id:5, nom:"Colba (internet)",    amt:47.08,  type:"c", cat:"télécoms" },
    {id:6, nom:"Frais C1 (intérêts)",amt:70.00,  type:"c", cat:"dette"    },
    {id:7, nom:"Amazon Prime",        amt:11.49,  type:"c", cat:"loisirs"  },
    {id:8, nom:"YouTube Premium",     amt:14.94,  type:"c", cat:"loisirs"  },
    {id:9, nom:"Tim Dillon",          amt:7.99,   type:"c", cat:"loisirs"  },
    {id:10,nom:"F1 TV",               amt:12.99,  type:"c", cat:"loisirs"  },
    {id:11,nom:"Chatr",               amt:15.95,  type:"c", cat:"télécoms" },
  ]
};
const CATS    = ["logement","télécoms","assurance","santé","dette","loisirs","autre"];
const CC      = {logement:"#f59e0b",télécoms:"#3b82f6",assurance:"#a78bfa",santé:"#22c55e",dette:"#ef4444",loisirs:"#60a5fa",autre:"#fb923c"};
const PC      = {300:"#64748b",400:"#60a5fa",500:"#a78bfa",600:"#22c55e"};
const REASONS = ["Achats variables C1","Cannabis","Restaurant / Bars","Dépense imprévue","Paiement réduit ce mois","Autre…"];
const LSKEY   = "finances_perso_v2";

// ── LOAD / SAVE ───────────────────────────────────────────────────────────────
let D = JSON.parse(JSON.stringify(DEFAULT));
try {
  const s = localStorage.getItem(LSKEY);
  if (s) { const p=JSON.parse(s); D={...DEFAULT,...p}; D.goal={...DEFAULT.goal,...(p.goal||{})}; }
} catch(e) {}
function save(){ try{ localStorage.setItem(LSKEY,JSON.stringify(D)); }catch(e){} }

// ── STATE ─────────────────────────────────────────────────────────────────────
let tab=0, dSlider=D.ccPmt, subEdit=null, charts={};
const $=id=>document.getElementById(id);

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fv=(v,d=2)=>(v<0?"-":"")+"\$\u00a0"+Math.abs(v).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");
const col=v=>v>=0?"var(--grn)":"var(--red)";
const lbl=t=>`<label style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);display:block;margin-bottom:4px">${t}</label>`;
const tag=c=>`<span class="tag" style="background:${CC[c]||"#94a3b8"}18;color:${CC[c]||"#94a3b8"};border:1px solid ${CC[c]||"#64748b"}33">${c}</span>`;

function monthly(){
  const i=D.paye*26/12,fd=D.subs.filter(s=>s.type==="d").reduce((a,s)=>a+s.amt,0),fc=D.subs.filter(s=>s.type==="c").reduce((a,s)=>a+s.amt,0),day=D.daily*30;
  return{i,fd,fc,day,sur:i-fd-fc-day-D.ccPmt};
}
function payoff(bal,apr,pmt,mx=60){
  const r=apr/100/12;let b=bal;const rows=[];
  for(let m=1;m<=mx;m++){const i=b*r;b=b+i-pmt;rows.push({b:Math.max(0,b),i});if(b<=0)break;}
  const pi=rows.findIndex(r=>r.b===0);
  return{rows,mo:pi>=0?pi+1:null,ti:rows.reduce((s,r)=>s+r.i,0)};
}
function projection(){
  const i=D.paye*26/12,r=D.apr/100/12;
  const fd=D.subs.filter(s=>s.type==="d"&&s.cat!=="dette").reduce((a,s)=>a+s.amt,0);
  const fc=D.subs.filter(s=>s.type==="c"&&s.cat!=="dette").reduce((a,s)=>a+s.amt,0);
  const day=D.daily*30;let des=D.des,cc=D.c1;
  return["Juin","Juil","Août","Sep","Oct","Nov"].map(l=>{
    des=des+i-fd-day-D.ccPmt;
    cc=Math.max(0,cc+cc*r+fc-D.ccPmt);
    return{l,des:+des.toFixed(2),cc:+cc.toFixed(2),net:+(des+D.ws-cc).toFixed(2)};
  });
}

// ── GOAL / INDICATOR ─────────────────────────────────────────────────────────
function hasGoal(){ return D.goal&&D.goal.startBalance>0&&D.goal.months>0; }

function calcInd(actual){
  if(!hasGoal()) return null;
  const{startDate,startBalance,targetBalance,months}=D.goal;
  const mElapsed=Math.max(0,(Date.now()-new Date(startDate).getTime())/(1000*60*60*24*30.4375));
  const monthly=(startBalance-targetBalance)/months;
  const expected=Math.max(targetBalance,startBalance-mElapsed*monthly);
  const delta=actual-expected;
  const color=delta<=0?"green":delta<=monthly*.5?"yellow":"red";
  return{actual,expected,delta,monthly,color,emoji:{green:"🟢",yellow:"🟡",red:"🔴"}[color]};
}

function indHTML(p){
  if(!p)return"";
  const M={
    green: {cls:"ind-green", label:"EN AVANCE — Bon travail"},
    yellow:{cls:"ind-yellow",label:"LÉGER ÉCART — Encore rattrapable"},
    red:   {cls:"ind-red",   label:"HORS OBJECTIF — Action requise"},
  }[p.color];
  const vc=p.color==="green"?"var(--grn)":p.color==="yellow"?"var(--amb)":"var(--red)";
  return`<div class="ind-box ${M.cls}">
    <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:7px">${p.emoji} ${M.label}</div>
    <div style="font-size:11px;color:var(--tx3);display:flex;flex-wrap:wrap;gap:16px">
      <span>Attendu : <strong style="color:var(--tx)">${fv(p.expected)}</strong></span>
      <span>Réel : <strong style="color:${vc}">${fv(p.actual)}</strong></span>
      <span>Écart : <strong style="color:${p.delta>=0?"var(--red)":"var(--grn)"}">${p.delta>=0?"+":""}${fv(p.delta)}</strong></span>
    </div>
  </div>`;
}

function logToSheets(entry,perf){
  if(!D.sheetsUrl)return;
  try{
    fetch(D.sheetsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({date:entry.date,des:entry.des,c1:entry.cc,expected:perf?+perf.expected.toFixed(2):"",delta:perf?+perf.delta.toFixed(2):"",indicator:perf?perf.emoji:"",reason:entry.reason||"",note:entry.note||""})
    });
  }catch(e){}
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  Object.values(charts).forEach(c=>c&&c.destroy&&c.destroy());charts={};
  const m=monthly(),net=D.des+D.ws-D.c1;
  const P4={};[300,400,500,600].forEach(p=>P4[p]=payoff(D.c1,D.apr,p));
  const cust=payoff(D.c1,D.apr,dSlider),pr=projection();
  const byCat=D.subs.reduce((a,s)=>{a[s.cat]=(a[s.cat]||0)+s.amt;return a},{});
  const today=new Date().toLocaleDateString("fr-CA");

  const hn=$("hdr-net"),hd=$("hdr-date");
  if(hn){hn.textContent=(net>=0?"▲ ":"▼ ")+fv(net);hn.style.color=net>=0?"var(--grn)":"var(--red)";}
  if(hd)hd.textContent="Rodolphe · "+today;
  document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("on",i===tab));

  const body=$("body");

  // ── TAB 0 ─────────────────────────────────────────────────────────────────
  if(tab===0){
    const curInd=calcInd(D.c1);
    body.innerHTML=`
<!-- Soldes -->
<div class="g3">
  ${[["🏦 Desjardins",D.des],["💳 Capital One",-D.c1],["📈 Wealthsimple",D.ws]].map(([l,v])=>`
  <div class="card"><div class="ctitle">${l}</div>
    <div style="font-size:24px;font-weight:500;color:${col(v)};letter-spacing:-.02em">${fv(v)}</div>
  </div>`).join("")}
</div>

<!-- Valeur nette + indicateur de performance actuel -->
<div class="card ${net>=0?"success":"danger"}">
  <div class="ctitle">⚖️ Valeur nette</div>
  <div style="font-size:36px;font-weight:500;color:${col(net)};letter-spacing:-.02em">${fv(net)}</div>
  <div style="font-size:10px;color:var(--tx2);margin-top:5px">DES ${fv(D.des)} + WS ${fv(D.ws)} − C1 ${fv(D.c1)}</div>
  ${hasGoal()&&curInd?`<div style="margin-top:8px">${indHTML(curInd)}</div>`:`<div style="margin-top:8px;font-size:10px;color:var(--tx2)">→ Configure ton objectif dans l'onglet <em>Objectif &amp; Projection</em> pour voir l'indicateur ici.</div>`}
</div>

<!-- Résumé mensuel -->
<div class="card">
  <div class="ctitle">📊 Résumé mensuel</div>
  ${[["Revenu net (bi-sem × 26/12)",+m.i],["Charges débit fixes",-m.fd],["Charges crédit fixes",-m.fc],[`Budget quotidien (${D.daily}$/j × 30)`,-m.day],["Paiement Capital One planifié",-D.ccPmt]].map(([l,v])=>`
  <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg2)">
    <span style="font-size:11px;color:var(--tx3)">${l}</span>
    <span style="font-size:13px;font-weight:500;color:${col(v)}">${fv(v)}</span>
  </div>`).join("")}
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 0">
    <span style="font-size:12px;color:#f8fafc;font-weight:600">Surplus théorique</span>
    <span style="font-size:18px;font-weight:600;color:${col(m.sur)}">${fv(m.sur)}</span>
  </div>
</div>

<!-- Check-in -->
<div class="card">
  <div class="ctitle">✏️ Mise à jour des soldes</div>
  <div class="g3">
    <div>${lbl("Desjardins ($)")}<input id="ci-d" type="number" step=".01" placeholder="${D.des}"></div>
    <div>${lbl("Capital One ($)")}<input id="ci-c" type="number" step=".01" placeholder="${D.c1}" oninput="updInd()"></div>
    <div>${lbl("Wealthsimple ($)")}<input id="ci-w" type="number" step=".01" placeholder="${D.ws}"></div>
  </div>

  <!-- Indicateur live -->
  <div id="ci-ind"></div>

  <!-- Raison de l'écart — apparaît si 🟡 ou 🔴 -->
  <div id="ci-rp" style="display:none;margin-bottom:12px">
    <div style="font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px">Raison de l'écart</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      ${REASONS.map(r=>`<button class="rbtn" data-r="${r}" onclick="selR(this)">${r}</button>`).join("")}
    </div>
    <input id="ci-roth" style="display:none" placeholder="Préciser…">
  </div>

  <div style="margin-bottom:10px">${lbl("Note (optionnelle)")}<input id="ci-n" placeholder="après paye du 11 juin…"></div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="pri" onclick="doCI()">Enregistrer</button>
    ${D.sheetsUrl?`<span style="font-size:10px;color:var(--tx2)">→ sera loggé dans Google Sheets</span>`:`<span style="font-size:10px;color:var(--tx2);opacity:.5">Sheets non configuré</span>`}
  </div>
</div>

<!-- Historique -->
${D.history.length?`
<div class="card">
  <div class="ctitle">📋 Historique (${D.history.length})</div>
  <div style="overflow-x:auto"><table>
    <thead><tr>${["Date","DES","C1 Réel","C1 Attendu","Perf","Raison","Note"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${D.history.slice(0,8).map(h=>`<tr>
      <td style="text-align:left;white-space:nowrap">${h.date}</td>
      <td style="color:${h.des>=0?"var(--grn)":"var(--red)"}">${fv(h.des)}</td>
      <td style="color:var(--red)">${fv(h.cc)}</td>
      <td style="color:var(--tx2)">${h.expected!=null?fv(h.expected):"—"}</td>
      <td style="font-size:16px;text-align:center">${h.indicator||"—"}</td>
      <td style="font-size:9px;color:var(--tx2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.reason||"—"}</td>
      <td style="font-size:9px;color:var(--tx2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.note||"—"}</td>
    </tr>`).join("")}</tbody>
  </table></div>
</div>`:""}`;
  }

  // ── TAB 1 ─────────────────────────────────────────────────────────────────
  if(tab===1){
    body.innerHTML=`
<div class="card">
  <div class="ctitle">🗂️ Par catégorie</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,t])=>`
    <div class="card" style="margin-bottom:0;padding:8px 12px">
      ${tag(c)}<div style="font-size:17px;font-weight:500;color:${CC[c]||"#94a3b8"};margin-top:5px">${fv(t)}</div>
    </div>`).join("")}
  </div>
  <div class="div"></div>
  ${[["Débit fixes/mois",m.fd],["Crédit fixes/mois",m.fc],["Total charges fixes",m.fd+m.fc]].map(([l,v],i)=>`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <span style="font-size:${i===2?12:11}px;color:var(--tx${i===2?"":"3"});${i===2?"font-weight:600":""}">${i===2?"💰 ":""}${l}</span>
    <span style="font-size:${i===2?17:13}px;font-weight:${i===2?600:400};color:var(--red)">${fv(v)}/mois</span>
  </div>`).join("")}
</div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="ctitle">📑 Toutes les charges fixes</div>
    <button onclick="oAdd()">+ Ajouter</button>
  </div>
  <div id="sf-wrap"></div>
  ${["d","c"].map(type=>`
  <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:${type==="d"?"var(--amb)":"var(--blu)"};margin:${type==="c"?"14px":0} 0 7px">▸ ${type==="d"?"Débit":"Crédit"}</div>
  ${D.subs.filter(s=>s.type===type).map(s=>`
  <div class="row">
    <div style="flex:1;font-size:12px;color:var(--tx)">${s.nom}</div>${tag(s.cat)}
    <span style="font-size:13px;font-weight:500;color:var(--red);min-width:76px;text-align:right">${fv(s.amt)}</span>
    <button onclick="oEdit(${s.id})" style="padding:3px 8px;font-size:10px">✏️</button>
    <button onclick="dSub(${s.id})" class="red" style="padding:3px 8px;font-size:10px">✕</button>
  </div>`).join("")}`).join("")}
</div>`;

// ── INDICATOR LIVE UPDATE ─────────────────────────────────────────────────────
window.updInd=function(){
  const v=$("ci-c")?.value,box=$("ci-ind"),rp=$("ci-rp");
  if(!v||!hasGoal()){if(box)box.innerHTML="";if(rp)rp.style.display="none";return;}
  const a=parseFloat(v);if(isNaN(a))return;
  const p=calcInd(a);
  if(box)box.innerHTML=indHTML(p);
  if(rp)rp.style.display=p.color!=="green"?"block":"none";
};

// ── REASON SELECTION ─────────────────────────────────────────────────────────
window.selR=function(btn){
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  const o=$("ci-roth");if(o)o.style.display=btn.dataset.r==="Autre…"?"block":"none";
};
function getReason(){
  const s=document.querySelector(".rbtn.sel");
  if(!s)return"";
  if(s.dataset.r==="Autre…")return $("ci-roth")?.value||"Autre";
  return s.dataset.r;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
window.sT=i=>{tab=i;subEdit=null;render();};

window.doCI=function(){
  const d=$("ci-d")?.value,c=$("ci-c")?.value,w=$("ci-w")?.value,n=$("ci-n")?.value;
  if(!d&&!c&&!w)return;
  const cc=c?parseFloat(c):D.c1;
  const perf=calcInd(cc);
  const reason=getReason();
  const entry={
    date:new Date().toLocaleDateString("fr-CA"),
    des:d?parseFloat(d):D.des, cc, sav:w?parseFloat(w):D.ws,
    note:n||"", reason, indicator:perf?.emoji||"",
    expected:perf?+perf.expected.toFixed(2):null,
  };
  D.des=entry.des;D.c1=entry.cc;D.ws=entry.sav;
  D.history=[entry,...D.history].slice(0,30);
  save();logToSheets(entry,perf);render();
};

window.onSl=function(v){
  dSlider=parseInt(v);
  const sv=$("sv");if(sv)sv.textContent=fv(dSlider,0)+"/m";
  const ss=$("ss");if(ss)ss.innerHTML=slSt(payoff(D.c1,D.apr,dSlider));
};

window.uP=function(key,val){

};
window.uStr=function(key,val){D[key]=val;save();render();};
window.uGoal=function(key,val){
  if(key==="startDate")D.goal[key]=val;

  save();render();
};

window.xSub=()=>{subEdit=null;const w=$("sf-wrap");if(w)w.innerHTML="";};
window.cSub=function(){
  const nom=$("sf-n")?.value,amt=parseFloat($("sf-a")?.value||0),type=$("sf-t")?.value,cat=$("sf-c")?.value;
  if(!nom||amt<=0)return;
  if(subEdit==="new")D.subs.push({id:D.nextId++,nom,amt,type,cat});
  else D.subs=D.subs.map(s=>s.id===subEdit?{...s,nom,amt,type,cat}:s);
  subEdit=null;save();render();
};

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YOGA.AW</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1410">
<style>
@font-face {
  font-family: 'system-display';
  src: local('Georgia');
}

:root{
  --ink:#0E1410;
  --ink-soft:#16201A;
  --paper:#F5F1E8;
  --paper-dim:#D9D2C2;
  --sage:#7A9B76;
  --sage-dim:#4F6B4C;
  --ochre:#B8915C;
  --line: rgba(245,241,232,0.14);
  --line-strong: rgba(245,241,232,0.28);
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; background:var(--ink); color:var(--paper); min-height:100vh;}
body{
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing: antialiased;
}

.display{
  font-family: Georgia, 'Iowan Old Style', serif;
  font-weight: 400;
  letter-spacing: -0.01em;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--sage);
  outline-offset:3px;
}

/* ===== Shell ===== */
#app{max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:60px; position:relative;}

header.top{
  padding:28px 22px 18px;
  border-bottom:1px solid var(--line);
}
header.top .wordmark{
  font-size:13px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--sage);
  display:flex;
  align-items:center;
  gap:10px;
}
header.top .wordmark::before{
  content:'';
  width:18px; height:1px;
  background:var(--sage);
  display:inline-block;
}
header.top h1{
  font-size:30px;
  margin:10px 0 2px;
}
header.top .sub{
  color:var(--paper-dim);
  font-size:14px;
}

/* ===== Streak strip ===== */
.streak-strip{
  display:flex;
  gap:6px;
  padding:16px 22px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.streak-day{
  flex:1;
  min-width:30px;
  height:40px;
  border-radius:3px;
  background:var(--ink-soft);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:var(--paper-dim);
  position:relative;
}
.streak-day.done{
  background:var(--sage-dim);
  border-color:var(--sage);
  color:var(--paper);
}
.streak-day.today{
  border-color:var(--ochre);
  border-width:2px;
}
.streak-meta{
  padding:10px 22px 4px;
  font-size:12px;
  color:var(--paper-dim);
  display:flex;
  justify-content:space-between;
}
.streak-meta strong{color:var(--ochre); font-weight:600;}

/* ===== Filter row ===== */
.filters{
  display:flex;
  gap:8px;
  padding:18px 22px 6px;
  overflow-x:auto;
}
.filter-chip{
  background:transparent;
  border:1px solid var(--line);
  color:var(--paper-dim);
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
  transition:all .15s ease;
}
.filter-chip.active{
  border-color:var(--sage);
  color:var(--paper);
  background:rgba(122,155,118,0.12);
}

/* ===== Session list ===== */
.session-list{padding:14px 22px 8px; display:flex; flex-direction:column; gap:12px;}

.session-card{
  border:1px solid var(--line);
  border-radius:6px;
  padding:18px;
  background:var(--ink-soft);
  position:relative;
  transition: border-color .15s ease;
}
.session-card:active{border-color:var(--line-strong);}

.session-card .row1{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.session-card h3{
  font-size:19px;
  margin:0;
  flex:1;
}
.session-card .duration{
  font-size:13px;
  color:var(--ochre);
  white-space:nowrap;
  font-variant-numeric: tabular-nums;
}
.session-card .tagline{
  font-size:13.5px;
  color:var(--paper-dim);
  margin:6px 0 14px;
}

/* the staff / breath-line signature element */
.staff{
  position:relative;
  height:34px;
  margin:0 0 4px;
}
.staff .rule{
  position:absolute;
  left:0; right:0; top:50%;
  height:1px;
  background:var(--line-strong);
}
.staff .notes{
  position:relative;
  display:flex;
  align-items:center;
  height:100%;
}
.staff .note{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--sage);
  border:1px solid var(--ink-soft);
  flex-shrink:0;
}
.staff .note.peak{
  width:10px; height:10px;
  background:var(--ochre);
}
.staff .gap{flex:1; min-width:4px;}

.session-card .meta-row{
  display:flex;
  justify-content:space-between;
  font-size:11.5px;
  color:var(--paper-dim);
  letter-spacing:0.03em;
  text-transform:uppercase;
}
.session-card .meta-row span:first-child{color:var(--sage);}

/* ===== Session detail ===== */
.detail-screen{
  position:fixed;
  inset:0;
  background:var(--ink);
  z-index:50;
  overflow-y:auto;
  display:none;
}
.detail-screen.open{display:block;}

.detail-top{
  position:sticky;
  top:0;
  background:var(--ink);
  padding:18px 20px 14px;
  border-bottom:1px solid var(--line);
  z-index:5;
  display:flex;
  align-items:center;
  gap:14px;
}
.back-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--paper);
  width:36px; height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}
.detail-top .titles{flex:1; min-width:0;}
.detail-top h2{font-size:19px; margin:0; line-height:1.25;}
.detail-top .sub{font-size:12.5px; color:var(--paper-dim); margin-top:2px;}

.detail-body{padding:20px;}

.progress-track{
  height:3px;
  background:var(--line);
  border-radius:2px;
  margin-bottom:24px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--sage);
  width:0%;
  transition:width .25s ease;
}

.pose-card{
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px;
  margin-bottom:14px;
  background:var(--ink-soft);
}
.pose-card.active{border-color:var(--sage); box-shadow:0 0 0 1px var(--sage) inset;}
.pose-card.complete{opacity:0.5;}

.pose-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
.pose-index{
  font-size:11px;
  color:var(--ochre);
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:4px;
}
.pose-head h3{font-size:20px; margin:0;}
.pose-head .pose-fr{font-size:13.5px; color:var(--paper-dim); margin-top:2px; font-style:italic;}
.pose-timer{
  font-size:14px;
  color:var(--sage);
  font-variant-numeric: tabular-nums;
  white-space:nowrap;
  border:1px solid var(--line);
  padding:4px 9px;
  border-radius:14px;
}

.pose-diagram{
  width:100%;
  height:auto;
  margin:14px 0;
  display:block;
}

.pose-steps{
  list-style:none;
  margin:14px 0 0;
  padding:0;
  counter-reset: step;
}
.pose-steps li{
  counter-increment: step;
  position:relative;
  padding-left:28px;
  margin-bottom:9px;
  font-size:14.5px;
  color:#E6E1D4;
}
.pose-steps li::before{
  content: counter(step);
  position:absolute;
  left:0; top:1px;
  width:18px; height:18px;
  border:1px solid var(--sage-dim);
  border-radius:50%;
  font-size:10px;
  color:var(--sage);
  display:flex;
  align-items:center;
  justify-content:center;
  font-variant-numeric: tabular-nums;
}

.pose-cue{
  margin-top:12px;
  padding:10px 12px;
  background:rgba(184,145,92,0.08);
  border-left:2px solid var(--ochre);
  font-size:13px;
  color:var(--paper-dim);
  font-style:italic;
}

.mark-done-btn{
  margin-top:16px;
  width:100%;
  padding:13px;
  border-radius:5px;
  border:1px solid var(--sage);
  background:transparent;
  color:var(--sage);
  font-size:14px;
  letter-spacing:0.04em;
}
.pose-card.complete .mark-done-btn{
  background:var(--sage-dim);
  color:var(--paper);
}

.finish-banner{
  text-align:center;
  padding:30px 10px;
  color:var(--paper-dim);
  font-size:14px;
  display:none;
}
.finish-banner.show{display:block;}
.finish-banner .display{font-size:22px; color:var(--paper); margin-bottom:6px;}

/* ===== Bottom note ===== */
.footnote{
  padding:30px 22px 10px;
  text-align:center;
  font-size:11.5px;
  color:var(--paper-dim);
  opacity:0.6;
}

/* sync dot, matches tracker-aw pattern */
.sync-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--paper-dim);
  display:inline-block;
  margin-right:6px;
}
.sync-dot.ok{background:var(--sage);}
.sync-dot.err{background:#B85C5C;}

.toast{
  position:fixed;
  bottom:24px; left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--paper);
  color:var(--ink);
  padding:10px 18px;
  border-radius:20px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:all .25s ease;
  z-index:100;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wordmark">YOGA.AW</div>
    <h1 class="display">Séance du jour</h1>
    <div class="sub" id="dateLabel">—</div>
  </header>

  <div class="streak-meta">
    <span><span id="syncIndicator" class="sync-dot"></span>local — aucun compte requis</span>
    <span><strong id="streakCount">0</strong> jours d'affilée</span>
  </div>
  <div class="streak-strip" id="streakStrip"></div>

  <div class="filters" id="filters"></div>

  <div class="session-list" id="sessionList"></div>

  <div class="footnote">Texte et schémas originaux · zéro publicité · zéro abonnement</div>
</div>

<div class="detail-screen" id="detailScreen">
  <div class="detail-top">
    <button class="back-btn" id="backBtn" aria-label="Retour">←</button>
    <div class="titles">
      <h2 id="detailTitle">—</h2>
      <div class="sub" id="detailSub">—</div>
    </div>
  </div>
  <div class="detail-body">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div id="poseList"></div>
    <div class="finish-banner" id="finishBanner">
      <div class="display">Séance complétée</div>
      <div id="finishStreakMsg">Reviens demain.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
// Diagrams are simple inline SVG line-figures (no external assets, no tracking).

function poseDiagram(kind){
  const stroke = '#7A9B76';
  const dim = '#3a443c';
  const common = `stroke="${stroke}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const svgs = {
    mountain: `<svg viewBox="0 0 120 90" class="pose-diagram" style="height:90px"><circle cx="60" cy="14" r="7" ${common}/><line x1="60" y1="21" x2="60" y2="62" ${common}/><line x1="60" y1="30" x2="40" y2="55" ${common}/><line x1="60" y1="30" x2="80" y2="55" ${common}/><line x1="60" y1="62" x2="48" y2="84" ${common}/><line x1="60" y1="62" x2="72" y2="84" ${common}/></svg>`,
    forwardfold: `<svg viewBox="0 0 120 90" class="pose-diagram" style="height:90px"><circle cx="60" cy="56" r="7" ${common}/><path d="M60 63 Q44 50 50 30" ${common}/><line x1="50" y1="30" x2="36" y2="20" ${common}/><line x1="50" y1="30" x2="64" y2="20" ${common}/><line x1="60" y1="63" x2="64" y2="84" ${common}/><line x1="60" y1="63" x2="76" y2="84" ${common}/></svg>`,
    downdog: `<svg viewBox="0 0 140 80" class="pose-diagram" style="height:80px"><circle cx="40" cy="60" r="6" ${common}/><line x1="44" y1="56" x2="80" y2="22" ${common}/><line x1="80" y1="22" x2="110" y2="58" ${common}/><line x1="110" y1="58" x2="118" y2="74" ${common}/><line x1="80" y1="22" x2="74" y2="32" ${common}/><line x1="36" y1="64" x2="22" y2="74" ${common}/></svg>`,
    warrior2: `<svg viewBox="0 0 140 90" class="pose-diagram" style="height:90px"><circle cx="70" cy="16" r="7" ${common}/><line x1="70" y1="23" x2="70" y2="50" ${common}/><line x1="70" y1="30" x2="40" y2="30" ${common}/><line x1="70" y1="30" x2="100" y2="30" ${common}/><line x1="70" y1="50" x2="48" y2="80" ${common}/><line x1="70" y1="50" x2="100" y2="78" ${common}/><line x1="100" y1="78" x2="118" y2="68" ${common}/></svg>`,
    triangle: `<svg viewBox="0 0 140 90" class="pose-diagram" style="height:90px"><circle cx="78" cy="20" r="7" ${common}/><line x1="78" y1="27" x2="60" y2="55" ${common}/><line x1="78" y1="32" x2="105" y2="14" ${common}/><line x1="60" y1="32" x2="38" y2="48" ${common}/><line x1="60" y1="55" x2="40" y2="80" ${common}/><line x1="60" y1="55" x2="92" y2="80" ${common}/></svg>`,
    childpose: `<svg viewBox="0 0 140 70" class="pose-diagram" style="height:70px"><path d="M30 60 Q60 60 75 30" ${common}/><circle cx="80" cy="22" r="7" ${common}/><line x1="30" y1="60" x2="14" y2="62" ${common}/><line x1="75" y1="50" x2="100" y2="46" ${common}/></svg>`,
    catcow: `<svg viewBox="0 0 140 70" class="pose-diagram" style="height:70px"><path d="M30 50 Q70 30 110 50" ${common}/><circle cx="118" cy="46" r="6" ${common}/><line x1="30" y1="50" x2="30" y2="64" ${common}/><line x1="60" y1="40" x2="60" y2="60" ${common}/><line x1="100" y1="42" x2="100" y2="62" ${common}/></svg>`,
    seated_twist: `<svg viewBox="0 0 120 90" class="pose-diagram" style="height:90px"><circle cx="62" cy="20" r="7" ${common}/><line x1="62" y1="27" x2="55" y2="60" ${common}/><line x1="55" y1="35" x2="80" y2="28" ${common}/><line x1="55" y1="35" x2="34" y2="48" ${common}/><path d="M55 60 Q40 70 30 84" ${common}/><path d="M55 60 Q70 70 78 84" ${common}/></svg>`,
    bridge: `<svg viewBox="0 0 140 70" class="pose-diagram" style="height:70px"><circle cx="22" cy="50" r="6" ${common}/><path d="M28 52 Q70 14 112 52" ${common}/><line x1="112" y1="52" x2="112" y2="68" ${common}/><line x1="60" y1="34" x2="60" y2="68" ${common}/></svg>`,
    pigeon: `<svg viewBox="0 0 140 80" class="pose-diagram" style="height:80px"><circle cx="44" cy="20" r="7" ${common}/><line x1="44" y1="27" x2="50" y2="52" ${common}/><path d="M50 52 Q30 58 24 70" ${common}/><line x1="50" y1="55" x2="100" y2="60" ${common}/><line x1="100" y1="60" x2="118" y2="46" ${common}/></svg>`,
    legs_up: `<svg viewBox="0 0 140 70" class="pose-diagram" style="height:70px"><circle cx="24" cy="52" r="6" ${common}/><line x1="28" y1="55" x2="70" y2="58" ${common}/><line x1="70" y1="58" x2="70" y2="10" ${common}/></svg>`,
    plank: `<svg viewBox="0 0 140 60" class="pose-diagram" style="height:60px"><circle cx="20" cy="40" r="6" ${common}/><line x1="25" y1="38" x2="120" y2="20" ${common}/><line x1="22" y1="46" x2="18" y2="58" ${common}/><line x1="118" y1="22" x2="124" y2="36" ${common}/></svg>`,
    eaglearms: `<svg viewBox="0 0 120 90" class="pose-diagram" style="height:90px"><circle cx="60" cy="16" r="7" ${common}/><line x1="60" y1="23" x2="60" y2="56" ${common}/><path d="M45 32 Q60 40 56 50 Q52 58 64 54" ${common}/><line x1="60" y1="56" x2="50" y2="80" ${common}/><line x1="60" y1="56" x2="70" y2="80" ${common}/></svg>`,
    corpse: `<svg viewBox="0 0 140 50" class="pose-diagram" style="height:50px"><circle cx="20" cy="25" r="6" ${common}/><line x1="26" y1="25" x2="120" y2="25" ${common}/><line x1="70" y1="25" x2="62" y2="38" ${common}/><line x1="70" y1="25" x2="78" y2="38" ${common}/></svg>`,
  };
  return svgs[kind] || svgs.mountain;
}

const PROGRAM = [
  {
    id:'lever-doucement',
    title:'Lever en douceur',
    tagline:'Réveil articulaire, sans précipitation — pour les matins lents',
    tags:['matin','souplesse'],
    minutes:12,
    intensity:1, // 1-3, drives staff peaks
    poses:[
      {name:'Chat-Vache', fr:'Marjaryasana–Bitilasana', dur:'8 respirations', diagram:'catcow',
       steps:['À quatre pattes, poignets sous épaules, genoux sous hanches.','Inspire : creuse le dos, ouvre la poitrine vers le haut (Vache).','Expire : arrondis le dos, regarde le nombril (Chat).','Enchaîne au rythme du souffle, sans à-coup.'],
       cue:'Le mouvement part du bassin, pas des épaules.'},
      {name:'Chien tête en bas', fr:'Adho Mukha Svanasana', dur:'30–45 sec', diagram:'downdog',
       steps:['Des quatre pattes, lève les hanches vers le plafond.','Mains à largeur d\u2019épaules, pieds à largeur de bassin.','Plie les genoux autant que nécessaire pour allonger le dos.','Relâche la tête et le cou, regarde vers les pieds.'],
       cue:'Priorise un dos long plutôt que des jambes droites.'},
      {name:'Posture de l\u2019enfant', fr:'Balasana', dur:'45 sec', diagram:'childpose',
       steps:['Assis sur les talons, genoux écartés ou joints.','Penche le buste vers l\u2019avant, bras tendus ou le long du corps.','Front au sol ou sur les mains empilées.','Respire dans le bas du dos.'],
       cue:'Posture de récupération — y revenir à tout moment.'},
      {name:'Fente basse', fr:'Anjaneyasana', dur:'30 sec / côté', diagram:'warrior2',
       steps:['Du chien tête en bas, avance un pied entre les mains.','Genou arrière au sol, bascule légèrement le bassin vers l\u2019avant.','Bras vers le haut si l\u2019équilibre le permet.','Répète de l\u2019autre côté.'],
       cue:'Sens l\u2019étirement à l\u2019avant de la hanche arrière, pas dans le bas du dos.'},
      {name:'Torsion assise', fr:'Ardha Matsyendrasana', dur:'30 sec / côté', diagram:'seated_twist',
       steps:['Assis, jambes tendues, plie un genou et croise le pied à l\u2019extérieur.','Main opposée sur le genou plié, l\u2019autre derrière toi.','Inspire pour t\u2019allonger, expire pour tourner.','Garde les deux ischions au sol.'],
       cue:'Allonge la colonne avant de tourner, pas l\u2019inverse.'},
      {name:'Posture du cadavre', fr:'Savasana', dur:'2 min', diagram:'corpse',
       steps:['Allongé sur le dos, jambes légèrement écartées.','Bras le long du corps, paumes vers le haut.','Ferme les yeux, laisse le souffle ralentir naturellement.','Reste sans chercher à bouger.'],
       cue:'C\u2019est une posture, pas une pause — reste présent.'}
    ]
  },
  {
    id:'tendons-et-souffle',
    title:'Tendons & souffle',
    tagline:'Tenues isométriques longues, ancrage articulaire — affinité avec le training de force',
    tags:['force','souplesse'],
    minutes:18,
    intensity:3,
    poses:[
      {name:'Posture de la montagne', fr:'Tadasana', dur:'1 min', diagram:'mountain',
       steps:['Debout, pieds joints ou écartés à largeur de bassin.','Répartis le poids également sur les quatre coins des pieds.','Engage légèrement les quadriceps, allonge la colonne.','Épaules relâchées, regard à l\u2019horizon.'],
       cue:'Trouve l\u2019immobilité active : rien ne s\u2019affaisse.'},
      {name:'Guerrier II', fr:'Virabhadrasana II', dur:'45 sec / côté', diagram:'warrior2',
       steps:['Grande fente latérale, pied avant à 90°, pied arrière à 45°.','Genou avant aligné au-dessus de la cheville.','Bras tendus à l\u2019horizontale, regard par-dessus la main avant.','Pousse activement dans les deux pieds.'],
       cue:'Le genou ne dépasse jamais l\u2019orteil — c\u2019est une tenue, pas un sprint.'},
      {name:'Triangle', fr:'Trikonasana', dur:'40 sec / côté', diagram:'triangle',
       steps:['Jambes écartées, pied avant pointé devant.','Bascule depuis la hanche, pas le dos, pour incliner le buste.','Main avant vers le tibia ou le sol, bras arrière vers le ciel.','Regard vers la main levée si le cou le permet.'],

      {name:'Bras d\u2019aigle', fr:'Garudasana (bras)', dur:'30 sec / côté', diagram:'eaglearms',

/* ===================== STATE ===================== */
const STORAGE_KEY = 'yogaaw_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {completions:{}, poseProgress:{}};
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSync(true);
  }catch(e){
    flashSync(false);
  }
}
let state = loadState();

function flashSync(ok){
  const dot = document.getElementById('syncIndicator');
  dot.classList.remove('ok','err');
  dot.classList.add(ok ? 'ok' : 'err');
  setTimeout(()=>dot.classList.remove('ok','err'), 900);
}

function todayKey(d=new Date()){
  return d.toISOString().slice(0,10);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ===================== RENDER: header + streak ===================== */
function renderHeader(){
  const now = new Date();
  document.getElementById('dateLabel').textContent = now.toLocaleDateString('fr-CA', {weekday:'long', day:'numeric', month:'long'});
}

function renderStreak(){
  const strip = document.getElementById('streakStrip');
  strip.innerHTML = '';
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d);
  }
  let streak = 0;
  // compute current streak walking backward from today
  let cursor = new Date();
  while(state.completions[todayKey(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  document.getElementById('streakCount').textContent = streak;

  days.forEach(d=>{
    const key = todayKey(d);
    const el = document.createElement('div');
    el.className = 'streak-day';
    if(state.completions[key]) el.classList.add('done');
    if(key === todayKey()) el.classList.add('today');
    el.textContent = d.toLocaleDateString('fr-CA',{weekday:'narrow'}).toUpperCase();
    strip.appendChild(el);
  });
}

/* ===================== RENDER: filters ===================== */
let activeFilter = 'tous';
const ALL_TAGS = ['tous', ...new Set(PROGRAM.flatMap(s=>s.tags))];

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  ALL_TAGS.forEach(tag=>{
    const b = document.createElement('button');
    b.className = 'filter-chip' + (tag===activeFilter ? ' active' : '');
    b.textContent = tag;
    b.onclick = ()=>{ activeFilter = tag; renderFilters(); renderList(); };
    wrap.appendChild(b);
  });
}

/* ===================== RENDER: session list ===================== */
function staffHTML(session){
  const n = session.poses.length;
  let html = '<div class="staff"><div class="rule"></div><div class="notes">';
  session.poses.forEach((p,i)=>{
    const isPeak = session.intensity >= 2 && (i===Math.floor(n/2) || (session.intensity===3 && i%2===0));
    html += `<div class="note${isPeak?' peak':''}"></div>`;
    if(i < n-1) html += '<div class="gap"></div>';
  });
  html += '</div></div>';
  return html;
}

function renderList(){
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  const filtered = PROGRAM.filter(s => activeFilter==='tous' || s.tags.includes(activeFilter));
  filtered.forEach(session=>{
    const card = document.createElement('div');
    card.className = 'session-card';
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="row1">
        <h3 class="display">${session.title}</h3>
        <div class="duration">${session.minutes} min</div>
      </div>
      <div class="tagline">${session.tagline}</div>
      ${staffHTML(session)}
      <div class="meta-row">
        <span>${session.poses.length} postures</span>
        <span>${session.tags.join(' · ')}</span>
      </div>
    `;
    card.onclick = ()=> openSession(session.id);
    card.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); openSession(session.id);} };
    list.appendChild(card);
  });
}

/* ===================== DETAIL SCREEN ===================== */
let currentSessionId = null;

function openSession(id){
  currentSessionId = id;
  const session = PROGRAM.find(s=>s.id===id);
  if(!state.poseProgress[id]) state.poseProgress[id] = {};

  document.getElementById('detailTitle').textContent = session.title;
  document.getElementById('detailSub').textContent = `${session.minutes} min · ${session.poses.length} postures`;

  const poseList = document.getElementById('poseList');
  poseList.innerHTML = '';
  session.poses.forEach((pose, idx)=>{
    const done = !!state.poseProgress[id][idx];
    const card = document.createElement('div');
    card.className = 'pose-card' + (done ? ' complete' : '');
    card.id = `pose-${idx}`;
    card.innerHTML = `
      <div class="pose-head">
        <div>
          <div class="pose-index">Posture ${idx+1} / ${session.poses.length}</div>
          <h3 class="display">${pose.name}</h3>
          <div class="pose-fr">${pose.fr}</div>
        </div>
        <div class="pose-timer">${pose.dur}</div>
      </div>
      ${poseDiagram(pose.diagram)}
      <ol class="pose-steps">
        ${pose.steps.map(s=>`<li>${s}</li>`).join('')}
      </ol>
      <div class="pose-cue">${pose.cue}</div>
      <button class="mark-done-btn" data-idx="${idx}">${done ? '✓ Complétée' : 'Marquer complétée'}</button>
    `;
    card.querySelector('.mark-done-btn').onclick = ()=> togglePose(id, idx);
    poseList.appendChild(card);
  });

  updateProgress(session);
  document.getElementById('detailScreen').classList.add('open');
  document.getElementById('detailScreen').scrollTop = 0;
}

function togglePose(sessionId, idx){
  const session = PROGRAM.find(s=>s.id===sessionId);
  const cur = !!state.poseProgress[sessionId][idx];
  state.poseProgress[sessionId][idx] = !cur;

  const card = document.getElementById(`pose-${idx}`);
  card.classList.toggle('complete', !cur);
  card.querySelector('.mark-done-btn').textContent = !cur ? '✓ Complétée' : 'Marquer complétée';

  updateProgress(session);
  saveState();

  // auto-complete session if all poses done
  const allDone = session.poses.every((_,i)=>state.poseProgress[sessionId][i]);
  if(allDone){
    state.completions[todayKey()] = true;
    saveState();
    renderStreak();
    document.getElementById('finishBanner').classList.add('show');
    showToast('Séance complétée — streak mis à jour');
  } else {
    document.getElementById('finishBanner').classList.remove('show');
  }
}

function updateProgress(session){
  const done = Object.values(state.poseProgress[session.id] || {}).filter(Boolean).length;
  const pct = Math.round((done / session.poses.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

document.getElementById('backBtn').onclick = ()=>{
  document.getElementById('detailScreen').classList.remove('open');
  document.getElementById('finishBanner').classList.remove('show');
  renderList();
};

/* ===================== INIT ===================== */
renderHeader();
renderStreak();
renderFilters();
renderList();
</script>

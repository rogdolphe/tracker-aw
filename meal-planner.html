<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificateur — Repas & Entraînement</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f6f3; --surface:#fff; --surface2:#f0efe9;
  --border:rgba(0,0,0,.09); --border2:rgba(0,0,0,.18);
  --text:#1a1917; --text2:#6b6a65; --text3:#a09e98;
  --gym:#0C447C; --gym-bg:#E6F1FB;
  --swim:#085041; --swim-bg:#E1F5EE;
  --parc:#27500A; --parc-bg:#EAF3DE;
  --meal:#633806; --meal-bg:#FAEEDA;
  --apero:#72243E; --apero-bg:#FBEAF0;
  --rest:#888780; --rest-bg:#F1EFE8;
  --green:#1d9e75; --r:12px; --rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#131211; --surface:#1e1d1b; --surface2:#282724;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.18);
  --text:#f0ede8; --text2:#9a9892; --text3:#635f5a;
  --gym:#60a5fa; --gym-bg:#0f1f3d;
  --swim:#9fe1cb; --swim-bg:#012a1f;
  --parc:#9fe1a8; --parc-bg:#012a08;
  --meal:#f5c97a; --meal-bg:#2a1a00;
  --apero:#ed93b1; --apero-bg:#2a0a18;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-bar h1{font-size:15px;font-weight:600}
.app-bar p{font-size:10px;color:var(--text2);margin-top:1px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:53px;z-index:99;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.container{max-width:900px;margin:0 auto;padding:16px}
.view{display:none}.view.active{display:block}

/* Grid */
.week-grid{display:grid;grid-template-columns:60px repeat(7,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.grid-header{background:var(--surface2);padding:8px 4px;text-align:center;font-size:11px;font-weight:600;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.grid-header:last-child{border-right:none}
.time-cell{background:var(--surface2);padding:6px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-weight:500}
.grid-cell{border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-height:44px;position:relative;cursor:default}
.grid-cell:last-child{border-right:none}
.block{width:100%;height:100%;padding:4px 5px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:opacity .15s;min-height:44px}
.block:hover{opacity:.85}
.block:active{opacity:.7}
.block-name{font-size:10px;font-weight:600;line-height:1.2}
.block-sub{font-size:9px;opacity:.8;margin-top:1px}
.b-gym{background:var(--gym-bg);color:var(--gym)}
.b-swim{background:var(--swim-bg);color:var(--swim)}
.b-parc{background:var(--parc-bg);color:var(--parc)}
.b-meal{background:var(--meal-bg);color:var(--meal)}
.b-apero{background:var(--apero-bg);color:var(--apero)}
.b-rest{background:var(--rest-bg);color:var(--rest)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:0 0 40px}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 16px}
.modal-header{padding:0 20px 12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:600}
.modal-sub{font-size:12px;color:var(--text2);margin-top:4px}
.modal-body{padding:16px 20px}
.section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:16px 0 8px}
.section-lbl:first-child{margin-top:0}
.kcal-bar{background:var(--surface2);border-radius:var(--rs);padding:10px 14px;display:flex;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.kcal-item{text-align:center}
.kcal-val{font-size:18px;font-weight:600}
.kcal-lbl{font-size:10px;color:var(--text2)}
.ingredient-list{display:flex;flex-direction:column;gap:6px}
.ingredient{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:var(--rs);padding:8px 12px}
.ing-name{font-size:13px;font-weight:500}
.ing-qty{font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:flex-start}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;line-height:1.5;color:var(--text2)}
.tip{background:var(--gym-bg);color:var(--gym);border-radius:var(--rs);padding:10px 14px;font-size:12px;line-height:1.5;margin-top:12px}
.close-btn{width:100%;padding:14px;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;margin-top:20px;font-family:'DM Sans',sans-serif}

/* Grocery */
.store-section{margin-bottom:24px}
.store-header{background:var(--text);color:var(--bg);border-radius:var(--r) var(--r) 0 0;padding:12px 16px}
.store-name{font-size:15px;font-weight:600}
.store-sub{font-size:11px;opacity:.7;margin-top:2px}
.grocery-list{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.grocery-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.grocery-item:last-child{border-bottom:none}
.grocery-item.checked .g-name{text-decoration:line-through;color:var(--text3)}
.g-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.grocery-item.checked .g-check{background:var(--green);border-color:var(--green);color:white}
.g-name{font-size:13px;font-weight:500;flex:1}
.g-qty{font-size:12px;color:var(--text2)}
.g-cat{font-size:10px;color:var(--text3);background:var(--surface2);padding:2px 6px;border-radius:20px}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px}
</style>
</head>
<body>
<div class="app-bar">
  <div><h1>🍽️ Planificateur Semaine</h1><p>Repas · Entraînement · Épicerie</p></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('grille')">📅 Grille horaire</div>
  <div class="tab" onclick="switchTab('epicerie')">🛒 Épicerie</div>
</div>

<div class="container">

<!-- GRILLE -->
<div class="view active" id="view-grille">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#E6F1FB;border:1px solid #93C5FD"></div>Gym</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E1F5EE;border:1px solid #5DCAA5"></div>Natation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EAF3DE;border:1px solid #97C459"></div>Parc</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAEEDA;border:1px solid #F5C97A"></div>Repas</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FBEAF0;border:1px solid #ED93B1"></div>Apéro</div>
  </div>
  <div class="week-grid" id="weekGrid"></div>
</div>

<!-- ÉPICERIE -->
<div class="view" id="view-epicerie">

</div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-sub" id="modalSub"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

const HOURS = ['7h','9h','11h','12h','14h','17h','19h30','21h'];

const MEALS = {
  dejeuner_protein: {

    tip:'Ajouter des pois chiches en canne pour encore plus de protéines sans effort.'

  pasta_proteines: {

    kcal:580, protein:32, carbs:72, fat:14,
    ingredients:[

      {n:'Ketchup', q:'3 c.s.'},

    kcal:280, protein:25, carbs:32, fat:6,
    ingredients:[
      {n:'Yogourt grec vanille', q:'150g'},
      {n:'Miel', q:'1 c.t.'},
      {n:'Framboises gelées', q:'80g'},
      {n:'Céréales muslix', q:'30g'},
    ],
    steps:[
      'Décongeler les framboises 1 min au micro-ondes.',

const WORKOUTS = {
  gym: { name:'Gym — Traction', icon:'🏋️', type:'gym', sub:'Yvon Deschamps · ~70 min' },
  gym_push: { name:'Gym — Poussée', icon:'🏋️', type:'gym', sub:'Yvon Deschamps · ~60 min' },
  gym_lourd: { name:'Gym — Lourd', icon:'🏋️', type:'gym', sub:'Yvon Deschamps · ~70 min' },
  natation: { name:'Natation', icon:'🏊', type:'swim', sub:'Yvon Deschamps · ~45 min' },
  parc: { name:'Parc + Bands', icon:'🌳', type:'parc', sub:'Parc Lafontaine · ~50 min' },

};

// Schedule: [hour_idx, day_idx, content_key, span]
// hour_idx: 0=7h, 1=9h, 2=11h, 3=12h, 4=14h, 5=17h, 6=19h30, 7=21h
const SCHEDULE = [
  // LUNDI - Gym traction
  [0,0,'dejeuner_protein',1],[1,0,'gym',1],[3,0,'collation_post_gym',1],[5,0,'apero_light',1],[6,0,'soupe_lentilles',1],
  // MARDI - Natation
  [0,1,'dejeuner_leger',1],[2,1,'natation',1],[3,1,'sardine_toast',1],[5,1,'apero_light',1],[6,1,'poulet_riz',1],
  // MERCREDI - Gym push
  [0,2,'dejeuner_protein',1],[1,2,'gym_push',1],[3,2,'collation_post_gym',1],[5,2,'apero_light',1],[6,2,'pasta_proteines',1],
  // JEUDI - Parc
  [0,3,'dejeuner_leger',1],[4,3,'parc',1],[5,3,'apero_light',1],[6,3,'tofu_soy',1],
  // VENDREDI - Gym lourd
  [0,4,'dejeuner_protein',1],[1,4,'gym_lourd',1],[3,4,'collation_post_gym',1],[5,4,'apero_light',1],[6,4,'soupe_lentilles',1],
  // SAMEDI - Natation
  [0,5,'dejeuner_leger',1],[2,5,'natation',1],[3,5,'sardine_toast',1],[5,5,'apero_light',1],[6,5,'haricots_soisson',1],
  // DIMANCHE - Repos
  [0,6,'dejeuner_protein',1],[3,6,'soupe_lentilles',1],[5,6,'apero_light',1],[6,6,'tofu_soy',1],[7,6,'repos',1],

const ALL_CONTENT = {...MEALS, ...WORKOUTS};

// Build grid
function buildGrid() {
  const grid = document.getElementById('weekGrid');
  // Headers
  const corner = document.createElement('div');
  corner.className = 'grid-header'; corner.textContent = '';
  grid.appendChild(corner);
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'grid-header'; h.textContent = d;
    grid.appendChild(h);
  });

  // Build lookup
  const lookup = {};
  SCHEDULE.forEach(([hi, di, key]) => { lookup[`${hi}_${di}`] = key; });

  HOURS.forEach((hour, hi) => {
    const tc = document.createElement('div');
    tc.className = 'time-cell'; tc.textContent = hour;
    grid.appendChild(tc);

    DAYS.forEach((_, di) => {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      const key = lookup[`${hi}_${di}`];
      if (key) {
        const content = ALL_CONTENT[key];
        if (content) {
          const typeMap = {meal:'b-meal',apero:'b-apero',gym:'b-gym',swim:'b-swim',parc:'b-parc',rest:'b-rest'};
          const block = document.createElement('div');
          block.className = `block ${typeMap[content.type]||'b-meal'}`;
          block.innerHTML = `<div class="block-name">${content.icon} ${content.name}</div><div class="block-sub">${content.sub||''}</div>`;
          block.onclick = () => openModal(key);
          cell.appendChild(block);
        }
      }
      grid.appendChild(cell);
    });
  });
}

function openModal(key) {
  const content = ALL_CONTENT[key];
  if (!content) return;
  document.getElementById('modalTitle').textContent = `${content.icon} ${content.name}`;
  document.getElementById('modalSub').textContent = content.sub || '';

  let body = '';

  if (content.kcal) {
    body += `<div class="kcal-bar">
      <div class="kcal-item"><div class="kcal-val">${content.kcal}</div><div class="kcal-lbl">kcal</div></div>
      <div class="kcal-item"><div class="kcal-val">${content.protein}g</div><div class="kcal-lbl">protéines</div></div>
      <div class="kcal-item"><div class="kcal-val">${content.carbs}g</div><div class="kcal-lbl">glucides</div></div>
      <div class="kcal-item"><div class="kcal-val">${content.fat}g</div><div class="kcal-lbl">lipides</div></div>
    </div>`;
  }

  if (content.ingredients) {
    body += `<div class="section-lbl">Ingrédients (1 portion)</div>
    <div class="ingredient-list">
      ${content.ingredients.map(i => `<div class="ingredient"><span class="ing-name">${i.n}</span><span class="ing-qty">${i.q}</span></div>`).join('')}
    </div>`;
  }

  if (content.steps) {
    body += `<div class="section-lbl">Préparation</div>
    <div class="steps">
      ${content.steps.map((s,i) => `<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
    </div>`;
  }

  if (content.tip) {
    body += `<div class="tip">💡 ${content.tip}</div>`;
  }

  if (content.type !== 'meal' && content.type !== 'apero') {
    body += `<div class="section-lbl">Entraînement du jour</div>
    <div class="step-text" style="font-size:13px;line-height:1.6">Consulte ton tracker d\'entraînement pour les exercices détaillés et les charges de la session.</div>
    <div class="tip">🥊 Pense à ta collation post-gym dans les 45 min qui suivent.</div>`;
  }

  body += `<button class="close-btn" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modal').classList.add('show');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('show');
  }
}

    html += `<div class="store-section">
      <div class="store-header">
        <div class="store-name">🛒 ${store}</div>
        <div class="store-sub">${items.length} articles</div>

function toggleGrocery(id) {
  document.getElementById(id).classList.toggle('checked');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['grille','epicerie'][i] === name);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
}

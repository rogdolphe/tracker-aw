// Prochaines dates de paye
function nextPayDates(n){
  if(!D.nextPayDate)return[];
  const base=new Date(D.nextPayDate+"T00:00:00");
  const now=new Date();now.setHours(0,0,0,0);
  let cur=new Date(base);
  while(cur<now)cur.setDate(cur.getDate()+14);
  const dates=[];
  for(let i=0;i<n;i++){dates.push(new Date(cur));cur.setDate(cur.getDate()+14);}
  return dates;
}

// Calcule le paiement C1 optimal sans mettre Desjardins en danger
function calcOptimalC1(){
  const buf=D.buffer||175;
  const nextPays=nextPayDates(1);
  if(!nextPays.length)return null;
  const nextPay=nextPays[0];
  const now=new Date();now.setHours(0,0,0,0);
  const daysUntilPay=Math.max(0,Math.round((nextPay-now)/(1000*60*60*24)));
  // Charges débit avant la prochaine paye
  let upcoming=0,upcomingDetails=[];
  for(let i=1;i<=daysUntilPay;i++){
    const d=new Date(now);d.setDate(d.getDate()+i);
    const dn=d.getDate();
    D.subs.filter(s=>s.type==="d"&&s.billingDay===dn).forEach(s=>{upcoming+=s.amt;upcomingDetails.push(s.nom);});
    if(dn===1)(D.sideDebts||[]).filter(s=>s.balance>0).forEach(s=>{const p=Math.min(s.monthlyPmt,s.balance);upcoming+=p;upcomingDetails.push(s.nom);});
  }
  const dailyNeeded=daysUntilPay*D.daily;
  const needed=+(upcoming+dailyNeeded+buf).toFixed(2);
  const available=+(D.des-needed).toFixed(2);
  const stdPmt=D.ccPmtMode==="payday"?D.ccPmt/2:D.ccPmt;
  // Recommandation: payer le max possible sans descendre sous le buffer
  const recommendation=+Math.min(Math.max(0,available),stdPmt*1.5).toFixed(2);
  // Si Desjardins est bien au-dessus du nécessaire, suggérer un transfert supplémentaire
  const extraAvail=+(available-stdPmt).toFixed(2);
  return{daysUntilPay,nextPayLabel:nextPay.toLocaleDateString("fr-CA",{day:"numeric",month:"long"}),upcoming,upcomingDetails,dailyNeeded,needed,available,stdPmt,recommendation,extraAvail,buf};
}

// Suggère le budget quotidien basé sur la situation financière réelle
function calcBudgetSuggestion(){
  const buf=D.buffer||175;
  const nextPays=nextPayDates(1);
  if(!nextPays.length)return{suggested:D.daily,level:"ok",icon:"🟢",reason:"Paye non configurée — cible par défaut.",daysLeft:14,available:0,pct:1};
  const nextPay=nextPays[0];
  const now=new Date();now.setHours(0,0,0,0);
  const daysLeft=Math.max(1,Math.round((nextPay-now)/(1000*60*60*24)));
  let upcoming=0,charges=[];
  for(let i=1;i<=daysLeft;i++){
    const d=new Date(now);d.setDate(d.getDate()+i);
    const dn=d.getDate(),dStr=d.toISOString().split("T")[0];
    D.subs.filter(s=>s.type==="d"&&s.billingDay===dn).forEach(s=>{upcoming+=s.amt;charges.push(s.nom.split(" ")[0]);});
    if(dn===1)(D.sideDebts||[]).filter(s=>s.balance>0).forEach(s=>{upcoming+=Math.min(s.monthlyPmt,s.balance);charges.push(s.nom.split(" ")[0]);});
    if(D.ccPmtMode==="payday"&&isPayDay(dStr)){upcoming+=D.ccPmt/2;charges.push("C1");}
  }
  const available=D.des-upcoming-buf;
  const rawPerDay=available/daysLeft;
  const suggested=Math.min(D.daily,Math.max(0,Math.floor(rawPerDay/5)*5));
  const pct=D.daily>0?suggested/D.daily:1;
  let level,icon,reason;
  if(suggested===0){level="urgent";icon="🚨";reason=`Aucun budget disponible — ${charges.length?charges.slice(0,3).join(", ")+" arrivent.":"charges à venir."} Dépenses minimales seulement.`;}
  else if(pct<0.5){level="danger";icon="🔴";reason=`Période chargée${charges.length?` (${charges.slice(0,2).join(", ")})`:""} — réduis au maximum.`;}
  else if(pct<0.875){level="warn";icon="🟡";reason=`Légèrement réduit${charges.length?` — ${charges[0]} à venir`:""}.`;}
  else{level="ok";icon="🟢";reason=suggested===D.daily?"Budget cible 🎯":"Situation confortable.";}
  return{suggested,daysLeft,upcoming,available,level,icon,reason,pct,nextPayLabel:nextPay.toLocaleDateString("fr-CA",{day:"numeric",month:"long"})};
}

const fv=(v,d=2)=>(v<0?"-":"")+"\$\u00a0"+Math.abs(v).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");
const col=v=>v>=0?"var(--grn)":"var(--red)";

function monthly(){
  const inc=D.paye*26/12;
  const fd=D.subs.filter(s=>s.type==="d").reduce((a,s)=>a+s.amt,0);
  const fc=D.subs.filter(s=>s.type==="c").reduce((a,s)=>a+s.amt,0);
  const day=D.daily*30;
  const cm=curMonth();
  const mev=(D.events||[]).filter(e=>e.date.slice(0,7)===cm);
  const xInc=mev.filter(e=>e.type==="income").reduce((a,e)=>a+e.amt,0);
  const xExp=mev.filter(e=>e.type==="expense").reduce((a,e)=>a+e.amt,0);
  const sdPmt=(D.sideDebts||[]).filter(s=>s.balance>0).reduce((a,s)=>a+Math.min(s.monthlyPmt,s.balance),0);
  // Billing-day awareness
  const dom=new Date().getDate(); // day of month right now
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const daysLeft=daysInMonth-dom;
  const debitSubs=D.subs.filter(s=>s.type==="d");
  const debitBilled=debitSubs.filter(s=>s.billingDay&&s.billingDay<=dom).reduce((a,s)=>a+s.amt,0);
  const debitUpcoming=debitSubs.filter(s=>!s.billingDay||s.billingDay>dom).reduce((a,s)=>a+s.amt,0);
  const creditBilled=D.subs.filter(s=>s.type==="c"&&s.billingDay&&s.billingDay<=dom).reduce((a,s)=>a+s.amt,0);
  const creditUpcoming=D.subs.filter(s=>s.type==="c"&&(!s.billingDay||s.billingDay>dom)).reduce((a,s)=>a+s.amt,0);
  // Projected Desjardins at end of month (conservative: no income adjustment)
  const desEOM=D.des-debitUpcoming-(daysLeft*D.daily);
  return{inc,fd,fc,day,xInc,xExp,sdPmt,sur:inc+xInc-xExp-fd-fc-day-D.ccPmt-sdPmt,
    debitBilled,debitUpcoming,creditBilled,creditUpcoming,desEOM,daysLeft,dom};
}
function payoff(bal,apr,pmt,mx=60){
  const r=apr/100/12;let b=bal;const rows=[];
  for(let m=1;m<=mx;m++){const i=b*r;b=b+i-pmt;rows.push({b:Math.max(0,b),i});if(b<=0)break;}
  const pi=rows.findIndex(r=>r.b===0);
  return{rows,mo:pi>=0?pi+1:null,ti:rows.reduce((s,r)=>s+r.i,0)};
}
function payoffSd(bal,pmt){
  if(pmt<=0||bal<=0)return{mo:null,total:0};
  return{mo:Math.ceil(bal/pmt),total:Math.ceil(bal/pmt)*pmt};
}
function projection(){
  const inc=D.paye*26/12,r=D.apr/100/12;
  const fd=D.subs.filter(s=>s.type==="d"&&s.cat!=="dette").reduce((a,s)=>a+s.amt,0);
  const fc=D.subs.filter(s=>s.type==="c"&&s.cat!=="dette").reduce((a,s)=>a+s.amt,0);
  const day=D.daily*30;
  let des=D.des,cc=D.c1;
  let sd=(D.sideDebts||[]).map(s=>({...s}));
  const cm=curMonth();
  return["Juin","Juil","Août","Sep","Oct","Nov"].map((l,idx)=>{
    const fm=new Date();fm.setMonth(fm.getMonth()+idx);const fmStr=fm.toISOString().slice(0,7);
    const mev=(D.events||[]).filter(e=>e.date.slice(0,7)===fmStr);
    const xInc=mev.filter(e=>e.type==="income").reduce((a,e)=>a+e.amt,0);
    const xExp=mev.filter(e=>e.type==="expense").reduce((a,e)=>a+e.amt,0);
    const sdPmt=sd.filter(s=>s.balance>0).reduce((a,s)=>a+Math.min(s.monthlyPmt,s.balance),0);
    sd=sd.map(s=>s.balance>0?{...s,balance:Math.max(0,s.balance-s.monthlyPmt)}:s);
    des=des+inc+xInc-xExp-fd-day-D.ccPmt-sdPmt;
    cc=Math.max(0,cc+cc*r+fc-D.ccPmt);
    return{l,des:+des.toFixed(2),cc:+cc.toFixed(2),net:+(des+D.ws-cc).toFixed(2)};
  });
}

function hasGoal(){return D.goal&&D.goal.startBalance>0&&D.goal.months>0;}
function calcInd(actual){
  if(!hasGoal())return null;
  const{startDate,startBalance,targetBalance,months}=D.goal;
  const mEl=Math.max(0,(Date.now()-new Date(startDate).getTime())/(1000*60*60*24*30.4375));
  const mo=(startBalance-targetBalance)/months;
  const exp=Math.max(targetBalance,startBalance-mEl*mo);

  return{actual,expected:exp,delta,monthly:mo,color,emoji:{green:"🟢",yellow:"🟡",red:"🔴"}[color]};
}

// ── WEEKLY PROJECTION (8 semaines par quart) ─────────────────────────────────
function weeklyProj(n=8){
  const now=new Date();now.setHours(0,0,0,0);
  let des=D.des,c1=D.c1;
  let sd=(D.sideDebts||[]).map(s=>({...s}));
  const rows=[];
  const cur=new Date(now);
  cur.setDate(cur.getDate()+1); // demain = point de départ
  for(let w=0;w<n;w++){
    const wS=new Date(cur),wE=new Date(cur);
    wE.setDate(wE.getDate()+6);
    const day=new Date(wS);
    while(day<=wE){
      const dStr=day.toISOString().split("T")[0];
      const dn=day.getDate();
      if(isPayDay(dStr)){des+=D.paye;if(D.ccPmtMode==="payday"){des-=D.ccPmt/2;c1=Math.max(0,c1-D.ccPmt/2);}}
      D.subs.filter(s=>s.type==="d"&&s.billingDay===dn).forEach(s=>des-=s.amt);
      if(D.ccPmtMode!=="payday"&&dn===(D.ccPayDay||1)){des-=D.ccPmt;c1=Math.max(0,c1-D.ccPmt);}
      if(dn===1){sd=sd.map(s=>{if(s.balance<=0)return s;const p=Math.min(s.monthlyPmt,s.balance);des-=p;return{...s,balance:Math.max(0,s.balance-p)};});}
      D.subs.filter(s=>s.type==="c"&&s.billingDay===dn).forEach(s=>c1+=s.amt);
      des-=D.daily;
      (D.events||[]).filter(e=>e.date===dStr).forEach(e=>{e.type==="income"?des+=e.amt:des-=e.amt;});
      day.setDate(day.getDate()+1);
    }
    const mo=wS.toLocaleDateString("fr-CA",{month:"short"});
    const qn=Math.ceil((wS.getMonth()+1)/3);
    rows.push({w:w+1,lbl:`${wS.getDate()} ${mo}`,q:`Q${qn} ${wS.getFullYear()}`,
      des:+des.toFixed(2),c1:+c1.toFixed(2),net:+(des+D.ws-c1).toFixed(2)});
    cur.setDate(cur.getDate()+7);
  }
  return rows;
}

// Prochains 30 jours — tous les événements financiers
function buildNext30(){
  const now=new Date();now.setHours(0,0,0,0);
  const EVC={income:"#16a34a",debit:"#dc2626",cc:"#dc2626",sidedebt:"#dc2626",credit:"#d97706",expense:"#dc2626",interest:"#6b21a8"};
  const EVL={income:"↙ DES +",debit:"↙ DES −",cc:"↙ DES − / C1 ↓",sidedebt:"↙ DES −",credit:"→ C1 ↑",expense:"↙ DES −",interest:"→ C1 ↑ (auto)"};
  const days=[];
  for(let i=1;i<=30;i++){
    const d=new Date(now);d.setDate(d.getDate()+i);
    const dStr=d.toISOString().split("T")[0];
    const dn=d.getDate();
    const dow=d.getDay()===0?6:d.getDay()-1;
    const evs=[];
    // Pay + C1 payment on pay day
    if(isPayDay(dStr)){
      evs.push({type:"income",label:"Paye bi-hebdo",amt:D.paye});
      if(D.ccPmtMode==="payday")evs.push({type:"cc",label:"Remboursement C1",amt:D.ccPmt/2});
    }
    // Debit subscriptions
    D.subs.filter(s=>s.type==="d"&&s.billingDay===dn).forEach(s=>evs.push({type:"debit",label:s.nom,amt:s.amt}));
    // Monthly C1 payment (if mode = monthly)
    if(D.ccPmtMode!=="payday"&&dn===(D.ccPayDay||1))evs.push({type:"cc",label:"Remboursement C1",amt:D.ccPmt});
    // Credit subscriptions (go on C1)
    D.subs.filter(s=>s.type==="c"&&s.billingDay===dn).forEach(s=>evs.push({type:"credit",label:s.nom,amt:s.amt}));
    // C1 interest auto (on statement day)
    if(dn===(D.c1StatementDay||15)){
      const ci=+(D.c1*D.apr/100/12).toFixed(2);
      evs.push({type:"interest",label:"Intérêts C1 (calculé auto)",amt:ci});
    }
    // Side debt payments on 1st
    if(dn===1)(D.sideDebts||[]).filter(s=>s.balance>0).forEach(s=>evs.push({type:"sidedebt",label:s.nom,amt:Math.min(s.monthlyPmt,s.balance)}));
    // One-time events
    (D.events||[]).filter(e=>e.date===dStr).forEach(e=>evs.push({type:e.type==="income"?"income":"expense",label:e.nom,amt:e.amt}));
    if(evs.length>0)days.push({d:dn,dStr,dow,date:new Date(d),evs,EVC,EVL});
  }
  return days;
}

// ── CALENDAR HELPERS ─────────────────────────────────────────────────────────
function isPayDay(dateStr){
  if(!D.nextPayDate)return false;
  const base=new Date(D.nextPayDate+"T00:00:00");
  const d=new Date(dateStr+"T00:00:00");
  const diff=Math.round((d-base)/(1000*60*60*24));
  return diff>=0&&diff%14===0;
}

function buildCal(year,month){
  const now=new Date();now.setHours(0,0,0,0);
  const todayStr=now.toISOString().split("T")[0];
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const daysInMonth=last.getDate();
  // Project balances day by day from tomorrow onward
  const tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);
  const projEnd=new Date(year,month+1,0);
  let des=D.des,c1=D.c1;
  const bal={};
  const cur=new Date(tomorrow);
  // Run side debts copy to track remaining
  let sdCopy=(D.sideDebts||[]).map(s=>({...s}));
  while(cur<=projEnd){
    const dStr=cur.toISOString().split("T")[0];
    const dn=cur.getDate();
    if(isPayDay(dStr)){des+=D.paye;if(D.ccPmtMode==="payday"){des-=D.ccPmt/2;c1=Math.max(0,c1-D.ccPmt/2);}}
    D.subs.filter(s=>s.type==="d"&&s.billingDay===dn).forEach(s=>des-=s.amt);
    if(D.ccPmtMode!=="payday"&&dn===(D.ccPayDay||1)){des-=D.ccPmt;c1=Math.max(0,c1-D.ccPmt);}
    if(dn===1){
      sdCopy=sdCopy.map(s=>{
        if(s.balance<=0)return s;
        const pmt=Math.min(s.monthlyPmt,s.balance);
        des-=pmt;
        return{...s,balance:Math.max(0,s.balance-pmt)};
      });
    }
    D.subs.filter(s=>s.type==="c"&&s.billingDay===dn).forEach(s=>c1+=s.amt);
    c1*=(1+D.apr/100/365);
    des-=D.daily;
    (D.events||[]).filter(e=>e.date===dStr).forEach(e=>{e.type==="income"?des+=e.amt:des-=e.amt;});
    bal[dStr]={des:+des.toFixed(2),c1:+c1.toFixed(2)};
    cur.setDate(cur.getDate()+1);
  }
  // Build cells
  const cells=[];
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(year,month,d);
    const dStr=dt.toISOString().split("T")[0];
    const dow=dt.getDay()===0?6:dt.getDay()-1; // 0=Mon 6=Sun
    const isPast=dt<now;
    const isToday=dStr===todayStr;
    const evs=[];
    if(isPayDay(dStr)){evs.push({type:"income",label:"Paye",amt:D.paye});if(D.ccPmtMode==="payday")evs.push({type:"cc",label:"Pmt C1",amt:D.ccPmt/2});}
    D.subs.filter(s=>s.type==="d"&&s.billingDay===d).forEach(s=>evs.push({type:"debit",label:s.nom,amt:s.amt}));
    if(D.ccPmtMode!=="payday"&&d===(D.ccPayDay||1))evs.push({type:"cc",label:"Paiement C1",amt:D.ccPmt});
    D.subs.filter(s=>s.type==="c"&&s.billingDay===d).forEach(s=>evs.push({type:"credit",label:s.nom,amt:s.amt}));
    if(d===1)(D.sideDebts||[]).filter(s=>s.balance>0).forEach(s=>evs.push({type:"sidedebt",label:s.nom,amt:Math.min(s.monthlyPmt,s.balance)}));
    (D.events||[]).filter(e=>e.date===dStr).forEach(e=>evs.push({type:e.type==="income"?"income":"expense",label:e.nom,amt:e.amt}));
    cells.push({d,dStr,dow,isPast,isToday,evs,bal:bal[dStr]||null});
  }
  // First col offset (Mon=0)
  const firstDOW=first.getDay()===0?6:first.getDay()-1;
  return{year,month,daysInMonth,cells,firstDOW,eomBal:bal[last.toISOString().split("T")[0]]||null};
}

      <div style="font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">${l}</div>
      <div style="font-size:15px;font-weight:600;color:${v===null?"var(--tx3)":v>=0?cp:cn}">
        ${v===null?"—":fv(v)}
      </div>
    </div>`).join("")}
  </div>
  ${!D.nextPayDate?`<div style="font-size:10px;color:var(--tx3);margin-top:10px;font-style:italic">⚠️ Entre ta prochaine date de paye en haut pour que les projections incluent tes revenus.</div>`:""}
</div>`;
  } // end tab 5

  // ── TAB 6 : CONSEILS ───────────────────────────────────────────────────────
  if(tab===6){ renderConseils(); }

} // end render()

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function slSt(pf){
  return[["Remboursé en",pf.mo?`${pf.mo} mois`:"N/A"],["Intérêts payés",fv(pf.ti)],["Total déboursé",pf.mo?fv(dSlider*pf.mo):"—"]]
    .map(([l,v])=>`<div style="text-align:center;background:var(--bg2);border-radius:6px;padding:8px 4px">
      <div style="font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.11em;margin-bottom:4px">${l}</div>
      <div style="font-size:14px;font-weight:500;color:var(--amb);font-family:monospace">${v}</div>
    </div>`).join("");
}
function rSF(){
  const w=$("sf-wrap");if(!w)return;
  const ex=subEdit!=="new"?D.subs.find(s=>s.id===subEdit):null;
  const td2=today();
  w.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:12px;margin-bottom:14px">
    <div class="g2">
      <div>${lbl("Nom")}<input id="sf-n" value="${ex?.nom||""}" placeholder="Ex: Netflix"></div>
      <div>${lbl("Montant ($)")}<input id="sf-a" type="number" step=".01" value="${ex?.amt||""}" placeholder="0.00"></div>
      <div>${lbl("Compte")}<select id="sf-t"><option value="d"${(ex?.type||"c")==="d"?" selected":""}>Débit</option><option value="c"${(ex?.type||"c")==="c"?" selected":""}>Crédit</option></select></div>
      <div>${lbl("Catégorie")}<select id="sf-c">${CATS.map(c=>`<option value="${c}"${c===(ex?.cat||"loisirs")?" selected":""}>${c}</option>`).join("")}</select></div>
      <div>${lbl("Jour de prélèvement (1–31)")}<input id="sf-d" type="number" min="1" max="31" step="1" value="${ex?.billingDay||""}" placeholder="Ex: 1, 15, 28…"></div>
    </div>
    <div style="display:flex;gap:8px"><button class="pri" onclick="cSub()">Confirmer</button><button onclick="xSub()">Annuler</button></div>
  </div>`;
}
function rSdF(){
  const w=$("sd-form");if(!w)return;
  const ex=sdEdit!=="new"?(D.sideDebts||[]).find(s=>s.id===sdEdit):null;
  const td2=today();
  w.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:12px;margin-bottom:14px">
    <div class="g2">
      <div>${lbl("Nom de la dette")}<input id="sd-n" value="${ex?.nom||""}" placeholder="Ex: Billet de stationnement"></div>
      <div>${lbl("Solde restant ($)")}<input id="sd-b" type="number" step=".01" value="${ex?.balance||""}" placeholder="0.00"></div>
      <div>${lbl("Paiement mensuel ($)")}<input id="sd-p" type="number" step=".01" value="${ex?.monthlyPmt||""}" placeholder="0.00"></div>
      <div>${lbl("Date de début")}<input id="sd-d" type="date" value="${ex?.startDate||td2}"></div>
    </div>
    <div style="display:flex;gap:8px"><button class="pri" onclick="cSd()">Confirmer</button><button onclick="xSd()">Annuler</button></div>
  </div>`;
}

// ── INDICATOR ─────────────────────────────────────────────────────────────────
window.updInd=function(){
  const v=$("ci-c")?.value,box=$("ci-ind"),rp=$("ci-rp");
  if(!v||!hasGoal()){if(box)box.innerHTML="";if(rp)rp.style.display="none";return;}
  const a=parseFloat(v);if(isNaN(a))return;
  const p=calcInd(a);
  if(box)box.innerHTML=indHTML(p);
  if(rp)rp.style.display=p.color!=="green"?"block":"none";
};
window.selR=function(btn){
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  const o=$("ci-roth");if(o)o.style.display=btn.dataset.r==="Autre…"?"block":"none";
};
function getReason(){
  const s=document.querySelector(".rbtn.sel");if(!s)return"";
  return s.dataset.r==="Autre…"?($("ci-roth")?.value||"Autre"):s.dataset.r;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
window.sT=i=>{tab=i;subEdit=null;evType=null;sdEdit=null;render();};

window.doCI=function(){
  const d=$("ci-d")?.value,c=$("ci-c")?.value,w=$("ci-w")?.value,n=$("ci-n")?.value;
  if(!d&&!c&&!w)return;
  const cc=c?parseFloat(c):D.c1;
  const perf=calcInd(cc);
  const entry={date:new Date().toLocaleDateString("fr-CA"),des:d?parseFloat(d):D.des,cc,sav:w?parseFloat(w):D.ws,note:n||"",reason:getReason(),indicator:perf?.emoji||"",expected:perf?+perf.expected.toFixed(2):null};
  D.des=entry.des;D.c1=entry.cc;D.ws=entry.sav;
  D.history=[entry,...D.history].slice(0,30);
  save();logToSheets(entry,perf);render();
};
window.updPaye=function(){
  const v=parseFloat($("paye-inp")?.value);
  const nd=$("paye-date")?.value;
  if(!isNaN(v)&&v>0)D.paye=v;
  if(nd)D.nextPayDate=nd;
  payeEditMode=false;save();render();
};
window.togglePayeEdit=function(){payeEditMode=!payeEditMode;render();};
window.addEv=t=>{evType=t;render();};
window.cancelEv=()=>{evType=null;render();};
window.commitEv=function(){
  const nom=($("ef-nom")?.value||"").trim(),amt=parseFloat($("ef-amt")?.value||0),date=$("ef-date")?.value||today();
  const payWith=document.querySelector('input[name="ef-pay"]:checked')?.value||"none";
  if(!nom||amt<=0)return;
  D.events=[{id:D.nextEvId++,date,type:evType,nom,amt,payWith},...(D.events||[])];
  // Mettre à jour le solde immédiatement selon le mode de paiement
  if(payWith==="debit"){
    if(evType==="income")D.des=+(D.des+amt).toFixed(2);
    else D.des=+(D.des-amt).toFixed(2);
  } else if(payWith==="credit"){
    if(evType==="expense")D.c1=+(D.c1+amt).toFixed(2); // dépense sur C1
    else D.c1=+Math.max(0,D.c1-amt).toFixed(2); // revenu réduit C1 (paiement)
  }
  evType=null;save();render();
};
window.delEv=id=>{D.events=(D.events||[]).filter(e=>e.id!==id);save();render();};
window.onSl=function(v){
  dSlider=parseInt(v);
  const sv=$("sv");if(sv)sv.textContent=fv(dSlider,0)+"/m";
  const ss=$("ss");if(ss)ss.innerHTML=slSt(payoff(D.c1,D.apr,dSlider));
};
window.apPmt=()=>{D.ccPmt=dSlider;save();render();};
// Enregistre un paiement C1 comme événement + met à jour les soldes
window.doTransferC1=function(amt){
  if(!amt||amt<=0)return;
  const today2=today();
  D.des=+(D.des-amt).toFixed(2);
  D.c1=+Math.max(0,D.c1-amt).toFixed(2);
  D.events=[{id:D.nextEvId++,date:today2,type:"income",nom:`Paiement Capital One (${fv(amt,0)})`,amt,payWith:"transfer"},...(D.events||[])];
  save();render();
};
window.uP=function(k,v){const n=parseFloat(v);D[k]=isNaN(n)?v:n;save();render();};
window.uStr=(k,v)=>{D[k]=v;save();render();};
window.uGoal=function(k,v){
  if(k==="startDate")D.goal[k]=v;
  else{const n=parseFloat(v);D.goal[k]=isNaN(n)?D.goal[k]:n;}
  save();render();
};
window.oAdd=()=>{subEdit="new";rSF();};
window.oEdit=id=>{subEdit=id;rSF();};
window.dSub=id=>{D.subs=D.subs.filter(s=>s.id!==id);save();render();};
window.xSub=()=>{subEdit=null;const w=$("sf-wrap");if(w)w.innerHTML="";};
window.cSub=function(){
  const nom=$("sf-n")?.value,amt=parseFloat($("sf-a")?.value||0);
  const type=$("sf-t")?.value,cat=$("sf-c")?.value;
  const bdRaw=parseInt($("sf-d")?.value);
  const billingDay=(bdRaw>=1&&bdRaw<=31)?bdRaw:null;
  if(!nom||amt<=0)return;
  if(subEdit==="new")D.subs.push({id:D.nextId++,nom,amt,type,cat,billingDay});
  else D.subs=D.subs.map(s=>s.id===subEdit?{...s,nom,amt,type,cat,billingDay}:s);
  subEdit=null;save();render();
};
window.calNav=function(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  calView="grid";
  render();
};
window.setPaySettings=function(){
  const npd=$("npd")?.value;
  const cpd=parseInt($("cpd")?.value)||1;
  if(npd){D.nextPayDate=npd;}
  D.ccPayDay=Math.min(28,Math.max(1,cpd));
  save();render();
};
window.editSd=id=>{sdEdit=id;rSdF();};
window.delSd=id=>{D.sideDebts=(D.sideDebts||[]).filter(s=>s.id!==id);save();render();};
window.xSd=()=>{sdEdit=null;const w=$("sd-form");if(w)w.innerHTML="";};
window.cSd=function(){
  const nom=($("sd-n")?.value||"").trim(),bal=parseFloat($("sd-b")?.value||0),pmt=parseFloat($("sd-p")?.value||0),startDate=$("sd-d")?.value||today();
  if(!nom||bal<0||pmt<=0)return;
  if(sdEdit==="new"){D.sideDebts=[...(D.sideDebts||[]),{id:D.nextSdId++,nom,balance:bal,origBalance:bal,monthlyPmt:pmt,startDate}];}
  else{D.sideDebts=(D.sideDebts||[]).map(s=>s.id===sdEdit?{...s,nom,balance:bal,monthlyPmt:pmt,startDate}:s);}
  sdEdit=null;save();render();
};

// ── CONSEILS : ANALYSE QUOTIDIENNE ───────────────────────────────────────────
function generateAdvice(){
  const m=monthly(),ci=calcInd(D.c1);
  const interest=D.c1*D.apr/100/12;
  const creditSubs=D.subs.filter(s=>s.type==="c"&&s.cat!=="dette").reduce((a,s)=>a+s.amt,0);
  const netC1=D.ccPmt-creditSubs-interest;
  const pf=payoff(D.c1,D.apr,D.ccPmt);
  const leisure=D.subs.filter(s=>s.cat==="loisirs");
  const leisureTotal=leisure.reduce((a,s)=>a+s.amt,0);
  const ads=[];

  if(D.des<=0)
    ads.push({lvl:"urgent",ico:"🚨",title:"Compte Desjardins à zéro",
      text:`Solde à ${fv(D.des)}. N'utilise pas cette carte — ressources d'urgence dans la section ci-dessous.`});
  else if(D.des<D.daily)
    ads.push({lvl:"urgent",ico:"🚨",title:"Solde insuffisant pour aujourd'hui",
      text:`${fv(D.des)} disponible, budget quotidien ${fv(D.daily,0)}/j. Limite les dépenses au strict nécessaire.`});

  if(D.ccPmt<interest+80)
    ads.push({lvl:"urgent",ico:"⚠️",title:"Paiement C1 couvre à peine les intérêts",
      text:`À ${fv(D.ccPmt)}/mois avec ${fv(interest)}/mois d'intérêts, la dette réelle ne recule que de ${fv(Math.max(0,D.ccPmt-interest))}. Augmente à ${fv(Math.ceil((interest+200)/25)*25,0)}/mois minimum.`});

  ads.push({lvl:netC1>200?"good":netC1>0?"info":"high",ico:"💳",
    title:"Décomposition réelle de ton paiement C1",
    text:`Paiement : ${fv(D.ccPmt)}/mois
 − Intérêts (${D.apr}% APR) : ${fv(interest)}
 − Abonnements crédit : ${fv(creditSubs)}
 = Remboursement réel de la dette : ${fv(Math.max(0,netC1))}/mois

${pf.mo?`→ À ce rythme, tu es libre de cette dette dans ${pf.mo} mois (${fv(pf.ti)} d'intérêts).`:"→ Augmente le paiement pour commencer à rembourser réellement."}
💡 Règle : paiement C1 ≥ intérêts + abonnements crédit + $300 minimum.`});

  if(hasGoal()&&ci){
    if(ci.color==="green")
      ads.push({lvl:"good",ico:"🎯",title:"Objectif C1 — en avance",text:`${fv(Math.abs(ci.delta))} en avance. Continue ce rythme.`});
    else if(ci.color==="yellow")
      ads.push({lvl:"info",ico:"🟡",title:"Objectif C1 — léger écart",text:`${fv(ci.delta)} de retard. Réductible en diminuant les variables ce mois.`});
    else
      ads.push({lvl:"high",ico:"🔴",title:"Objectif C1 — hors trajectoire",text:`${fv(ci.delta)} de retard. Pour rattraper : +${fv(Math.ceil(ci.delta/2/25)*25,0)}/mois pendant 2 mois.`});
  }

  (D.sideDebts||[]).filter(s=>s.balance>0).forEach(sd=>{
    const mo=Math.ceil(sd.balance/sd.monthlyPmt);
    if(mo<=1) ads.push({lvl:"good",ico:"🎉",title:`${sd.nom} — dernier paiement!`,
      text:`${fv(sd.balance)} restant — ce mois c'est fini. Les ${fv(sd.monthlyPmt)}/mois qui se libèrent: applique-les immédiatement à Capital One.`});
    else if(mo<=3) ads.push({lvl:"good",ico:"⏱️",title:`${sd.nom} — fini dans ${mo} mois`,
      text:`${fv(sd.balance)} restant. Dès remboursé, rediriger ${fv(sd.monthlyPmt)}/mois vers C1 = accélère le remboursement global.`});
  });

  if(m.desEOM<-200)
    ads.push({lvl:"high",ico:"📉",title:`Déficit projeté fin de mois : ${fv(m.desEOM)}`,
      text:`Charges à venir ${fv(m.debitUpcoming)} + budget ${m.daysLeft}j ${fv(m.daysLeft*D.daily,0)} = problème. Réduis les variables ou vire depuis Wealthsimple (${fv(D.ws)} dispo).`});

  if(leisureTotal>40)
    ads.push({lvl:"info",ico:"📱",title:`Loisirs : ${fv(leisureTotal)}/mois`,
      text:`${leisure.map(s=>s.nom).join(", ")}. Supprimer 1 = ${fv(leisureTotal/leisure.length,0)}/mois × 12 = ${fv(leisureTotal/leisure.length*12,0)}/an de plus vers Capital One.`});

  const lastCI=D.history[0];
  const daysAgo=lastCI?Math.round((Date.now()-new Date(lastCI.date.split("/").reverse().join("-")+"T12:00:00").getTime())/(1000*60*60*24)):null;
  ads.push({lvl:daysAgo&&daysAgo<=3?"good":"info",ico:"🔄",title:`Mise à jour : automatique à chaque ouverture${daysAgo?` · Dernière saisie il y a ${daysAgo}j`:" · Aucune saisie encore"}`,
    text:`Les projections et le calendrier se recalculent depuis aujourd'hui (${new Date().toLocaleDateString("fr-CA")}) à chaque fois que tu ouvres la page. Les soldes de BASE (Desjardins, C1, WS) doivent être mis à jour manuellement via le check-in dans Tableau de bord. → Fréquence idéale : après chaque paye (1×/2 semaines).`});

  return ads;
}

// ── TAB 6 RENDER (appelé depuis render()) ────────────────────────────────────
function renderConseils(){
  const ads=generateAdvice();
  const body=$("body");
  const lvlStyle={
    urgent:{bg:"var(--red-bg)",bd:"#fca5a5",tc:"var(--red)"},
    high:  {bg:"var(--amb-bg)",bd:"#fcd34d",tc:"var(--amb)"},
    good:  {bg:"var(--grn-bg)",bd:"#86efac",tc:"var(--grn)"},
    info:  {bg:"var(--bg2)",bd:"var(--bd2)",tc:"var(--tx2)"},
  };
  body.innerHTML=`
<div class="card" style="background:var(--grn-bg);border-color:#86efac">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:11px;font-weight:600;color:var(--grn)">📊 Analyse du jour — ${new Date().toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"})}</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:9px;color:var(--grn)">
      <span style="width:7px;height:7px;background:var(--grn);border-radius:50%;display:inline-block;animation:pulse 2s infinite"></span>
      AUTO-ACTUALISÉ
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
    ${[
      ["Desjardins",D.des,D.des>=D.daily?"✅":"🚨"],
      ["Capital One",-D.c1,D.c1<4000?"🟡":"🔴"],
      ["Valeur nette",D.des+D.ws-D.c1,(D.des+D.ws-D.c1)>=0?"🟢":"🔴"],
    ].map(([l,v,ic])=>`<div style="text-align:center;background:var(--bg1);border-radius:5px;padding:7px 4px">
      <div style="font-size:14px;line-height:1">${ic}</div>
      <div style="font-size:10px;color:var(--tx2);margin:3px 0 2px">${l}</div>
      <div style="font-size:13px;font-weight:600;color:${col(v)}">${fv(v)}</div>
    </div>`).join("")}
  </div>
</div>

<div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px 2px">💡 Recommandations personnalisées</div>
${ads.map(a=>{const s=lvlStyle[a.lvl]||lvlStyle.info;return`
<div style="background:${s.bg};border:1px solid ${s.bd};border-radius:8px;padding:12px 14px;margin-bottom:10px">
  <div style="font-size:11px;font-weight:700;color:${s.tc};margin-bottom:6px">${a.ico} ${a.title}</div>
  <div style="font-size:11px;color:var(--tx2);line-height:1.8;white-space:pre-line">${a.text}</div>
</div>`;}).join("")}

<div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--tx3);margin:14px 0 8px 2px">🚨 Ressources d'urgence — Montréal</div>
<div class="card danger">
  <div style="font-size:10px;color:var(--tx2);margin-bottom:10px;font-style:italic">Liens préchargés. Clique <strong>Vérifier</strong> pour confirmer qu'ils sont encore actifs (Google en temps réel).</div>
  ${EM_RES.map(r=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #fecaca">
    <span style="font-size:18px;line-height:1.2">${r.ico}</span>
    <div style="flex:1"><div style="font-size:12px;font-weight:500;color:var(--tx)">${r.title}</div>
    <div style="font-size:11px;color:var(--tx2)">${r.desc}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
      <a href="${r.url}" target="_blank" style="font-size:10px;color:var(--blu);white-space:nowrap;text-decoration:none;border:1px solid var(--blu);padding:3px 8px;border-radius:4px">${r.action}</a>
      <a href="https://www.google.com/search?q=${encodeURIComponent(r.q)}" target="_blank" style="font-size:9px;color:var(--tx3);white-space:nowrap;text-decoration:none;border:1px solid var(--bd2);padding:2px 7px;border-radius:4px">🔍 Vérifier</a>
    </div>
  </div>`).join("")}
</div>

<div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--tx3);margin:14px 0 8px 2px">💼 Offres d'emploi AV — Montréal</div>
<div class="card">
  <div style="font-size:10px;color:var(--tx2);margin-bottom:10px">Facebook Jobs est discontinué — les <strong>groupes Facebook</strong> restent la meilleure source pour l'AV événementiel à Montréal.</div>
  ${AV_JOBS.map(j=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--bg2)">
    <span style="font-size:16px;line-height:1.3">${j.ico}</span>
    <div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--tx)">${j.title}</div>
    <div style="font-size:10px;color:var(--tx2)">${j.desc}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
      <a href="${j.url}" target="_blank" style="font-size:10px;color:var(--blu);white-space:nowrap;text-decoration:none;border:1px solid var(--blu);padding:3px 8px;border-radius:4px">${j.action}</a>
      <a href="https://www.google.com/search?q=${encodeURIComponent(j.q)}" target="_blank" style="font-size:9px;color:var(--tx3);white-space:nowrap;text-decoration:none;border:1px solid var(--bd2);padding:2px 7px;border-radius:4px">🔍 Vérifier</a>
    </div>
  </div>`).join("")}
</div>`;
}

render();
</script>
</body>
</html>

<script>
// ===== Moteur pur (dates, paye, projection, blocs) =====
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const round2 = v => Math.round(v * 100) / 100;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();

function budgetFor(cfg, s) {
  const dow = parseD(s).getDay();
  const b = cfg.budget;
  return dow === 6 ? b.sat : dow === 3 ? b.wed : b.other;
}
function recurOn(r, s) {
  if (!r.active) return false;
  const d = parseD(s);
  return d.getDate() === Math.min(r.day, dim(d.getFullYear(), d.getMonth()));
}
function isPayDay(cfg, s) {
  const n = cfg.payEvery || 14, k = diffDays(cfg.payAnchor, s);
  return ((k % n) + n) % n === 0;
}
function nextPayAfter(cfg, s) {
  let d = s;
  for (let i = 0; i < 40; i++) { d = addDays(d, 1); if (isPayDay(cfg, d)) return d; }
  return null;
}
function nextDom(s, dom) {
  let d = s;
  for (let i = 0; i < 40; i++) {
    d = addDays(d, 1);
    const x = parseD(d);
    if (x.getDate() === Math.min(dom, dim(x.getFullYear(), x.getMonth()))) return d;
  }
  return null;
}
function desjOut(cfg, rec, s) {
  let t = 0;
  rec.forEach(r => { if (r.account === 'desj' && recurOn(r, s)) t += r.amount; });
  if (cfg.wsTransfer && cfg.wsTransfer.amount && parseD(s).getDate() === cfg.wsTransfer.day) t += cfg.wsTransfer.amount;
  if (cfg.spendAccount !== 'capone') t += budgetFor(cfg, s);
  return t;
}

// start: {date, desj, wsc, capone, minDue, dueDate}
// opt: {days, budget, strategy, fixed}
function project(cfgIn, rec, start, opt) {
  const cfg = Object.assign({}, cfgIn, opt.budget ? { budget: opt.budget } : {});
  const cap = Object.assign({}, cfgIn.capone);
  if (opt.strategy) cap.strategy = opt.strategy;
  if (opt.fixed != null) cap.fixed = opt.fixed;
  let D = start.desj, W = start.wsc, C = start.capone;
  let minDue = start.minDue || 0, dueDate = start.dueDate || null, paid = start.paidSinceStmt || 0;
  let interest = 0, paidTotal = 0, zeroDate = C <= 0 ? start.date : null;
  let low = { v: D, date: start.date }, firstNeg = D < 0 ? start.date : null, overLimit = null;
  const warns = [];
  const rows = [{ date: start.date, D, W, C, payIn: 0, payAmt: 0, ev: ['Soldes de départ'] }];
  let s = start.date;
  for (let i = 0; i < opt.days; i++) {
    s = addDays(s, 1);
    const ev = []; let payIn = 0, payAmt = 0;
    const pay = isPayDay(cfg, s);
    const ov = opt.payOverride ? opt.payOverride[s] : null;
    if (pay) { const amt = ov != null ? ov : cfg.payAmount; D += amt; payIn = amt; ev.push('Paye'); }
    const ex = opt.extra ? opt.extra[s] : null;
    if (ex) { D += ex.desj || 0; W += ex.wsc || 0; C += ex.capone || 0; ev.push('Prévu'); }
    rec.forEach(r => {
      if (!recurOn(r, s)) return;
      if (r.account === 'desj') D -= r.amount;
      else if (r.account === 'wsc') W -= r.amount;
      else if (r.account === 'capone') C += r.amount;
      ev.push(r.name);
    });
    if (cfg.wsTransfer && cfg.wsTransfer.amount && parseD(s).getDate() === cfg.wsTransfer.day) {
      D -= cfg.wsTransfer.amount; W += cfg.wsTransfer.amount; ev.push('Virement → WS');
    }
    const sp = (opt.actual && opt.actual[s] != null) ? opt.actual[s] : budgetFor(cfg, s);
    if (cfg.spendAccount === 'capone') C += sp; else D -= sp;
    if (parseD(s).getDate() === cap.stmtDay) {
      if (C > 0.005) { const it = round2(C * cap.apr / 12); C += it; interest += it; ev.push('Intérêts carte'); }
      minDue = C > 0.005 ? Math.min(round2(C), Math.max(10, round2(C * cap.minPct))) : 0;
      dueDate = nextDom(s, cap.dueDay); paid = 0;
    }
    if (pay && C > 0.005) {
      const np = nextPayAfter(cfg, s);
      let needs = 0;
      for (let x = addDays(s, 1); x < np; x = addDays(x, 1)){ needs += desjOut(cfg, rec, x); const e2 = opt.extra ? opt.extra[x] : null; if (e2 && (e2.desj||0) < 0) needs -= e2.desj; }
      const avail = Math.max(0, D - needs - (cfg.buffer || 0));
      let amt = cap.strategy === 'fixed' ? Math.min(cap.fixed, avail) : avail;
      if (dueDate && dueDate >= s && dueDate < np && paid < minDue) amt = Math.max(amt, minDue - paid);
      amt = Math.max(0, Math.min(round2(amt), round2(C)));
      if (amt > 0) { D -= amt; C -= amt; paid += amt; paidTotal += amt; payAmt = amt; ev.push('Paiement carte'); }
    }
    if (dueDate === s && paid + 0.005 < minDue)
      warns.push({ date: s, level: 'bad', msg: 'Paiement minimum Capital One non couvert (' + round2(minDue - paid) + ' $ manquants)' });
    D = round2(D); W = round2(W); C = round2(C);
    if (C <= 0.005) { C = 0; if (!zeroDate) zeroDate = s; }
    if (D < low.v) low = { v: D, date: s };
    if (D < 0 && !firstNeg) firstNeg = s;
    if (C > cap.limit + 0.005 && !overLimit) overLimit = s;
    rows.push({ date: s, D, W, C, payIn, payAmt, ev });
  }
  if (firstNeg) warns.unshift({ date: firstNeg, level: 'bad', kind: 'neg', msg: 'Desjardins sous zéro' });
  if (overLimit) warns.push({ date: overLimit, level: 'bad', msg: 'Capital One dépasse la limite de crédit' });
  return { rows, interest: round2(interest), paidTotal: round2(paidTotal), zeroDate, low, warns };
}

function blockOf(anchor, s) {
  const k = Math.floor(diffDays(anchor, s) / 3);
  const start = addDays(anchor, 3 * k);
  return { k, start, end: addDays(start, 2), days: [start, addDays(start, 1), addDays(start, 2)] };
}


</script>
<script>
// ===== État =====
const S = { cfg:null, program:null, recurring:[], balances:[], workouts:[], body:[], days:{}, exlib:[], loaded:{} };
let db = null, status = 'loading';
const ACC = { desj:'Desjardins', wsc:'Wealthsimple chèque', capone:'Capital One' };
const DOW = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const TODAY = () => iso(new Date());
const money = v => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(v);
const money0 = v => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(v);
const fnum = (v,d=1) => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{maximumFractionDigits:d}).format(v);
const num = s => { if (s==null) return null; s = String(s).replace(/\s/g,'').replace(',','.'); if (s==='') return null; const n = Number(s); return isFinite(n) ? n : null; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dshort = s => parseD(s).toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});
const dday = s => parseD(s).toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
const dlong = s => parseD(s).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ===== Connexion au Google Sheets =====
const LS = { url:'cap3-url', token:'cap3-token', cache:'cap3-cache', outbox:'cap3-outbox' };
const conn = { url: lsGet(LS.url), token: lsGet(LS.token) };
let raw = lsGet(LS.cache), outbox = lsGet(LS.outbox) || [];
let sync = { state:'idle', err:'', at:null }, flushing = false;
const EXLIB = ["Pushups", "Rameur", "Escalier (stepper)", "Natation", "Vélo", "Marche / course", "Pulldown bicep léger", "Birdgd band", "Squat light", "Romanian", "Seated Cable Row", "Arm cupping câble", "Back extension KB", "Farmer’s Carry", "Dumbbell Row", "Hanging knee raise", "Neck exercise", "Front pull apart", "External shoulder", "Rise and back pressure", "Pronate + Press and supinate", "Towel hang / pull", "Pronation strap", "Rising strap", "Side pressure", "Lateral raise band", "Pushups windmill", "Band Pull-apart", "EZ Bar Curl", "Hammer Curl", "Finger Curls", "Short curl bicep", "Mountain Climber", "Squat rotation", "Bench Press", "DB Shoulder Press", "Squat complément léger", "Dips", "Plank", "Towel pull", "Assisted pullup", "Facepull"];
const COMMUTE = { bixi:'Bixi', metro:'Métro', none:'Aucun' };
const ACCLABEL = { desj:'Desjardins', wsc:'WS chèque', capone:'Capital One' };
const nv = x => (x===''||x==null) ? null : Number(x);
const sv = x => (x===''||x==null) ? null : String(x);
function emptyRaw(){ return { journal:[], seances:[], series:[], cardio:[], pesees:[], soldes:[], recurrents:[], reglages:[], programme:[], revenus:[] }; }

// Même logique que le script : on applique l'opération aux lignes locales, puis on relit.
function applyRaw(R, op){
  const up = (rows, key, row) => { const i = rows.findIndex(r => String(r[0])===String(key)); if (i>=0) rows[i] = row; else rows.push(row); };
  const del = (rows, key) => rows.filter(r => String(r[0])!==String(key));
  const e = x => x==null ? '' : x;
  switch(op.t){
    case 'day': up(R.journal, op.date, [op.date, e(op.spent), e(op.smoke), e(op.commute), e(op.note)]); break;
    case 'session': if (R.seances.some(r => r[0]===op.id)) break;
      R.seances.push([op.id, op.date, op.kind, e(op.title), e(op.phase), e(op.note)]);
      (op.sets||[]).forEach(x => R.series.push([op.id, op.date, x[0], x[1], e(x[2]), e(x[3]), e(x[4])]));
      (op.cardio||[]).forEach(c => R.cardio.push([op.id, op.date, c.type, e(c.min), 'Pendant la séance '+op.kind])); break;
    case 'cardio': if (R.cardio.some(r => r[0]===op.id)) break; R.cardio.push([op.id, op.date, op.type, e(op.min), e(op.note)]); break;
    case 'delWorkout': R.seances = del(R.seances, op.id); R.series = del(R.series, op.id); R.cardio = del(R.cardio, op.id); break;
    case 'body': up(R.pesees, op.date, [op.date, e(op.weight), e(op.bf), e(op.muscle), e(op.visceral)]); break;
    case 'delBody': R.pesees = del(R.pesees, op.date); break;
    case 'balances': R.soldes.push([op.date, e(op.desj), e(op.wsc), e(op.wsi), e(op.capone), e(op.stmtBal), e(op.minDue), e(op.dueDate), 'App '+op.id]); break;

  return { o, score: o.filter(x => x.state==='ok').length, env, ended };
}

function incomeAdvice(list){

  keep = Math.min(keep, tot); const toCard = tot - keep;
  return `<div class="banner ok small">Suggestion pour ${money0(tot)} : ${toCard > 0 ? '<b>'+money0(toCard)+' sur Capital One</b> (la dette à '+fnum(cfg().capone.apr*100)+' %)' : ''}${toCard > 0 && keep > 0 ? ', et ' : ''}${keep > 0 ? '<b>'+money0(keep)+' à garder dans Desjardins</b> pour éviter le découvert prévu le '+dday(when) : ''}.</div>`;

// ---- Coach : séance suggérée à partir des derniers jours ----
const PAIN_OPTS = ['Coude','Poignet','Épaule','Dos','Pied gauche'];
const CARDIO_TYPES = ['Natation','Corde à sauter','Mountain Climber','Vélo / Bixi','Rameur','Marche rapide','Autre'];
const AW_EX = /strap|cupping|side pressure|rise and back|towel|armwrestling|pronat|rising/i;
const PRESS_EX = /shoulder press|dips/i;
const BACK_EX = /romanian|deadlift/i;
const round5 = v => Math.round(v/5)*5;
const NOADJ = () => ({ factor:1, setDelta:0, skip:[], factorBy:[], noProgress:false, easy:false });
function feelOf(w){ const m = /Ressenti\s*:\s*(Facile|Correct|Dur)/i.exec(w.note||''); return m ? m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase() : null; }
function painsOf(w){ const m = /Douleur\s*:\s*([^·—\n]+)/i.exec(w.note||''); return m ? m[1].split(',').map(s => s.trim()).filter(s => s && !/aucune/i.test(s)) : []; }
function isMC(w){ return (w.cardio && /mountain/i.test(w.cardio.type)) || (w.exercises||[]).some(e => e.kind==='cardio' && /mountain/i.test(e.type||'')); }
function coach(d){
  d = d || TODAY();
  const past = S.workouts.filter(w => w.date <= d);
  const str = past.filter(isStrength).filter(w => w.date < d), last = str[str.length-1];
  const gap = last ? diffDays(last.date, d) : null;
  const doneToday = past.filter(w => w.date===d);
  const pains = Array.from(new Set(past.filter(w => w.date >= addDays(d,-7)).flatMap(painsOf)));
  const pain = p => pains.some(x => x.toLowerCase().includes(p));
  const feel = last ? feelOf(last) : null;
  const adj = NOADJ(), why = [];
  let mode = doneToday.some(isStrength) ? 'done' : 'session';
  if (mode!=='done' && str.some(w => w.date===addDays(d,-1)) && str.some(w => w.date===addDays(d,-2))){ mode = 'recup'; why.push('Deux jours de force d’affilée : aujourd’hui, récupération (nage douce ou repos).'); }
  if (gap == null) why.push('Première séance de ton retour : on commence léger.');
  else if (gap >= 10){ const ph = phaseNow(); adj.factor = 0.9; adj.setDelta = ph && ph.sets > 2 ? -1 : 0; why.push(gap+' jours depuis ta dernière séance : reprise douce, charges −10 %'+(adj.setDelta ? ' et une série de moins.' : '.')); }
  else if (gap >= 5){ adj.noProgress = true; why.push(gap+' jours depuis ta dernière séance : mêmes charges que la dernière fois.'); }
  if (feel==='Dur'){ adj.noProgress = true; why.push('Dernière séance notée « Dur » : on garde les mêmes charges.'); }
  if (feel==='Facile' && !adj.noProgress){ adj.easy = true; why.push('Dernière séance notée « Facile » : +5 lb là où tu as été proche du haut de la fourchette.'); }
  if (pain('coude') || pain('poignet')){ adj.skip.push(AW_EX); why.push('Coude ou poignet signalé cette semaine : pas de straps, de cupping ni de table cette fois.'); }
  if (pain('paule')){ adj.skip.push(PRESS_EX); adj.factorBy.push([/bench/i, 0.8]); why.push('Épaule signalée : pas de développé épaules ni de dips, bench −20 %.'); }
  if (pain('dos')){ adj.skip.push(BACK_EX); adj.factorBy.push([/squat/i, 0.8]); why.push('Dos signalé : pas de Romanian, squat −20 %.'); }
  const footPain = pain('pied');
  const cardioRecent = past.some(w => isCardio(w) && w.date >= addDays(d,-2));
  const mcWeek = past.some(w => isMC(w) && w.date >= addDays(d,-6));
  const cardioTip = footPain ? 'Pied gauche signalé : cardio en nage seulement.'
    : !cardioRecent ? 'Pas de cardio depuis 3 jours : 20 à 30 min de nage'+(mcWeek ? ' (mountain climbers déjà faits cette semaine).' : ', ou corde 6 × 1 min.')
    : 'Cardio fait récemment.';
  return { kind: nextSessionKind(), mode, gap, last, feel, pains, adj, why, cardioTip, footPain, mcWeek, cardioRecent };
}

function summarizeWorkout(w){

    if (e.kind==='time') return e.name+' '+s.map(x=>x.t+' s').join('/');
    if (e.kind==='bandhold') return e.name+' ('+(e.band||'bande')+') '+s.map(x=>x.t+' s').join('/');

function goalStatus(){

  const target = c.carteZero || null;
  const st = { pj, zero: pj.zeroDate, target, ok: target ? !!(pj.zeroDate && pj.zeroDate <= target) : null, need: null };
  if (target && !st.ok){
    const b = latestBal(); const days = Math.max(1, diffDays(b.date, target) + 1);
    const test = f => { const r = runProjection({ days, budget: scaleBudget(c.budget, f) }); return !!(r && r.zeroDate && r.zeroDate <= target); };
    if (!test(0)) st.need = { impossible: true };
    else { let lo = 0, hi = 1; for (let i = 0; i < 22; i++){ const m = (lo+hi)/2; if (test(m)) lo = m; else hi = m; } st.need = { weekly: weekOf(c.budget)*lo, f: lo }; }
  }
  return st;
}

const BANDS = ['15-30','30-60','60-100','Poignées'];

function guessKind(name){
  const n = String(name).toLowerCase();
  if (/natation|nage|corde|mountain|vélo|velo|bixi|rameur|marche|course|escalier|cardio/.test(n)) return 'cardio';
  if (/tenue|hold|isom/.test(n)) return 'bandhold';
  if (/bande|band|pull.?apart|external shoulder|lateral raise/.test(n)) return 'band';
  if (/plank|gainage|hang|suspension/.test(n)) return 'time';

function buildSession(kind, date){

  const nSets = Math.max(2, ph.sets + adj.setDelta);

}
function newEx(e, nSets, adj, co){

    if (ls){
      const lw = ls[ls.length-1].w; if (lw!=null) w = lw;
      const allTop = hi && ls.every(s => (s.r||0) >= hi), nearTop = hi && ls.every(s => (s.r||0) >= hi-1), under = lo && ls.filter(s => s.r!=null).some(s => s.r < lo);
      if (lw!=null && !adj.noProgress && (allTop || (adj.easy && nearTop))){ w = lw + 5; x.hint = 'Haut de la fourchette atteint le '+when+' : +5 lb'; }
      else if (lw!=null && under){ w = Math.max(5, round5(lw*0.95)); x.hint = 'Reps sous la cible le '+when+' : charge −5 %'; }
      else x.hint = 'Dernière fois ('+when+') : '+ls.map(s => (s.w!=null?s.w+'×':'')+(s.r!=null?s.r:'')).join(', ');
    }
    const fb = (adj.factorBy.find(([rx]) => rx.test(e.name)) || [null,1])[1], f = adj.factor * fb;
    if (w!=null && f!==1){ const w2 = Math.max(5, round5(w*f)); if (w2!==w){ w = w2; x.hint += (x.hint ? ' · ' : '') + 'ajusté à '+w+' lb'; } }
    for (let i=0;i<n;i++) x.sets.push({ w, r: lo, done:false });
  } else if (kind==='bw'){
    let r = lo;
    if (ls){ const rs = ls.map(s => s.r||0);
      if (hi && rs.every(v => v >= hi) && !adj.noProgress){ r = Math.max(...rs) + 1; x.hint = 'Haut de la fourchette atteint le '+when+' : vise '+r+' reps'; }
      else { r = Math.max(lo||1, Math.min(...rs)); x.hint = 'Dernière fois ('+when+') : '+rs.join(', ')+' reps'; } }

      <div class="small muted">Activité</div><div class="row">${CARDIO_TYPES.map(t => `<button class="seg" data-c="type" data-v="${t}" aria-pressed="${st.type===t}">${t}</button>`).join('')}</div>
      <div class="small muted">Durée</div><div class="row">${[10,15,20,30,45,60].map(m => `<button class="seg" data-c="min" data-v="${m}" aria-pressed="${st.min===m}">${m} min</button>`).join('')}<input id="cMin" class="xs" inputmode="numeric" value="${st.min}" aria-label="Minutes"> min</div>
      ${rope ? '<div class="small" style="color:var(--warn)">Corde : surface souple, 6 × 1 min max, arrêt dès que le pied gauche se plaint.</div>' : ''}
      ${mc ? '<div class="small" style="color:var(--bad)">Mountain climbers déjà faits cette semaine : une fois par semaine maximum, choisis la nage.</div>' : ''}
      ${co.footPain && !/natation/i.test(st.type) ? '<div class="small" style="color:var(--bad)">Pied gauche signalé : la nage est plus sûre.</div>' : ''}
      <label class="f" for="cNote">Note<input id="cNote" placeholder="ex. 20 longueurs, pied OK"></label>
      <button class="primary" data-c="save">Enregistrer ${st.min} min de ${esc(st.type.toLowerCase())}</button>
      ${todays.length ? `<h3>Déjà noté ce jour-là</h3>${todays.map(w => `<div class="obj"><div class="ic ok">✓</div><div>${esc(summarizeWorkout(w))}</div><button class="ghost" data-c="del" data-id="${w._id}">Retirer</button></div>`).join('')}` : ''}`;
  };
  openSheet('Cardio', '', el => {
    draw(el);
    el.oninput = e => { if (e.target.id==='cMin'){ const v = num(e.target.value); if (v) st.min = v; } };
    el.onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const a = b.dataset.c;
      if (a==='type') st.type = b.dataset.v;
      if (a==='min') st.min = +b.dataset.v;
      if (a==='del'){ enqueue({ t:'delWorkout', id:b.dataset.id }); closeSheet(); toast('Cardio retiré.'); return; }
      if (a==='save'){ const note = el.querySelector('#cNote').value;
        if (S.workouts.some(w => w._id==='R'+d)) enqueue({ t:'delWorkout', id:'R'+d });
        enqueue({ t:'cardio', id:uid('C'), date:d, type:st.type, min:st.min, note }); closeSheet(); toast('Cardio enregistré.'); return; }
      const note = el.querySelector('#cNote') ? el.querySelector('#cNote').value : '';
      draw(el); el.querySelector('#cNote').value = note; };
  });
}
function openBody(){
  const last = S.body[S.body.length-1] || {};
  openSheet('Pesée', `<label class="f" for="bDate">Date<input id="bDate" type="date" value="${TODAY()}"></label>
    <div class="grid2"><label class="f" for="bW">Poids (lb)<input id="bW" inputmode="decimal" placeholder="${last.weight||''}"></label><label class="f" for="bBf">% gras<input id="bBf" inputmode="decimal" placeholder="${last.bf||''}"></label>
    <label class="f" for="bM">Masse musculaire (lb)<input id="bM" inputmode="decimal" placeholder="${last.muscle||''}"></label><label class="f" for="bV">Graisse viscérale<input id="bV" inputmode="decimal" placeholder="${last.visceral||''}"></label></div>
    <div class="muted small">Même balance, même moment (le matin à jeun) pour que les chiffres se comparent.</div>
    <button class="primary" id="bSave">Enregistrer</button>`, el => {
      el.querySelector('#bSave').onclick = () => { const w = num(el.querySelector('#bW').value); if (!w){ toast('Indique le poids.'); return; }
        enqueue({ t:'body', date: el.querySelector('#bDate').value, weight:w, bf:num(el.querySelector('#bBf').value), muscle:num(el.querySelector('#bM').value), visceral:num(el.querySelector('#bV').value) });
        closeSheet(); toast('Pesée enregistrée.'); };
    });
}
function openBalances(){
  const b = latestBal(), f = v => v==null ? '' : String(v).replace('.',',');
  openSheet('Soldes des comptes', `<label class="f" for="kDate">Date<input id="kDate" type="date" value="${TODAY()}"></label>
    <div class="grid2"><label class="f" for="kD">Desjardins<input id="kD" inputmode="decimal" value="${f(b.desj)}"></label><label class="f" for="kC">Capital One (solde + en attente)<input id="kC" inputmode="decimal" value="${f(b.capone)}"></label>
    <label class="f" for="kW">WS chèque<input id="kW" inputmode="decimal" value="${f(b.wsc)}"></label><label class="f" for="kI">WS placements<input id="kI" inputmode="decimal" value="${f(b.wsi)}"></label></div>
    <div class="muted small">Desjardins à découvert : mets un signe moins (ex. −11,70). Capital One : solde actuel + transactions en attente.</div>
    <details><summary>Nouveau relevé Capital One</summary><div class="grid3" style="margin-top:8px"><label class="f" for="kS">Nouveau solde<input id="kS" inputmode="decimal" value="${f(b.stmtBal)}"></label><label class="f" for="kM">Paiement minimum<input id="kM" inputmode="decimal" value="${f(b.minDue)}"></label><label class="f" for="kDue">Échéance<input id="kDue" type="date" value="${b.dueDate||''}"></label></div></details>
    <button class="primary" id="kSave">Enregistrer les soldes</button>`, el => {
      el.querySelector('#kSave').onclick = () => { const g = id => num(el.querySelector(id).value.replace('−','-'));
        const doc = { t:'balances', id:uid('B'), date: el.querySelector('#kDate').value, desj:g('#kD'), capone:g('#kC'), wsc:g('#kW'), wsi:g('#kI'), stmtBal:g('#kS'), minDue:g('#kM'), dueDate: el.querySelector('#kDue').value || null };
        if (doc.desj==null || doc.capone==null){ toast('Desjardins et Capital One sont nécessaires.'); return; }
        sim = null; enqueue(doc); closeSheet(); toast('Soldes enregistrés.'); location.hash = 'jour'; };
    });
}
function openRec(id){
  const r = S.recurring.find(x => x._id===id) || { name:'', amount:'', day:1, account:'desj', active:true, note:'' };
  openSheet(id ? 'Modifier le paiement' : 'Nouveau paiement récurrent', `<label class="f" for="rN">Nom<input id="rN" value="${esc(r.name)}"></label>
    <div class="grid3"><label class="f" for="rA">Montant<input id="rA" inputmode="decimal" value="${String(r.amount).replace('.',',')}"></label><label class="f" for="rD">Jour du mois<input id="rD" inputmode="numeric" value="${r.day}"></label>
    <label class="f" for="rC">Compte<select id="rC">${Object.entries(ACC).map(([k,l]) => `<option value="${k}" ${r.account===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <label class="row" for="rOn"><input id="rOn" type="checkbox" style="width:auto;min-height:0" ${r.active?'checked':''}> Actif (compté dans la projection)</label>
    <label class="f" for="rNote">Note<input id="rNote" value="${esc(r.note||'')}"></label>
    <div class="row"><button class="primary" id="rSave" style="flex:1">Enregistrer</button>${id?'<button id="rDel">Supprimer</button>':''}</div>`, el => {
      el.querySelector('#rSave').onclick = () => { const doc = { name: el.querySelector('#rN').value.trim(), amount: num(el.querySelector('#rA').value), day: Math.min(31, Math.max(1, num(el.querySelector('#rD').value)||1)), account: el.querySelector('#rC').value, active: el.querySelector('#rOn').checked, note: el.querySelector('#rNote').value };
        if (!doc.name || doc.amount==null){ toast('Nom et montant sont nécessaires.'); return; }
        enqueue({ t:'rec', id: id || uid('r'), name:doc.name, amount:doc.amount, day:doc.day, account:ACCLABEL[doc.account], active: doc.active ? 'Oui' : 'Non', note:doc.note }); closeSheet(); };
      const del = el.querySelector('#rDel'); if (del) del.onclick = () => confirmIn(del, 'Confirmer', () => { enqueue({ t:'delRec', id }); closeSheet(); });
    });
}
function openPlanned(){
  const st = { kind:'dep', account:'desj' };
  openSheet('Prévoir une dépense ou un revenu', `<div class="row"><button class="seg" data-p="kind" data-v="dep" aria-pressed="true">Dépense</button><button class="seg" data-p="kind" data-v="rev" aria-pressed="false">Revenu</button></div>
    <label class="f" for="pDesc">Description<input id="pDesc" placeholder="ex. billet d’avion, contrat sonorisation"></label>
    <div class="grid2"><label class="f" for="pAmt">Montant ($)<input id="pAmt" inputmode="decimal"></label><label class="f" for="pDate">Date prévue<input id="pDate" type="date" value="${addDays(TODAY(),7)}"></label></div>
    <div class="small muted">Compte</div><div class="row">${Object.entries(ACC).map(([k,l]) => `<button class="seg" data-p="acc" data-v="${k}" aria-pressed="${k==='desj'}">${l}</button>`).join('')}</div>
    <div class="muted small">Ça change seulement la prévision. Tes soldes réels ne bougent pas.</div>
    <button class="primary" id="pSave">Ajouter au plan</button>`, el => {
      el.onclick = e => { const b = e.target.closest('[data-p]'); if (b){ const k = b.dataset.p; if (k==='kind') st.kind = b.dataset.v; else st.account = b.dataset.v; el.querySelectorAll(`[data-p="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x===b)); return; }
        if (e.target.id==='pSave'){ const amt = num(el.querySelector('#pAmt').value), d = el.querySelector('#pDate').value; if (!amt || !d){ toast('Indique le montant et la date.'); return; }
          sim = null; enqueue({ t:'income', id:uid('P'), date:d, type: st.kind==='rev' ? 'Prévu : revenu' : 'Prévu : dépense', amount:amt, account: ACCLABEL[st.account], note: el.querySelector('#pDesc').value.trim() }); closeSheet(); toast('Ajouté au plan.'); } };
    });
}
function openGoals(){
  const c = cfg(); const st = { strategy: c.capone.strategy };
  openSheet('Mes objectifs', `<h3>Dépenses</h3><div class="grid3"><label class="f" for="oO">Lun-ven, dim. ($/jour)<input id="oO" inputmode="decimal" value="${c.budget.other}"></label><label class="f" for="oW">Mercredi<input id="oW" inputmode="decimal" value="${c.budget.wed}"></label><label class="f" for="oS">Samedi<input id="oS" inputmode="decimal" value="${c.budget.sat}"></label></div>
    <div class="small muted" id="oWeek"></div>
    <h3>Carte Capital One</h3><div class="row"><button class="seg" data-o="max" aria-pressed="${st.strategy!=='fixed'}">Tout le surplus à chaque paye</button><button class="seg" data-o="fixed" aria-pressed="${st.strategy==='fixed'}">Montant fixe</button></div>
    <label class="f" for="oF">Montant fixe par paye (si choisi)<input id="oF" inputmode="decimal" value="${c.capone.fixed}"></label>
    <label class="f" for="oB">Coussin gardé dans Desjardins ($)<input id="oB" inputmode="decimal" value="${c.buffer}"></label>
    <h3>Date visée</h3><label class="f" for="oZ">Carte à zéro avant le (facultatif)<input id="oZ" type="date" value="${c.carteZero||''}"></label>
    <div class="muted small">Avec une date visée, l’app te dit si tu es en voie et quel budget par semaine il faudrait pour y arriver.</div>
    <button class="primary" id="oSave">Enregistrer mes objectifs</button>`, el => {
      const wk = () => { const g = id => num(el.querySelector(id).value) || 0; el.querySelector('#oWeek').textContent = 'Total : '+money0(g('#oO')*5 + g('#oW') + g('#oS'))+' par semaine'; };
      wk(); el.oninput = wk;
      el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { st.strategy = b.dataset.o; el.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-pressed', x.dataset.o===st.strategy)); });
      el.querySelector('#oSave').onclick = () => { const g = id => num(el.querySelector(id).value);
        const values = { BudgetAutre: g('#oO') ?? c.budget.other, BudgetMer: g('#oW') ?? c.budget.wed, BudgetSam: g('#oS') ?? c.budget.sat,
          Strategie: st.strategy==='fixed' ? 'Montant fixe' : 'Tout le surplus', MontantFixe: g('#oF') ?? c.capone.fixed, Coussin: g('#oB') ?? c.buffer, CarteZeroVisee: el.querySelector('#oZ').value || '' };
        sim = null; enqueue({ t:'settings', values }); closeSheet(); toast('Objectifs enregistrés.'); };
    });
}
function openSettings(){
  const c = cfg(), np = nextPayAfter(c, addDays(TODAY(),-1));
  openSheet('Paramètres', `<div class="muted small">Les objectifs (budget, carte, date visée) se règlent dans Argent → Mes objectifs.</div>
    <h3>Paye</h3><div class="grid2"><label class="f" for="gPay">Paye nette prévue ($)<input id="gPay" inputmode="decimal" value="${c.payAmount}"></label><label class="f" for="gNext">Prochaine paye<input id="gNext" type="date" value="${np}"></label></div>
    <h3>Virement Desjardins → WS</h3><div class="grid2"><label class="f" for="gTa">Montant / mois<input id="gTa" inputmode="decimal" value="${c.wsTransfer.amount}"></label><label class="f" for="gTd">Jour du mois<input id="gTd" inputmode="numeric" value="${c.wsTransfer.day}"></label></div>
    <h3>Capital One</h3><div class="grid2"><label class="f" for="gApr">Taux annuel (%)<input id="gApr" inputmode="decimal" value="${String(round2(c.capone.apr*100)).replace('.',',')}"></label><label class="f" for="gLim">Limite<input id="gLim" inputmode="decimal" value="${c.capone.limit}"></label><label class="f" for="gSd">Jour du relevé<input id="gSd" inputmode="numeric" value="${c.capone.stmtDay}"></label><label class="f" for="gDd">Jour d’échéance<input id="gDd" inputmode="numeric" value="${c.capone.dueDay}"></label></div>
    <h3>Corps</h3><label class="f" for="gGoal">Poids visé (lb)<input id="gGoal" inputmode="decimal" value="${c.goalWeight??''}"></label>
    <button class="primary" id="gSave">Enregistrer</button>
    <h3>Connexion</h3><div class="muted small">Script : ${esc((conn.url||'').replace(/^https:\/\/script.google.com\/macros\/s\//,'').slice(0,18))}…</div>
    <button id="gDisc">Changer l’URL ou le code secret</button>`, el => {
      el.querySelector('#gDisc').onclick = () => { conn.url = null; conn.token = null; lsSet(LS.url, null); lsSet(LS.token, null); closeSheet(); };
      el.querySelector('#gSave').onclick = () => { const g = id => num(el.querySelector(id).value);
        const nd = el.querySelector('#gNext').value, apr = g('#gApr');
        const values = { Paye: g('#gPay') ?? c.payAmount, VirMontant: g('#gTa') ?? 0, VirJour: g('#gTd') || 1, Taux: apr==null ? c.capone.apr : apr/100, Limite: g('#gLim') ?? c.capone.limit,
          JourReleve: g('#gSd') || c.capone.stmtDay, JourEcheance: g('#gDd') || c.capone.dueDay, PoidsVise: g('#gGoal') };
        if (nd) values.PayeRef = nd;
        sim = null; enqueue({ t:'settings', values }); closeSheet(); toast('Paramètres enregistrés.'); };
    });
}

// ===== Événements =====
window.addEventListener('hashchange', render);
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a==='startSession') openSession(b.dataset.kind, currentTab()==='jour' ? (dayCursor||TODAY()) : TODAY());
  else if (a==='cardio') openCardio();
  else if (a==='balances') openBalances();
  else if (a==='body') openBody();
  else if (a==='settings') openSettings();
  else if (a==='recEdit') openRec(b.dataset.id || null);
  else if (a==='dayPrev'){ dayCursor = addDays(dayCursor||TODAY(), -1); render(); }
  else if (a==='dayNext'){ const n = addDays(dayCursor||TODAY(), 1); dayCursor = n >= TODAY() ? null : n; render(); }
  else if (a==='train'){ const d = dayCursor||TODAY(), v = b.dataset.v, todays = S.workouts.filter(w => w.date===d);
    const has = id => todays.some(w => w._id===id), del = id => enqueue({ t:'delWorkout', id });
    if (v==='gym'){ if (has('G'+d)) del('G'+d); else if (todays.some(isStrength)) toast('Séance déjà notée pour ce jour : voir Muscu → Historique.'); else { const co = coach(d); openSession(co.kind, d); } }
    else if (v==='cardio') openCardio(d);
    else { if (has('R'+d)) del('R'+d); else { if (has('G'+d)) del('G'+d); if (has('K'+d)) del('K'+d); enqueue({ t:'session', id:'R'+d, date:d, kind:'repos', title:'Repos', phase:'', note:'', sets:[], cardio:[] }); } } }
  else if (a==='saveAll') saveAll();
  else if (a==='addPay'){ const v = num((document.getElementById('iPay')||{}).value); if (!v){ toast('Indique le montant reçu.'); return; }
    if (document.activeElement) document.activeElement.blur(); enqueue({ t:'income', id:uid('I'), date: dayCursor||TODAY(), type:'Paye', amount:v, account:'Desjardins', note:'' }); toast('Paye enregistrée.'); }
  else if (a==='addIncome'){ const v = num(document.getElementById('iAmt').value); if (!v){ toast('Indique le montant.'); return; }
    if (document.activeElement) document.activeElement.blur(); const acc = document.getElementById('iAcc').value;
    enqueue({ t:'income', id:uid('I'), date: dayCursor||TODAY(), type: document.getElementById('iType').value, amount:v, account: ACCLABEL[acc], note: document.getElementById('iNote').value }); toast('Revenu enregistré.'); }
  else if (a==='delIncome') confirmIn(b, 'Sûr ?', () => enqueue({ t:'delIncome', id:b.dataset.id }));
  else if (a==='setPay'){ enqueue({ t:'settings', values:{ Paye: +b.dataset.v } }); sim = null; toast('Paye prévue mise à jour.'); }
  else if (a==='savePesee'){ const g = id => { const el = document.getElementById(id); return el ? num(el.value) : null; }; const w = g('jPw'); if (!w){ toast('Indique ton poids.'); return; }
    if (document.activeElement) document.activeElement.blur(); enqueue({ t:'body', date: dayCursor||TODAY(), weight:w, bf:g('jBf'), muscle:g('jMu'), visceral:g('jVi') }); toast('Pesée enregistrée.'); }
  else if (a==='smokeNone') saveDay(dayCursor||TODAY(), { smokeLogged:true, cig:false, weed:false });
  else if (a==='smokeToggle'){ const d = dayCursor||TODAY(), r = S.days[d] || {}, k = b.dataset.v; saveDay(d, { smokeLogged:true, [k]: !r[k] }); }
  else if (a==='saveAmounts'){ const g = id => { const el = document.getElementById(id); return el ? num(el.value.replace('−','-')) : null; };
    const op = { t:'balances', id:uid('B'), date: dayCursor||TODAY(), desj:g('jD'), capone:g('jC'), wsc:g('jW'), wsi:g('jI'), stmtBal:g('jS'), minDue:g('jM'), dueDate:(document.getElementById('jDue')||{}).value || null };
    if (op.desj==null || op.capone==null){ toast('Desjardins et Capital One sont nécessaires.'); return; }
    if (document.activeElement) document.activeElement.blur(); sim = null; enqueue(op); toast('Montants enregistrés.');
    requestAnimationFrame(() => { const c = document.querySelector('[aria-label="Résultat vs prévision"]'); if (c) c.scrollIntoView({ behavior:'smooth', block:'start' }); }); }
  else if (a==='commute'){ const d = dayCursor||TODAY(); const cur = S.days[d] && S.days[d].commute; saveDay(d, { commute: cur===b.dataset.v ? null : b.dataset.v }); }
  else if (a==='simStrat'){ sim.strategy = b.dataset.v; render(); }
  else if (a==='goals') openGoals();
  else if (a==='addPlanned') openPlanned();
  else if (a==='delPlanned') confirmIn(b, 'Retirer ?', () => { sim = null; enqueue({ t:'delIncome', id:b.dataset.id }); });
  else if (a==='simReset'){ sim = null; render(); }
  else if (a==='simSave'){ const v = { BudgetAutre:sim.budget.other, BudgetMer:sim.budget.wed, BudgetSam:sim.budget.sat, Strategie: sim.strategy==='fixed' ? 'Montant fixe' : 'Tout le surplus', MontantFixe:sim.fixed }; sim = null; enqueue({ t:'settings', values:v }); toast('Nouveaux objectifs adoptés.'); }
  else if (a==='retry') flush();
  else if (a==='connect'){ const u = document.getElementById('cuUrl').value.trim(), k = document.getElementById('cuTok').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){ toast('L’URL doit commencer par https://script.google.com/'); return; } if (!k){ toast('Entre le code secret.'); return; } conn.url = u; conn.token = k; lsSet(LS.url, u); lsSet(LS.token, k); sync.state = 'sync'; render(); flush(); }
  else if (a==='delWorkout') confirmIn(b, 'Confirmer', () => enqueue({ t:'delWorkout', id:b.dataset.id }));
  else if (a==='delBody') confirmIn(b, 'Sûr ?', () => enqueue({ t:'delBody', date:b.dataset.id }));
});
document.getElementById('view').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.recline')){ e.preventDefault(); e.target.click(); } });

// ===== Démarrage =====
rebuild(); render();
flush();
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') flush(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

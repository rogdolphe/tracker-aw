<script>
// ===== Moteur pur (dates, paye, projection, blocs) =====
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const round2 = v => Math.round(v * 100) / 100;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();

function budgetFor(cfg, s) {
  const dow = parseD(s).getDay();
  const b = cfg.budget;
  return dow === 6 ? b.sat : dow === 3 ? b.wed : b.other;
}
function recurOn(r, s) {
  if (!r.active) return false;
  const d = parseD(s);
  return d.getDate() === Math.min(r.day, dim(d.getFullYear(), d.getMonth()));
}
function isPayDay(cfg, s) {
  const n = cfg.payEvery || 14, k = diffDays(cfg.payAnchor, s);
  return ((k % n) + n) % n === 0;
}
function nextPayAfter(cfg, s) {
  let d = s;
  for (let i = 0; i < 40; i++) { d = addDays(d, 1); if (isPayDay(cfg, d)) return d; }
  return null;
}
function nextDom(s, dom) {
  let d = s;
  for (let i = 0; i < 40; i++) {
    d = addDays(d, 1);
    const x = parseD(d);
    if (x.getDate() === Math.min(dom, dim(x.getFullYear(), x.getMonth()))) return d;
  }
  return null;
}
function desjOut(cfg, rec, s) {
  let t = 0;
  rec.forEach(r => { if (r.account === 'desj' && recurOn(r, s)) t += r.amount; });
  if (cfg.wsTransfer && cfg.wsTransfer.amount && parseD(s).getDate() === cfg.wsTransfer.day) t += cfg.wsTransfer.amount;
  if (cfg.spendAccount !== 'capone') t += budgetFor(cfg, s);
  return t;
}

// start: {date, desj, wsc, capone, minDue, dueDate}
// opt: {days, budget, strategy, fixed}
function project(cfgIn, rec, start, opt) {
  const cfg = Object.assign({}, cfgIn, opt.budget ? { budget: opt.budget } : {});
  const cap = Object.assign({}, cfgIn.capone);
  if (opt.strategy) cap.strategy = opt.strategy;
  if (opt.fixed != null) cap.fixed = opt.fixed;
  let D = start.desj, W = start.wsc, C = start.capone;
  let minDue = start.minDue || 0, dueDate = start.dueDate || null, paid = start.paidSinceStmt || 0;
  let interest = 0, paidTotal = 0, zeroDate = C <= 0 ? start.date : null;
  let low = { v: D, date: start.date }, firstNeg = D < 0 ? start.date : null, overLimit = null;
  const warns = [];
  const rows = [{ date: start.date, D, W, C, payIn: 0, payAmt: 0, ev: ['Soldes de départ'] }];
  let s = start.date;
  for (let i = 0; i < opt.days; i++) {
    s = addDays(s, 1);
    const ev = []; let payIn = 0, payAmt = 0;
    const pay = isPayDay(cfg, s);
    if (pay) { D += cfg.payAmount; payIn = cfg.payAmount; ev.push('Paye'); }
    rec.forEach(r => {
      if (!recurOn(r, s)) return;
      if (r.account === 'desj') D -= r.amount;
      else if (r.account === 'wsc') W -= r.amount;
      else if (r.account === 'capone') C += r.amount;
      ev.push(r.name);
    });
    if (cfg.wsTransfer && cfg.wsTransfer.amount && parseD(s).getDate() === cfg.wsTransfer.day) {
      D -= cfg.wsTransfer.amount; W += cfg.wsTransfer.amount; ev.push('Virement → WS');
    }
    const sp = (opt.actual && opt.actual[s] != null) ? opt.actual[s] : budgetFor(cfg, s);
    if (cfg.spendAccount === 'capone') C += sp; else D -= sp;
    if (parseD(s).getDate() === cap.stmtDay) {
      if (C > 0.005) { const it = round2(C * cap.apr / 12); C += it; interest += it; ev.push('Intérêts carte'); }
      minDue = C > 0.005 ? Math.min(round2(C), Math.max(10, round2(C * cap.minPct))) : 0;
      dueDate = nextDom(s, cap.dueDay); paid = 0;
    }
    if (pay && C > 0.005) {
      const np = nextPayAfter(cfg, s);
      let needs = 0;
      for (let x = addDays(s, 1); x < np; x = addDays(x, 1)) needs += desjOut(cfg, rec, x);
      const avail = Math.max(0, D - needs - (cfg.buffer || 0));
      let amt = cap.strategy === 'fixed' ? Math.min(cap.fixed, avail) : avail;
      if (dueDate && dueDate >= s && dueDate < np && paid < minDue) amt = Math.max(amt, minDue - paid);
      amt = Math.max(0, Math.min(round2(amt), round2(C)));
      if (amt > 0) { D -= amt; C -= amt; paid += amt; paidTotal += amt; payAmt = amt; ev.push('Paiement carte'); }
    }
    if (dueDate === s && paid + 0.005 < minDue)
      warns.push({ date: s, level: 'bad', msg: 'Paiement minimum Capital One non couvert (' + round2(minDue - paid) + ' $ manquants)' });
    D = round2(D); W = round2(W); C = round2(C);
    if (C <= 0.005) { C = 0; if (!zeroDate) zeroDate = s; }
    if (D < low.v) low = { v: D, date: s };
    if (D < 0 && !firstNeg) firstNeg = s;
    if (C > cap.limit + 0.005 && !overLimit) overLimit = s;
    rows.push({ date: s, D, W, C, payIn, payAmt, ev });
  }
  if (firstNeg) warns.unshift({ date: firstNeg, level: 'bad', kind: 'neg', msg: 'Desjardins sous zéro' });
  if (overLimit) warns.push({ date: overLimit, level: 'bad', msg: 'Capital One dépasse la limite de crédit' });
  return { rows, interest: round2(interest), paidTotal: round2(paidTotal), zeroDate, low, warns };
}

function blockOf(anchor, s) {
  const k = Math.floor(diffDays(anchor, s) / 3);
  const start = addDays(anchor, 3 * k);
  return { k, start, end: addDays(start, 2), days: [start, addDays(start, 1), addDays(start, 2)] };
}


</script>
<script>
// ===== État =====
const S = { cfg:null, program:null, recurring:[], balances:[], workouts:[], body:[], days:{}, exlib:[], loaded:{} };
let db = null, status = 'loading';
const ACC = { desj:'Desjardins', wsc:'Wealthsimple chèque', capone:'Capital One' };
const DOW = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const TODAY = () => iso(new Date());
const money = v => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(v);
const money0 = v => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(v);
const fnum = (v,d=1) => (v==null||isNaN(v)) ? '—' : new Intl.NumberFormat('fr-CA',{maximumFractionDigits:d}).format(v);
const num = s => { if (s==null) return null; s = String(s).replace(/\s/g,'').replace(',','.'); if (s==='') return null; const n = Number(s); return isFinite(n) ? n : null; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dshort = s => parseD(s).toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});
const dday = s => parseD(s).toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
const dlong = s => parseD(s).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ===== Connexion au Google Sheets =====
const LS = { url:'cap3-url', token:'cap3-token', cache:'cap3-cache', outbox:'cap3-outbox' };
const conn = { url: lsGet(LS.url), token: lsGet(LS.token) };
let raw = lsGet(LS.cache), outbox = lsGet(LS.outbox) || [];
let sync = { state:'idle', err:'', at:null }, flushing = false;
const EXLIB = ["Pushups", "Rameur", "Escalier (stepper)", "Natation", "Vélo", "Marche / course", "Pulldown bicep léger", "Birdgd band", "Squat light", "Romanian", "Seated Cable Row", "Arm cupping câble", "Back extension KB", "Farmer’s Carry", "Dumbbell Row", "Hanging knee raise", "Neck exercise", "Front pull apart", "External shoulder", "Rise and back pressure", "Pronate + Press and supinate", "Towel hang / pull", "Pronation strap", "Rising strap", "Side pressure", "Lateral raise band", "Pushups windmill", "Band Pull-apart", "EZ Bar Curl", "Hammer Curl", "Finger Curls", "Short curl bicep", "Mountain Climber", "Squat rotation", "Bench Press", "DB Shoulder Press", "Squat complément léger", "Dips", "Plank", "Towel pull", "Assisted pullup", "Facepull"];
const COMMUTE = { bixi:'Bixi', metro:'Métro', none:'Aucun' };
const ACCLABEL = { desj:'Desjardins', wsc:'WS chèque', capone:'Capital One' };
const nv = x => (x===''||x==null) ? null : Number(x);
const sv = x => (x===''||x==null) ? null : String(x);
function emptyRaw(){ return { journal:[], seances:[], series:[], cardio:[], pesees:[], soldes:[], recurrents:[], reglages:[], programme:[] }; }

// Même logique que le script : on applique l'opération aux lignes locales, puis on relit.
function applyRaw(R, op){
  const up = (rows, key, row) => { const i = rows.findIndex(r => String(r[0])===String(key)); if (i>=0) rows[i] = row; else rows.push(row); };
  const del = (rows, key) => rows.filter(r => String(r[0])!==String(key));
  const e = x => x==null ? '' : x;
  switch(op.t){
    case 'day': up(R.journal, op.date, [op.date, e(op.spent), e(op.smoke), e(op.commute), e(op.note)]); break;
    case 'session': if (R.seances.some(r => r[0]===op.id)) break;
      R.seances.push([op.id, op.date, op.kind, e(op.title), e(op.phase), e(op.note)]);
      (op.sets||[]).forEach(x => R.series.push([op.id, op.date, x[0], x[1], e(x[2]), e(x[3]), e(x[4])]));
      (op.cardio||[]).forEach(c => R.cardio.push([op.id, op.date, c.type, e(c.min), 'Pendant la séance '+op.kind])); break;
    case 'cardio': if (R.cardio.some(r => r[0]===op.id)) break; R.cardio.push([op.id, op.date, op.type, e(op.min), e(op.note)]); break;
    case 'delWorkout': R.seances = del(R.seances, op.id); R.series = del(R.series, op.id); R.cardio = del(R.cardio, op.id); break;
    case 'body': up(R.pesees, op.date, [op.date, e(op.weight), e(op.bf), e(op.muscle), e(op.visceral)]); break;
    case 'delBody': R.pesees = del(R.pesees, op.date); break;
    case 'balances': R.soldes.push([op.date, e(op.desj), e(op.wsc), e(op.wsi), e(op.capone), e(op.stmtBal), e(op.minDue), e(op.dueDate), 'App '+op.id]); break;
    case 'rec': up(R.recurrents, op.id, [op.id, op.name, e(op.amount), e(op.day), op.account, op.active, e(op.note)]); break;
    case 'delRec': R.recurrents = del(R.recurrents, op.id); break;
    case 'settings': Object.keys(op.values).forEach(k => { const r = R.reglages.find(x => x[0]===k); if (r) r[2] = e(op.values[k]); }); break;
  }
}
function rebuild(){
  const R = JSON.parse(JSON.stringify(raw || emptyRaw()));
  outbox.forEach(op => applyRaw(R, op));

const TOL = 5;

function lastKnown(k, upto){ let v = null; S.balances.forEach(b => { if (b.ts <= upto.ts && b[k]!=null) v = b[k]; }); return v; }
function comparePerf(cur){
  const snaps = snapsFull(); const prev = snaps.filter(b => b.date < cur.date).pop(); if (!prev) return null;
  const days = diffDays(prev.date, cur.date);
  let stmt = null; S.balances.forEach(b => { if (b.ts <= prev.ts && b.minDue!=null) stmt = b; });
  const wsPrev = lastKnown('wsc', prev) || 0;
  const pj = project(cfg(), activeRec(), { date:prev.date, desj:prev.desj, wsc:wsPrev, capone:prev.capone, minDue: stmt && stmt.dueDate >= prev.date ? stmt.minDue : 0, dueDate: stmt && stmt.dueDate >= prev.date ? stmt.dueDate : null }, { days });

  let budget = 0; for (let x = addDays(prev.date,1); x <= cur.date; x = addDays(x,1)) budget += budgetFor(cfg(), x);

  return h;
}

function summarizeWorkout(w){
  if (w.kind==='cardio' && w.cardio) return w.cardio.type+' · '+w.cardio.min+' min'+(w.note?' · '+w.note:'');
  return (w.exercises||[]).map(e => {

    if (e.kind==='skill') return e.name+' '+(e.sets||[]).length+' rondes';
    const ws = (e.sets||[]).map(s => s.w==null ? '' : s.w).filter(x=>x!=='');
    const rs = (e.sets||[]).map(s => s.r);
    return e.name+' '+(ws.length? ws.join('/')+' × ' : '')+rs.join('/');

}

let sess = null;
function buildSession(kind){
  const P = S.program, ph = phaseNow() || { sets:2, idx:1 };
  const base = kind==='libre' ? { name:'Séance libre', warmup:(P && P.sessions.A.warmup)||[], exercises:[] } : P.sessions[kind];
  const ex = base.exercises.filter(e => (e.minPhase||1) <= ph.idx).map(e => newEx(e, ph.sets));
  return { kind, date: TODAY(), title: base.name, warmup: base.warmup, exercises: ex, note:'', phase: ph.idx };
}
function newEx(e, nSets){
  const x = { name:e.name, kind:e.kind||'reps', target:e.reps||'', note:e.note||'', unit:e.unit||'lb', sets:[] };
  const rn = rangeNums(e.reps); const lo = rn[0]||null, hi = rn[1]||rn[0]||null;
  const last = lastExercise(e.name);
  if (x.kind==='cardio'){ x.type = 'Natation'; x.min = lo || 20; x.done = false; return x; }
  let w = e.load || null; x.hint = '';
  if (last && last.ex.sets && last.ex.sets.length){
    const ls = last.ex.sets; const lw = ls[ls.length-1].w; if (lw!=null) w = lw;
    if (x.kind==='reps' && hi && ls.every(s => (s.r||0) >= hi) && lw!=null){ w = lw + 5; x.hint = 'Toutes les séries au haut de la fourchette le '+dday(last.date)+' : +5 lb proposé'; }
    else x.hint = 'Dernière fois ('+dday(last.date)+') : '+ls.map(s => (s.w!=null?s.w+'×':'')+(s.r!=null?s.r:(s.t!=null?s.t+' s':''))).join(', ');
  }
  for (let i=0;i<(nSets||2);i++) x.sets.push(x.kind==='time' ? { t: lo||30, done:false } : { w, r: lo, done:false });
  return x;
}
function openSession(kind){
  const draft = lsGet('cap3-draft');
  sess = (draft && draft.kind===kind && draft.date===TODAY()) ? draft : buildSession(kind);
  openSheet(kind==='libre' ? 'Séance libre' : 'Séance '+kind+' — '+sess.title, '', el => { renderSession(el); });
}
function renderSession(el){
  el = el || document.getElementById('sheetBody'); if (!el) return;
  const datalist = `<datalist id="exlib">${Array.from(new Set([...(S.exlib||[]), ...S.workouts.flatMap(w => (w.exercises||[]).map(e=>e.name))])).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
  el.innerHTML = `<label class="f" for="sDate">Date<input id="sDate" type="date" value="${sess.date}"></label>
   ${sess.warmup && sess.warmup.length ? `<div class="warmup"><b>Échauffement d’abord</b><ul>${sess.warmup.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
   ${sess.exercises.map((x,i) => exHtml(x,i)).join('')}
   <div class="row"><input id="newEx" list="exlib" placeholder="Ajouter un exercice" style="flex:1"><button data-s="addEx">Ajouter</button></div>${datalist}
   <label class="f" for="sNote">Note (douleur, énergie, modifs)<textarea id="sNote" rows="2">${esc(sess.note)}</textarea></label>
   <div class="row"><button data-s="allDone">Tout marquer fait</button><button class="primary" data-s="save" style="flex:1">Enregistrer la séance</button></div>
   <button class="ghost" data-s="discard">Abandonner ce brouillon</button>`;
  el.oninput = e => { const t = e.target; const i = +t.dataset.i, j = +t.dataset.j, f = t.dataset.f;
    if (t.id==='sDate') sess.date = t.value; else if (t.id==='sNote') sess.note = t.value;
    else if (f && !isNaN(i)){ const x = sess.exercises[i]; if (f==='type') x.type = t.value; else if (f==='min') x.min = num(t.value); else if (!isNaN(j)) x.sets[j][f] = num(t.value); }
    lsSet('cap3-draft', sess); };
  el.onchange = el.oninput;
  el.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; const a = b.dataset.s, i = +b.dataset.i, j = +b.dataset.j;
    if (a==='done'){ const s = sess.exercises[i].sets[j]; s.done = !s.done; b.setAttribute('aria-pressed', s.done); lsSet('cap3-draft', sess); return; }
    if (a==='cdone'){ const x = sess.exercises[i]; x.done = !x.done; b.setAttribute('aria-pressed', x.done); lsSet('cap3-draft', sess); return; }
    if (a==='addSet'){ const x = sess.exercises[i]; const l = x.sets[x.sets.length-1] || {}; x.sets.push(Object.assign({}, l, { done:false })); }
    if (a==='delSet'){ sess.exercises[i].sets.splice(j,1); }
    if (a==='delEx'){ sess.exercises.splice(i,1); }
    if (a==='addEx'){ const n = document.getElementById('newEx').value.trim(); if (!n) return; const isC = /natation|nage|corde|mountain|vélo|rameur|marche|course|escalier/i.test(n); sess.exercises.push(newEx({ name:n, kind: isC?'cardio':'reps', reps: isC?'20':'10' }, (phaseNow()||{sets:2}).sets)); if (isC) sess.exercises[sess.exercises.length-1].type = n; }
    if (a==='allDone'){ sess.exercises.forEach(x => { if (x.kind==='cardio') x.done = true; else x.sets.forEach(s => s.done = true); }); }
    if (a==='discard'){ lsSet('cap3-draft', null); closeSheet(); return; }
    if (a==='save'){ saveSession(); return; }
    lsSet('cap3-draft', sess); renderSession(); };
}
function exHtml(x,i){

  if (x.kind==='cardio'){
    const mcWarn = S.workouts.some(w => w.date >= addDays(sess.date,-6) && ((w.cardio && /mountain/i.test(w.cardio.type)) || (w.exercises||[]).some(e => e.kind==='cardio' && /mountain/i.test(e.type||''))));
    return `<div class="ex">${head}<div class="row"><select data-i="${i}" data-f="type" aria-label="Activité" style="flex:1">${['Natation','Corde à sauter','Mountain Climber','Vélo / Bixi (hors trajet)','Rameur','Marche rapide','Autre'].map(o => `<option ${o===x.type?'selected':''}>${o}</option>`).join('')}</select><input class="xs" data-i="${i}" data-f="min" inputmode="numeric" value="${x.min??''}" aria-label="Minutes"> min <button class="chk" data-s="cdone" data-i="${i}" aria-pressed="${!!x.done}" aria-label="Fait">✓</button></div>
      ${/corde/i.test(x.type)?'<div class="small" style="color:var(--warn)">Corde : surface souple, 6 × 1 min max, arrêt dès que le pied gauche se plaint.</div>':''}${/mountain/i.test(x.type)&&mcWarn?'<div class="small" style="color:var(--bad)">Déjà fait des mountain climbers dans les 7 derniers jours : choisis la nage.</div>':''}</div>`;
  }
  const rows = x.sets.map((s,j) => x.kind==='time'
    ? `<div class="setrow"><span class="k">${j+1}</span><input class="sm" data-i="${i}" data-j="${j}" data-f="t" inputmode="numeric" value="${s.t??''}" aria-label="Secondes série ${j+1}"> s <button class="chk" data-s="done" data-i="${i}" data-j="${j}" aria-pressed="${!!s.done}" aria-label="Série ${j+1} faite">✓</button><button class="ghost" data-s="delSet" data-i="${i}" data-j="${j}" aria-label="Retirer la série">×</button></div>`
    : x.kind==='skill'
    ? `<div class="setrow"><span class="k">${j+1}</span><span class="small muted">ronde</span><button class="chk" data-s="done" data-i="${i}" data-j="${j}" aria-pressed="${!!s.done}" aria-label="Ronde ${j+1} faite">✓</button><button class="ghost" data-s="delSet" data-i="${i}" data-j="${j}" aria-label="Retirer">×</button></div>`
    : `<div class="setrow"><span class="k">${j+1}</span><input class="sm" data-i="${i}" data-j="${j}" data-f="w" inputmode="decimal" value="${s.w??''}" placeholder="poids" aria-label="Charge série ${j+1}"> ${x.unit} × <input class="xs" data-i="${i}" data-j="${j}" data-f="r" inputmode="numeric" value="${s.r??''}" aria-label="Reps série ${j+1}"> <button class="chk" data-s="done" data-i="${i}" data-j="${j}" aria-pressed="${!!s.done}" aria-label="Série ${j+1} faite">✓</button><button class="ghost" data-s="delSet" data-i="${i}" data-j="${j}" aria-label="Retirer la série">×</button></div>`).join('');
  return `<div class="ex">${head}${rows}<button class="ghost" data-s="addSet" data-i="${i}">+ série</button></div>`;
}
function saveSession(){
  const exs = [];
  sess.exercises.forEach(x => {
    if (x.kind==='cardio'){ if (x.done && x.min) exs.push({ name:x.name, kind:'cardio', type:x.type, min:x.min }); return; }
    const sets = x.sets.filter(s => s.done).map(s => x.kind==='time' ? { t:s.t } : x.kind==='skill' ? { r:1 } : { w:s.w, r:s.r });
    if (sets.length) exs.push({ name:x.name, kind:x.kind, sets });
  });
  if (!exs.length){ toast('Coche au moins une série (✓) avant d’enregistrer.'); return; }
  const id = uid('S'); const sets = [], cardio = [];
  exs.forEach(x => { if (x.kind==='cardio') cardio.push({ type:x.type, min:x.min }); else x.sets.forEach((s,k) => sets.push([x.name, k+1, x.kind==='time'?null:s.w, x.kind==='time'?null:s.r, x.kind==='time'?s.t:null])); });
  enqueue({ t:'session', id, date:sess.date, kind:sess.kind, title:sess.title, phase:sess.phase, note:sess.note, sets, cardio });
  lsSet('cap3-draft', null); closeSheet(); toast('Séance enregistrée.');
}

    <h3>Budget quotidien</h3><div class="grid3"><label class="f" for="gO">Lun-ven, dim.<input id="gO" inputmode="decimal" value="${c.budget.other}"></label><label class="f" for="gW">Mercredi<input id="gW" inputmode="decimal" value="${c.budget.wed}"></label><label class="f" for="gS">Samedi<input id="gS" inputmode="decimal" value="${c.budget.sat}"></label></div>
    <label class="f" for="gBuf">Coussin gardé dans Desjardins à chaque paye ($)<input id="gBuf" inputmode="decimal" value="${c.buffer}"></label>
    <h3>Virement Desjardins → WS</h3><div class="grid2"><label class="f" for="gTa">Montant / mois<input id="gTa" inputmode="decimal" value="${c.wsTransfer.amount}"></label><label class="f" for="gTd">Jour du mois<input id="gTd" inputmode="numeric" value="${c.wsTransfer.day}"></label></div>
    <h3>Capital One</h3><div class="grid2"><label class="f" for="gApr">Taux annuel (%)<input id="gApr" inputmode="decimal" value="${String(round2(c.capone.apr*100)).replace('.',',')}"></label><label class="f" for="gLim">Limite<input id="gLim" inputmode="decimal" value="${c.capone.limit}"></label><label class="f" for="gSd">Jour du relevé<input id="gSd" inputmode="numeric" value="${c.capone.stmtDay}"></label><label class="f" for="gDd">Jour d’échéance<input id="gDd" inputmode="numeric" value="${c.capone.dueDay}"></label></div>
    <h3>Objectifs</h3><div class="grid2"><label class="f" for="gGoal">Poids visé (lb)<input id="gGoal" inputmode="decimal" value="${c.goalWeight??''}"></label><label class="f" for="gSm">Fumée : maximum par jour pour commencer<input id="gSm" inputmode="numeric" value="${c.smoke&&c.smoke.startTarget!=null?c.smoke.startTarget:''}" placeholder="vide = on observe d’abord"></label></div>
    <div class="muted small">Ensuite, la cible de fumée baisse de 1 par bloc à partir de ta moyenne du bloc précédent.</div>
    <button class="primary" id="gSave">Enregistrer les réglages</button>
    <h3>Connexion</h3><div class="muted small">Script : ${esc((conn.url||'').replace(/^https:\/\/script.google.com\/macros\/s\//,'').slice(0,18))}…</div>
    <button id="gDisc">Changer l’URL ou le code secret</button>`, el => {
      el.querySelector('#gDisc').onclick = () => { conn.url = null; conn.token = null; lsSet(LS.url, null); lsSet(LS.token, null); closeSheet(); };
      el.querySelector('#gSave').onclick = () => { const g = id => num(el.querySelector(id).value);
        const nd = el.querySelector('#gNext').value;
        const apr = g('#gApr');
        const values = { Paye: g('#gPay') ?? c.payAmount, BudgetAutre: g('#gO') ?? c.budget.other, BudgetMer: g('#gW') ?? c.budget.wed, BudgetSam: g('#gS') ?? c.budget.sat,
          Coussin: g('#gBuf') ?? c.buffer, VirMontant: g('#gTa') ?? 0, VirJour: g('#gTd') || 1, Taux: apr==null ? c.capone.apr : apr/100, Limite: g('#gLim') ?? c.capone.limit,
          JourReleve: g('#gSd') || c.capone.stmtDay, JourEcheance: g('#gDd') || c.capone.dueDay, PoidsVise: g('#gGoal'), FumeeDepart: g('#gSm') };
        if (nd) values.PayeRef = nd;
        sim = null; enqueue({ t:'settings', values }); closeSheet(); toast('Réglages enregistrés.'); };
    });
}

// ===== Événements =====
document.getElementById('plusBtn').onclick = openChooser;
window.addEventListener('hashchange', render);
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a==='startSession') openSession(b.dataset.kind);
  else if (a==='cardio') openCardio();
  else if (a==='balances') openBalances();
  else if (a==='body') openBody();
  else if (a==='settings') openSettings();
  else if (a==='recEdit') openRec(b.dataset.id || null);
  else if (a==='dayPrev'){ dayCursor = addDays(dayCursor||TODAY(), -1); render(); }
  else if (a==='dayNext'){ const n = addDays(dayCursor||TODAY(), 1); dayCursor = n >= TODAY() ? null : n; render(); }
  else if (a==='smokeNone') saveDay(dayCursor||TODAY(), { smokeLogged:true, cig:false, weed:false });
  else if (a==='smokeToggle'){ const d = dayCursor||TODAY(), r = S.days[d] || {}, k = b.dataset.v; saveDay(d, { smokeLogged:true, [k]: !r[k] }); }
  else if (a==='saveAmounts'){ const g = id => { const el = document.getElementById(id); return el ? num(el.value.replace('−','-')) : null; };
    const op = { t:'balances', id:uid('B'), date: dayCursor||TODAY(), desj:g('jD'), capone:g('jC'), wsc:g('jW'), wsi:g('jI'), stmtBal:g('jS'), minDue:g('jM'), dueDate:(document.getElementById('jDue')||{}).value || null };
    if (op.desj==null || op.capone==null){ toast('Desjardins et Capital One sont nécessaires.'); return; }
    if (document.activeElement) document.activeElement.blur(); sim = null; enqueue(op); toast('Montants enregistrés.');
    requestAnimationFrame(() => { const c = document.querySelector('[aria-label="Résultat vs prévision"]'); if (c) c.scrollIntoView({ behavior:'smooth', block:'start' }); }); }
  else if (a==='commute'){ const d = dayCursor||TODAY(); const cur = S.days[d] && S.days[d].commute; saveDay(d, { commute: cur===b.dataset.v ? null : b.dataset.v }); }
  else if (a==='simStrat'){ sim.strategy = b.dataset.v; render(); }
  else if (a==='simMonths'){ sim.months = +b.dataset.v; render(); }
  else if (a==='simReset'){ sim = null; render(); }
  else if (a==='simSave'){ const v = { BudgetAutre:sim.budget.other, BudgetMer:sim.budget.wed, BudgetSam:sim.budget.sat, Strategie: sim.strategy==='fixed' ? 'Montant fixe' : 'Tout le surplus', MontantFixe:sim.fixed }; sim = null; enqueue({ t:'settings', values:v }); toast('Budget enregistré.'); }
  else if (a==='retry') flush();
  else if (a==='connect'){ const u = document.getElementById('cuUrl').value.trim(), k = document.getElementById('cuTok').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){ toast('L’URL doit commencer par https://script.google.com/'); return; } if (!k){ toast('Entre le code secret.'); return; } conn.url = u; conn.token = k; lsSet(LS.url, u); lsSet(LS.token, k); sync.state = 'sync'; render(); flush(); }
  else if (a==='delWorkout') confirmIn(b, 'Confirmer', () => enqueue({ t:'delWorkout', id:b.dataset.id }));
  else if (a==='delBody') confirmIn(b, 'Sûr ?', () => enqueue({ t:'delBody', date:b.dataset.id }));
});
document.getElementById('view').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.recline')){ e.preventDefault(); e.target.click(); } });

// ===== Démarrage =====
rebuild(); render();
flush();
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') flush(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

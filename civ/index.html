<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIV.SOBRE — L'Empire du Plateau</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0d1117; --panel:#151b24; --panel2:#1b2330; --line:#2a3344;
  --parch:#e7dec8; --dim:#8d99ab; --gold:#c9a227; --gold-dim:#7a6418;
  --green:#6fae57; --green-d:#2e4d24; --red:#c0392b; --red-d:#4d1f19;
  --water:#16324a; --fog:#222a36; --orange:#d98e3a;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--mono);font-size:13px;line-height:1.5}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-variant:small-caps;letter-spacing:.14em;font-weight:600;margin:0 0 8px}
h1{font-size:21px;color:var(--gold)}
h2{font-size:15px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:4px}
h3{font-size:13px;color:var(--parch)}
small,.dim{color:var(--dim)}
.wrap{max-width:1020px;margin:0 auto;padding:14px}
header.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--gold-dim);padding-bottom:8px;margin-bottom:10px}
.era{font-size:11px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:12px;padding:7px 11px;cursor:pointer}
nav.tabs button.on{color:var(--gold);border-color:var(--gold-dim);background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
.stat{background:var(--panel2);border:1px solid var(--line);padding:8px 10px}
.stat b{display:block;font-size:16px;margin-top:2px}
.g{color:var(--green)}.r{color:var(--red)}.au{color:var(--gold)}.o{color:var(--orange)}
button.act{background:var(--gold-dim);border:1px solid var(--gold);color:#fff;font-family:var(--mono);font-size:12px;padding:8px 14px;cursor:pointer}
button.act:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:11px;padding:6px 10px;cursor:pointer}
input,select{background:var(--ink);border:1px solid var(--line);color:var(--parch);font-family:var(--mono);font-size:12px;padding:6px 8px;width:100%}
label.f{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:8px 0 3px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
th{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tribunal{display:flex;gap:14px;justify-content:center;margin:14px 0}
.tribunal button{width:116px;height:116px;border-radius:50%;font-size:36px;cursor:pointer;font-family:Georgia,serif;border:3px solid}
.tribunal .oui{background:var(--green-d);border-color:var(--green);color:var(--green)}
.tribunal .non{background:var(--red-d);border-color:var(--red);color:var(--red);border-radius:0}
.tribunal button span{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.2em;margin-top:4px}
.routine{max-width:480px;margin:0 auto}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rrow .tg{display:flex;gap:5px}
.rrow .tg button{width:40px;height:30px;font-size:14px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.rrow .tg button.yes.on{background:var(--green-d);border-color:var(--green);color:var(--green)}
.rrow .tg button.no.on{background:var(--red-d);border-color:var(--red);color:var(--red)}
.bar{height:9px;background:var(--ink);border:1px solid var(--line);position:relative;margin:4px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.bar.menace i{background:var(--red)}
svg .terr{cursor:pointer;stroke:#0d1117;stroke-width:2}
svg .terr.owned{fill:var(--gold-dim)}
svg .terr.owned.cap{fill:#9a7b1a}
svg .terr.fog{fill:var(--fog)}
svg .terr.prem{stroke:#5e4f9c;stroke-width:2.5}
svg .terr.sel{stroke:var(--parch);stroke-width:3}
svg text{font-family:var(--mono);fill:var(--parch);font-size:10px;pointer-events:none}
svg text.def{fill:var(--dim);font-size:9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .d{background:var(--panel2);border:1px solid var(--line);min-height:84px;padding:3px 4px;font-size:9px;position:relative;overflow:hidden}
.cal .d.sober{border-color:var(--green)}
.cal .d.rel{border-color:var(--red)}
.cal .d.today{outline:2px solid var(--gold)}
.cal .d .ev{color:var(--gold);display:block;line-height:1.25}
.cal .d .deb{color:var(--red);display:block;line-height:1.25}
.cal .d .cre{color:var(--orange);display:block;line-height:1.25}
.cal .d .pay{color:var(--green);display:block;line-height:1.25}
.cal .d .sol{display:block;border-top:1px dashed var(--line);margin-top:2px;font-weight:bold}
.cal .d .c1s{display:block;color:var(--dim);font-size:8px}
.cal .hd{text-align:center;color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.msg{border:1px solid var(--gold-dim);background:#1f1a08;padding:8px 10px;margin:8px 0;font-size:12px}
.msg.warn{border-color:var(--red);background:#240d0a}
.flexr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
/* vue quarter (2 mois) */
.qmonths{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.qmonths{grid-template-columns:1fr}}
.qcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.qcal .hd{text-align:center;color:var(--dim);font-size:8px;text-transform:uppercase}
.qcal .d{background:var(--panel2);border:1px solid var(--line);min-height:44px;padding:2px 3px;font-size:8px;position:relative;cursor:pointer;overflow:hidden}
.qcal .d:hover{border-color:var(--gold-dim)}
.qcal .d.today{outline:1px solid var(--gold)}
.qcal .d.edit{outline:2px solid var(--blue);z-index:2}
.qcal .d .n{font-weight:bold;font-size:9px}
.qcal .d .pay{color:var(--green);display:block}
.qcal .d .deb{color:var(--red);display:block}
.qcal .d .cre{color:var(--orange);display:block}
.qcal .d .star{color:var(--gold)}
.qcal .d .sol{display:block;border-top:1px dotted var(--line);font-weight:bold;font-size:8px}
.qcal .d .c1{display:block;color:var(--dim);font-size:7px}
.editpop{background:var(--panel2);border:1px solid var(--blue);padding:10px;margin:8px 0}
.editpop .flexr input,.editpop .flexr select{width:auto}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1>⚔ CIV.SOBRE</h1>
    <div class="era" id="era-line">L'Empire du Plateau</div>
  </div>
  <div style="text-align:right;font-size:11px" id="top-stats"></div>
</header>
<div id="sync-bar" style="display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11px">
  <span id="sync-dot" style="display:inline-flex;align-items:center;gap:6px"><span id="sync-led" style="width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block"></span><span id="sync-txt">Sync : en attente…</span></span>
  <button onclick="forceSyncCiv()" style="background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer">↻ Sync</button>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="app"></div>
<div style="margin-top:18px;font-size:10px;color:var(--dim);text-align:center">
  CIV.SOBRE v2 — chaque jour sobre est un tour de jeu. La capitale ne tombe jamais.
</div>
</div>

<script>
(function(){
"use strict";

/* ============ TERRITOIRES — quartiers de Montréal ============ */
/* prem = quartier "classe" : défense plus haute, gemme plus riche */
var TERR = {
  plateau:   {nom:"Le Plateau",     def:0,  bonus:{prod:2}, bld:"Parc La Fontaine", gem:{}, cap:true},
  mileend:   {nom:"Mile End",       def:6,  bonus:{cul:1},  bld:"Café Olimpico",        gem:{cul:10}},
  villeray:  {nom:"Villeray",       def:8,  bonus:{soc:1},  bld:"Marché Jean-Talon",    gem:{prod:10}},
  rosemont:  {nom:"Rosemont",       def:8,  bonus:{soc:1},  bld:"Jardin botanique",     gem:{soc:10}},
  hochelaga: {nom:"Hochelaga",      def:8,  bonus:{mil:1},  bld:"Stade olympique",      gem:{mil:10}},
  villemarie:{nom:"Ville-Marie",    def:10, bonus:{prod:2}, bld:"Place Ville Marie",    gem:{prod:20}},
  outremont: {nom:"Outremont",      def:12, bonus:{cul:1},  bld:"Théâtre Outremont",    gem:{cul:15}},
  ndg:       {nom:"NDG / CDN",      def:12, bonus:{prod:1}, bld:"Oratoire St-Joseph",   gem:{cul:15}},
  verdun:    {nom:"Verdun",         def:12, bonus:{soc:2},  bld:"Plage de Verdun",      gem:{soc:20}},
  griffintown:{nom:"Griffintown",   def:14, bonus:{prod:2}, bld:"Silo Five Roses",      gem:{prod:25}, prem:true},
  montroyal: {nom:"Mont-Royal",     def:14, bonus:{mil:2},  bld:"La Croix",             gem:{mil:20}},
  vieuxmtl:  {nom:"Vieux-Montréal", def:16, bonus:{cul:2},  bld:"Basilique Notre-Dame", gem:{cul:30}, prem:true},
  longueuil: {nom:"Longueuil",      def:20, bonus:{prod:2}, bld:"Pont Jacques-Cartier", gem:{prod:25}},
  laval:     {nom:"Laval",          def:24, bonus:{prod:3}, bld:"Centropolis",          gem:{prod:30}}
};
var ADJ = {
  plateau:["mileend","rosemont","villemarie","villeray"],
  mileend:["plateau","outremont","villeray"],
  villeray:["mileend","plateau","rosemont","laval"],
  rosemont:["plateau","villeray","hochelaga"],
  hochelaga:["rosemont","villemarie","longueuil"],
  outremont:["mileend","montroyal","ndg"],
  villemarie:["plateau","hochelaga","vieuxmtl","montroyal","griffintown"],
  griffintown:["villemarie","verdun","vieuxmtl"],
  vieuxmtl:["villemarie","griffintown","longueuil"],
  montroyal:["outremont","villemarie","ndg","verdun"],
  ndg:["outremont","montroyal","verdun"],
  verdun:["ndg","griffintown","montroyal"],
  longueuil:["hochelaga","vieuxmtl"],
  laval:["villeray"]
};
var POLY = {
  laval:     {p:"40,20 660,20 660,85 40,85", t:[330,55]},
  villeray:  {p:"210,135 340,130 345,205 215,210", t:[255,175]},
  rosemont:  {p:"350,130 500,135 505,210 355,205", t:[400,175]},
  outremont: {p:"95,215 205,212 208,290 100,295", t:[120,255]},
  mileend:   {p:"215,212 310,215 312,278 218,282", t:[235,250]},
  plateau:   {p:"320,215 430,218 432,300 322,295", t:[345,260]},
  hochelaga: {p:"440,218 590,222 588,310 438,305", t:[480,265]},
  ndg:       {p:"15,300 100,298 105,380 20,385", t:[28,345]},
  montroyal: {p:"110,300 215,295 220,372 115,378", t:[125,340]},
  villemarie:{p:"322,302 432,305 430,372 325,370", t:[340,340]},
  verdun:    {p:"130,385 280,380 278,440 135,445", t:[165,415]},
  griffintown:{p:"290,380 395,378 393,432 292,435", t:[298,405]},
  vieuxmtl:  {p:"405,378 520,375 518,428 407,430", t:[420,402]},
  longueuil: {p:"460,460 670,455 670,515 462,515", t:[530,490]}
};

/* ============ MERVEILLES — monuments du Québec, version pimpée ============ */
var WONDERS = [
  {id:"banq", nom:"La Grande BAnQ Impériale", pts:"cul", cout:150,
   cond:"Terminer un chapitre du roman (Paris 1536)", bonus:{cul:2},
   fail:"Pas assez de culture pour bâtir la Grande BAnQ. Lis, écris, joue."},
  {id:"forum", nom:"Le Forum Ressuscité", pts:"soc", cout:120,
   cond:"Organiser une sortie ou un événement social", bonus:{soc:2},
   fail:"Pas assez de social pour ressusciter le Forum. Sors, invite, écris à quelqu'un."},
  {id:"oratoire", nom:"L'Oratoire du Saint-Bras", pts:"mil", cout:200,
   cond:"Compétition de bras de fer ou nouveau PR au gym", bonus:{mil:3},
   fail:"Pas assez de fer dans l'avant-bras pour l'Oratoire. Retourne au gym."},
  {id:"habitat", nom:"Habitat 67 — Suite Italienne", pts:"prod", cout:180,
   cond:"Fonds Italie financé à 100%", bonus:{prod:2},
   fail:"Pas assez de production pour la Suite Italienne. La Route de la Soie attend."},
  {id:"stade", nom:"Le Stade Olympique — Enfin Payé", pts:"prod", cout:300,
   cond:"Capital One à 0$", bonus:{prod:5},
   fail:"Pas assez de production. Le vrai a pris 30 ans à payer — fais mieux."}
];
var PEN_DEFAULT = [
  "50 burpees au parc La Fontaine",
  "100 push-ups répartis dans la journée",
  "500 m de nage supplémentaires à la prochaine séance",
  "Montée des escaliers du Mont-Royal",
  "30 min de cardio à jeun demain matin",
  "5 km de marche rapide, téléphone en mode avion"
];
var MILESTONES = [7,14,30,60,90,180,365];
var ROUTINE = [
  {k:"gym", ic:"🏋️", nom:"Entraînement (gym / nage / bras de fer)", pts:"+3 ⚔"},
  {k:"cul", ic:"🎭", nom:"Culture (roman, musique, lecture)", pts:"+3 🎭"},
  {k:"soc", ic:"🤝", nom:"Social (sortie, contact, invitation)", pts:"+3 🤝"}
  /* "bud" retiré — calculé automatiquement à partir des dépenses du jour */
];

/* ============ ÉTAT ============ */
var DEF_STATE = {
  start:null, lastDay:null,
  pts:{prod:0,cul:0,soc:0,mil:0},
  troops:0, attack:0, shields:0, streak:0, best:0, totalSober:0,
  menace:0, raid:null,
  owned:{plateau:true},
  order:[],
  built:{},
  hist:[],
  pendExp:null,
  fin:{
    des:860.37, c1:4451.51, ws:170, apr:19.9, c1pmt:575,
    pay:1670.38, payStart:"2026-06-11", bud:40, budSat:100,
    save:20, goalIt:600, it:0, food:0, extraC1:0,
    split:{c1:40,it:30,food:30},
    subs:[
      {nom:"Loyer", amt:769.00, type:"d", day:1},
      {nom:"Beneva", amt:28.94, type:"d", day:2},
      {nom:"Tim Dillon", amt:8.14, type:"c", day:1},
      {nom:"F1 TV", amt:12.99, type:"c", day:13},
      {nom:"Gym", amt:27.59, type:"c", day:14},
      {nom:"Colba", amt:47.08, type:"c", day:17},
      {nom:"Chatr", amt:28.74, type:"c", day:29},
      {nom:"YouTube Premium", amt:14.94, type:"c", day:30}
    ],
    debts:[{nom:"Ticket", solde:135, pmt:40, day:27}],
    extras:[],
    planPmts:[]   /* paiements C1 planifiés : {d:"2026-06-25", amt:300, note:""} — remplace le paiement auto de cette paye */
  },
  events:[],
  pen:["50 burpees au parc La Fontaine","100 push-ups répartis dans la journée","500 m de nage supplémentaires à la prochaine séance","Montée des escaliers du Mont-Royal","30 min de cardio à jeun demain matin","5 km de marche rapide, téléphone en mode avion"],
  quarters:{},  /* {"2026-06": "texte du plan de quarter"} clé = mois de départ du quarter */
  gh:{owner:"rogdolphe",repo:"tracker-aw",file:"civ_data.json"}
};
var C;
try{ C = JSON.parse(localStorage.getItem("civ_sobre_data")||"null"); }catch(e){ C=null; }
if(!C) C = JSON.parse(JSON.stringify(DEF_STATE));
(function merge(d,c){ for(var k in d){ if(c[k]===undefined) c[k]=d[k];
  else if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])) merge(d[k],c[k]); } })(DEF_STATE,C);

var tab="jour", selTerr=null, calRef=new Date(), qRef=new Date(), planEditDay=null;
var togg={gym:0,cul:0,soc:0};

/* ============ OUTILS ============ */
function $(id){return document.getElementById(id);}
function fv(n,d){ if(d===undefined)d=0; var neg=n<0; n=Math.abs(n);
  var s=n.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"-":"")+s+"$"; }
function fi(n){ return Math.round(n).toString(); }
function today(){ return new Date().toLocaleDateString("fr-CA"); }
function dstr(d){ return d.toLocaleDateString("fr-CA"); }
function noon(s){ return new Date(s+"T12:00"); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function save(){ C.ts=Date.now(); localStorage.setItem("civ_sobre_data", JSON.stringify(C)); ghQueue(); }
function mult(){ return C.streak>=30?2 : C.streak>=7?1.5 : 1; }
function strength(){ return C.troops + C.attack; }
function ownedBonus(){
  var b={prod:0,cul:0,soc:0,mil:0},k,j,w;
  for(k in C.owned){ if(C.owned[k]&&TERR[k]){ var bo=TERR[k].bonus; for(j in bo) b[j]+=bo[j]; } }
  for(w=0;w<WONDERS.length;w++){ if(C.built[WONDERS[w].id]){ var wb=WONDERS[w].bonus; for(j in wb) b[j]+=wb[j]; } }
  return b;
}
function rate30(){
  var n=0,s=0,lim=new Date(); lim.setDate(lim.getDate()-30);
  for(var i=0;i<C.hist.length;i++){ var h=C.hist[i];
    if(noon(h.d)>=lim){ n++; s+=h.s; } }
  return n? s/n : (C.totalSober>0?1:0);
}
function ciToday(){ for(var i=0;i<C.hist.length;i++) if(C.hist[i].d===today()) return C.hist[i]; return null; }
function mapDone(){ for(var k in TERR) if(!C.owned[k]) return false; return true; }
function nOwned(){ var n=0; for(var k in C.owned) if(C.owned[k]) n++; return n; }

/* ============ BARBARES — jours manqués & raids ============ */
function processMissed(){
  if(!C.start) return;
  var from = noon(C.lastDay||C.start); from.setDate(from.getDate()+1);
  var y=new Date(); y.setDate(y.getDate()-1); y.setHours(12,0,0,0);
  if(from>y) return;
  var hset={}; C.hist.forEach(function(h){hset[h.d]=1;});
  var missed=0, d=new Date(from);
  while(d<=y){ if(!hset[dstr(d)]) missed++; d.setDate(d.getDate()+1); }
  C.lastDay=dstr(y);
  if(missed>0){
    C.menace=Math.min(100, C.menace+missed*15);
    C.streak=0;
    C.raid=(C.raid||"")+" "+missed+" jour(s) sans tribunal — la menace barbare monte (+"+(missed*15)+").";
  }
  checkRaid(); save();
}
function checkRaid(){
  if(C.menace>=100){
    if(C.order.length){
      var t=C.order.pop(); C.owned[t]=false;
      C.raid="⚑ LES BARBARES ONT PILLÉ "+TERR[t].nom.toUpperCase()+" ! Reprends ta routine pour reconquérir.";
    } else {
      C.raid="⚑ Les barbares assiègent les portes. La capitale tient — mais reprends ta routine.";
    }
    C.menace=35;
  }
}
/* Budget auto-calculé : compare les dépenses du jour au budget quotidien */
function todayBudgetStatus(){
  var total=0;
  (C.fin.extras||[]).forEach(function(e){
    if(e.d===today() && (e.k==="dep-d"||e.k==="dep-c")) total+=e.amt;
  });
  var limit=(new Date().getDay()===6? (C.fin.budSat||100) : (C.fin.bud||40));
  if(total===0) return {st:"neutral", total:0, limit:limit};
  return {st:total<=limit?"green":"red", total:total, limit:limit};
}
/* Appelé après toute entrée de dépense pour recalculer le budget du jour */
function updateTodayBudget(){
  var h=ciToday(); if(!h) return;
  var bs=todayBudgetStatus();
  var hadBud=h.b.indexOf("bud")>=0;
  var shouldHave=(bs.st==="green"||bs.st==="neutral");
  /* neutre = on ne pénalise pas (rien entré) mais on ne crédite pas non plus */
  if(bs.st==="green" && !hadBud){ h.b.push("bud"); C.pts.prod+=5; save(); }
  else if(bs.st==="red" && hadBud){ h.b=h.b.filter(function(x){return x!=="bud";}); C.pts.prod=Math.max(0,C.pts.prod-5); save(); }
}

/* ============ MOTEUR DE JEU ============ */
window.tgB=function(k,v){ togg[k]=v; render(); };
window.doCheckin = function(sober){
  if(ciToday()){ alert("Déjà jugé aujourd'hui."); return; }
  if(!C.start){ C.start=today(); C.lastDay=today(); }
  var b=[]; ROUTINE.forEach(function(r){ if(togg[r.k]) b.push(r.k); });
  C.hist.unshift({d:today(), s:sober?1:0, b:b});
  C.lastDay=today();
  var m=mult(), ob=ownedBonus();
  if(sober){
    C.streak++; C.totalSober++;
    if(C.streak>C.best) C.best=C.streak;
    if(C.streak%7===0 && C.shields<3) C.shields++;
    C.pts.prod += Math.round(10*m) + ob.prod;
    C.pts.cul  += ob.cul;
    C.pts.soc  += ob.soc;
    C.pts.mil  += ob.mil;
    var sv=C.fin.save||0, sp=C.fin.split;
    C.fin.extraC1 += sv*sp.c1/100;
    C.fin.it      += sv*sp.it/100;
    C.fin.food    += sv*sp.food/100;
  } else {
    C.menace=Math.min(100,C.menace+20);
    relapse();
    checkRaid();
  }
  /* activités du jour : comptent TOUJOURS, sobre ou non (discipline ≠ sobriété) */
  C.pts.cul  += (b.indexOf("cul")>=0?3:0);
  C.pts.soc  += (b.indexOf("soc")>=0?3:0);
  C.pts.mil  += (b.indexOf("gym")>=0?3:0);
  /* budget auto-calculé : si dépenses sous le seuil → +5 ⚙ automatiquement */
  var bs=todayBudgetStatus();
  if(bs.st==="green" && b.indexOf("bud")<0){ b.push("bud"); C.pts.prod+=5; }
  else if(bs.st==="neutral") { /* rien entré → neutre, pas de point mais pas de pénalité */ }
  /* routine complète (3+/4 dont bud éventuel) = discipline → attaque & la menace recule */
  var routineCount=b.filter(function(k){return k!=="bud";}).length; /* gym+cul+soc seulement pour le seuil */
  if(routineCount>=3){ C.attack++; C.menace=Math.max(0,C.menace-10); }
  else if(routineCount>0){ C.menace=Math.max(0,C.menace-5); }
  togg={gym:0,cul:0,soc:0};
  save(); render();
};
function relapse(){
  if(C.shields>0){
    C.shields--; shave(0.10,0); C.pendExp=null;
    alert("Un bouclier a absorbé l'assaut. -10% des crédits. La série tient.");
    return;
  }
  var lost={ prod:Math.round(C.pts.prod*0.30), cul:Math.round(C.pts.cul*0.30),
             soc:Math.round(C.pts.soc*0.30), mil:Math.round(C.pts.mil*0.30),
             troops:Math.round(C.troops*0.25), terr:null };
  shave(0.30,0.25);
  C.streak=0;
  if(C.order.length){ var t=C.order.pop(); C.owned[t]=false; lost.terr=t; }
  C.pendExp={d:today(), lost:lost};
}
function shave(p,tp){
  C.pts.prod=Math.round(C.pts.prod*(1-p)); C.pts.cul=Math.round(C.pts.cul*(1-p));
  C.pts.soc=Math.round(C.pts.soc*(1-p)); C.pts.mil=Math.round(C.pts.mil*(1-p));
  C.troops=Math.round(C.troops*(1-tp));
}
window.doExpiation = function(){
  if(!C.pendExp) return;
  var sel=$("pen-sel");
  if(!sel||!confirm("Pénitence accomplie : "+sel.value+" ?\nL'honneur récupère la moitié des pertes.")) return;
  var L=C.pendExp.lost;
  C.pts.prod+=Math.round(L.prod/2); C.pts.cul+=Math.round(L.cul/2);
  C.pts.soc+=Math.round(L.soc/2); C.pts.mil+=Math.round(L.mil/2);
  C.troops+=Math.round(L.troops/2);
  C.pendExp=null; save(); render();
};

window.addActivity = function(k){
  var h=ciToday(); if(!h || h.b.indexOf(k)>=0) return;
  if(k==="cul") C.pts.cul+=3;
  else if(k==="soc") C.pts.soc+=3;
  else if(k==="gym") C.pts.mil+=3;
  var before=h.b.filter(function(x){return x!=="bud";}).length;
  h.b.push(k);
  var after=h.b.filter(function(x){return x!=="bud";}).length;
  if(before<3 && after>=3){ C.attack++; C.menace=Math.max(0,C.menace-5); }
  else if(before===0){ C.menace=Math.max(0,C.menace-5); }
  save(); render();
};
window.recruit = function(){
  if(C.pts.mil<10){ alert("Il faut 10 ⚔ par troupe. Va t'entraîner."); return; }
  var n=Math.floor(C.pts.mil/10);
  var q=parseInt(prompt("Recruter combien de troupes? (10 ⚔ chacune — max "+n+")","1")||"0",10);
  if(!q||q<1) return; q=Math.min(q,n);
  C.pts.mil-=q*10; C.troops+=q; save(); render();
};
window.selT = function(k){ selTerr=k; render(); };
window.conquer = function(k){
  var t=TERR[k]; if(!t||C.owned[k]) return;
  var adjOk=false; for(var a in C.owned){ if(C.owned[a]&&ADJ[a]&&ADJ[a].indexOf(k)>=0) adjOk=true; }
  if(!adjOk){ alert("Territoire non adjacent à l'empire."); return; }
  var cost=t.def*2, lossT=Math.ceil(t.def/2);
  if(strength()<t.def){ alert("Force insuffisante : "+t.def+" requis (troupes "+C.troops+" + attaque "+C.attack+" = "+strength()+"). La routine forge l'attaque."); return; }
  if(C.troops<lossT){ alert("Pas assez de troupes à sacrifier ("+lossT+" requises). Recrute au gym."); return; }
  if(C.pts.prod<cost){ alert("Production insuffisante : "+cost+" ⚙ requis."); return; }
  var gemTxt=Object.keys(t.gem).map(function(g){ var ic={prod:"⚙",cul:"🎭",soc:"🤝",mil:"⚔"}[g]; return "+"+t.gem[g]+" "+ic; }).join(", ");
  if(!confirm("Conquérir "+t.nom+" ?\nCoût : "+cost+" ⚙ et "+lossT+" troupes.\nButin : "+t.bld+(gemTxt?" (gemme "+gemTxt+")":""))) return;
  C.pts.prod-=cost; C.troops-=lossT; C.owned[k]=true; C.order.push(k);
  for(var g in t.gem) C.pts[g]+=t.gem[g];
  save(); render();
};
window.buildWonder = function(id){

  if(!confirm("Condition réelle accomplie?\n« "+w.cond+" »\n\nBâtir "+w.nom+" pour "+w.cout+" pts?")) return;
  C.pts[w.pts]-=w.cout; C.built[id]=today(); save(); render();
};

/* ============ SYNC GITHUB ============ */
var ghTimer=null, ghSha=null;
function ghTok(){ return localStorage.getItem("civ_gh_token")||""; }
window.setTok = function(v){ localStorage.setItem("civ_gh_token", v.trim()); setSyncStatus("pend","token enregistré — test en cours…"); ghLoad(); };
function ghURL(){ return "https://api.github.com/repos/"+C.gh.owner+"/"+C.gh.repo+"/contents/"+C.gh.file; }
function ghQueue(){ if(!ghTok()) return; clearTimeout(ghTimer); ghTimer=setTimeout(function(){ghSave(false);},1500); }
function setSyncStatus(st, msg){
  var led=$("sync-led"), txt=$("sync-txt");
  if(!led||!txt) return;
  var col={ok:"#6fae57", err:"#c0392b", pend:"#c9a227", off:"#8d99ab"}[st]||"#8d99ab";
  led.style.background=col;
  txt.textContent="Sync : "+msg;
}
window.forceSyncCiv = function(){ setSyncStatus("pend","envoi…"); ghSave(false); };
function ghSave(retry){
  var t=ghTok(); if(!t){ setSyncStatus("off","pas de token — colle-le dans Paramètres"); return; }
  setSyncStatus("pend","envoi…");
  var body={message:"civ sync "+new Date().toISOString(),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(C))))};
  if(ghSha) body.sha=ghSha;
  fetch(ghURL(),{method:"PUT",headers:{Authorization:"token "+t,"Content-Type":"application/json"},
    body:JSON.stringify(body)})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j.content&&j.content.sha){ ghSha=j.content.sha;
      setSyncStatus("ok","✓ synchronisé "+new Date().toLocaleTimeString("fr-CA"));
      var el=$("gh-st"); if(el) el.textContent="✓ synchronisé "+new Date().toLocaleTimeString("fr-CA");
    } else if(!retry){
      fetch(ghURL(),{headers:{Authorization:"token "+t}})
      .then(function(r){return r.json();})
      .then(function(m){ if(m.sha){ ghSha=m.sha; ghSave(true); } });
    } else { setSyncStatus("err","✗ conflit — réessaie dans ↻"); var el2=$("gh-st"); if(el2) el2.textContent="✗ conflit de sync"; }
  })
  .catch(function(){ setSyncStatus("err","✗ erreur réseau — vérifie ta connexion"); });
}
function ghLoad(){
  var t=ghTok(); if(!t){ setSyncStatus("off","pas de token — colle-le dans Paramètres"); return; }
  setSyncStatus("pend","chargement…");
  fetch(ghURL(),{headers:{Authorization:"token "+t}})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j.sha) ghSha=j.sha;
    if(j.content){
      var txt=decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))).trim()||"{}";
      var remote=JSON.parse(txt);
      if(remote && remote.hist && (remote.ts||0) > (C.ts||0)){
        C=remote;
        (function merge(d,c){ for(var k in d){ if(c[k]===undefined) c[k]=d[k];
          else if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])) merge(d[k],c[k]); } })(DEF_STATE,C);
        localStorage.setItem("civ_sobre_data", JSON.stringify(C));
        setSyncStatus("ok","✓ données reçues "+new Date().toLocaleTimeString("fr-CA"));
        processMissed(); render();
      } else {
        setSyncStatus("ok","✓ à jour "+new Date().toLocaleTimeString("fr-CA"));
      }
    } else if(j.message&&j.message.indexOf("Not Found")>=0){
      setSyncStatus("err","✗ fichier civ_data.json introuvable — crée-le dans GitHub");
    } else if(j.message&&j.message.indexOf("Bad credentials")>=0){
      setSyncStatus("err","✗ token invalide — recolle-le dans Paramètres");
    }
  }).catch(function(){ setSyncStatus("err","✗ erreur réseau — vérifie ta connexion"); });
}

/* ============ MOTEUR FINANCIER — projection quotidienne ============ */
function isPayday(d){
  var s=noon(C.fin.payStart);
  var n=daysBetween(s,d);
  return n>=0 && n%14===0;
}
function subDay(sub,d){
  var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return d.getDate()===Math.min(sub.day,last);
}
function buildProj(nDays){
  /* projette des/c1 jour par jour à partir des soldes ACTUELS (flux dès demain) */
  var des=C.fin.des, c1=C.fin.c1;
  var debts=C.fin.debts.map(function(x){return {nom:x.nom,solde:x.solde,pmt:x.pmt,day:x.day};});
  var exmap={}; C.fin.extras.forEach(function(e){ (exmap[e.d]=exmap[e.d]||[]).push(e); });
  var planmap={}; (C.fin.planPmts||[]).forEach(function(p){ planmap[p.d]=p; });
  var t0=new Date(); t0.setHours(12,0,0,0);
  var out={};
  for(var i=0;i<=nDays;i++){
    var d=new Date(t0); d.setDate(d.getDate()+i);
    var ds=dstr(d), items=[];
    if(i>0){
      if(d.getDate()===1){ c1=c1*(1+C.fin.apr/1200); items.push({c:"cre",t:"~intérêts C1"}); }
      if(isPayday(d)){
        des+=C.fin.pay; items.push({c:"pay",t:"💰+"+fi(C.fin.pay)});
        /* paiement C1 : override planifié si présent ce jour-là, sinon la moitié du mensuel */
        var pay = planmap[ds]? planmap[ds].amt : C.fin.c1pmt/2;
        if(pay>0){ des-=pay; c1-=pay; items.push({c:"deb",t:"💳C1 −"+fi(pay)+(planmap[ds]?" ★":"")}); }
      } else if(planmap[ds]){
        /* paiement C1 planifié hors paye (ponctuel) */
        var p2=planmap[ds].amt; des-=p2; c1-=p2; items.push({c:"deb",t:"💳C1 −"+fi(p2)+" ★"});
      }
      C.fin.subs.forEach(function(s){
        if(subDay(s,d)){
          if(s.type==="d"){ des-=s.amt; items.push({c:"deb",t:esc(s.nom)+" −"+fi(s.amt)}); }
          else { c1+=s.amt; items.push({c:"cre",t:"~"+esc(s.nom)+" "+fi(s.amt)}); }
        }
      });
      debts.forEach(function(dt){
        if(dt.solde>0 && d.getDate()===dt.day){
          var p=Math.min(dt.pmt,dt.solde); c1+=p; dt.solde-=p;
          items.push({c:"cre",t:"~"+esc(dt.nom)+" "+fi(p)});
        }
      });
      (exmap[ds]||[]).forEach(function(e){
        if(e.k==="dep-d"){ des-=e.amt; items.push({c:"deb",t:esc(e.nom)+" −"+fi(e.amt)}); }
        else if(e.k==="dep-c"){ c1+=e.amt; items.push({c:"cre",t:"~"+esc(e.nom)+" "+fi(e.amt)}); }
        else { des+=e.amt; items.push({c:"pay",t:"+"+esc(e.nom)+" "+fi(e.amt)}); }
      });
      des -= (d.getDay()===6? C.fin.budSat : C.fin.bud);
    } else {
      if(isPayday(d)) items.push({c:"pay",t:"💰 paye"});
      C.fin.subs.forEach(function(s){ if(subDay(s,d)) items.push({c:s.type==="d"?"deb":"cre",t:esc(s.nom)}); });
    }
    out[ds]={des:des,c1:Math.max(0,c1),items:items};
  }
  return out;
}
/* date du prochain payday à partir d'aujourd'hui (inclus) */
function nextPaydays(n){
  var out=[], d=new Date(); d.setHours(12,0,0,0);
  var guard=0;
  while(out.length<n && guard<400){ if(isPayday(d)) out.push(dstr(d)); d.setDate(d.getDate()+1); guard++; }
  return out;
}

/* simulation précise C1 : avance paye par paye (aux 14 j), intérêt mensuel le 1er,
   ajout des abonnements crédit, soustraction du paiement (planifié ou défaut), + tribut sobriété.
   extraPerPayday = tribut additionnel par paye (économie sobre accumulée sur 14 j). */
function simC1(extraPerPayday){
  var c1=C.fin.c1, d=new Date(); d.setHours(12,0,0,0);
  var planmap={}; (C.fin.planPmts||[]).forEach(function(p){ planmap[p.d]=p; });
  var guard=0, lastMonth=d.getMonth();
  while(c1>0.5 && guard<1500){
    d.setDate(d.getDate()+1); guard++;
    if(d.getMonth()!==lastMonth){ lastMonth=d.getMonth(); c1=c1*(1+C.fin.apr/1200); }
    /* abonnements crédit qui gonflent C1 */
    C.fin.subs.forEach(function(s){ if(s.type==="c" && subDay(s,d)) c1+=s.amt; });
    C.fin.debts.forEach(function(dt){ /* dettes payées via C1 — ignorées ici pour rester sur le solde C1 principal */ });
    if(isPayday(d)){
      var ds=dstr(d);
      var pay = planmap[ds]? planmap[ds].amt : (C.fin.c1pmt/2 + extraPerPayday);
      c1-=pay;
    } else if(planmap[dstr(d)]){
      c1-=planmap[dstr(d)].amt;
    }
  }
  return c1<=0.5? d : null;
}

/* ============ PRÉDICTIONS ============ */
function predict(rate){
  var res={};
  var bal=C.fin.c1, m=0, pmt=C.fin.c1pmt + C.fin.save*rate*30*(C.fin.split.c1/100);
  if(pmt>bal*C.fin.apr/1200 && bal>0){
    while(bal>0 && m<240){ bal=bal*(1+C.fin.apr/1200)-pmt; m++; }
    var d=new Date(); d.setMonth(d.getMonth()+m); res.c1zero=d; res.c1months=m;
  } else res.c1zero=null;
  var trip=noon("2026-09-11"); var dj=Math.max(0,daysBetween(new Date(),trip));
  res.italy=C.fin.it + C.fin.save*rate*(C.fin.split.it/100)*dj;
  var prodNeed=0,milNeed=0,k;
  for(k in TERR){ if(!C.owned[k]){ prodNeed+=TERR[k].def*2; milNeed+=Math.ceil(TERR[k].def/2)*10; } }
  prodNeed=Math.max(0,prodNeed-C.pts.prod);
  milNeed=Math.max(0,milNeed-C.troops*10-C.pts.mil);
  var ob=ownedBonus();
  var prodDay=(10*mult()+ob.prod+2)*rate, milDay=(3+ob.mil)*rate;
  var days=(prodDay>0&&milDay>0)? Math.max(prodNeed/prodDay, milNeed/milDay) : null;
  if(days!==null){ var md=new Date(); md.setDate(md.getDate()+Math.ceil(days)); res.mapDate=md; }
  else res.mapDate=null;
  return res;
}

function qMonth(mref, proj){
  var y=mref.getFullYear(), m=mref.getMonth();
  var first=new Date(y,m,1), start=(first.getDay()+6)%7, nd=new Date(y,m+1,0).getDate();

   mref.toLocaleDateString("fr-CA",{month:"long",year:"numeric"})+'</div><div class="qcal">'+
   ["L","M","M","J","V","S","D"].map(function(d){return '<div class="hd">'+d+'</div>';}).join("");
  for(var i=0;i<start;i++) s+='<div></div>';
  for(var d=1; d<=nd; d++){
    var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");

      });
      s+='<span class="sol '+(p.des>=0?'g':'r')+'">'+fi(p.des)+'</span>';
      s+='<span class="c1">C1 '+fi(p.c1)+'</span>';
    }

  }
  s+='</div></div>';

/* graphique double : dette C1 + solde Desjardins sur la fenêtre donnée */
function planChart(proj,keys){
  if(keys.length<2) return '<p class="dim">Fenêtre trop courte.</p>';
  var w=680,h=200,padL=40,padR=10,padB=22,padT=10;
  var c1s=keys.map(function(k){return proj[k].c1;});
  var dess=keys.map(function(k){return proj[k].des;});
  var maxV=Math.max.apply(null,c1s.concat(dess).concat([1]));
  var minV=Math.min.apply(null,dess.concat([0]));
  var n=keys.length;
  function X(i){ return padL+i/(n-1||1)*(w-padL-padR); }
  function Y(v){ return padT+(maxV-v)/((maxV-minV)||1)*(h-padT-padB); }
  function path(arr){ return arr.map(function(v,i){return (i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);}).join(" "); }
  var s='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;background:var(--ink);border:1px solid var(--line)">';
  s+='<line x1="'+padL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(w-padR)+'" y2="'+Y(0).toFixed(1)+'" stroke="#2a3344" stroke-dasharray="3 3"/>';
  s+='<text x="2" y="'+(Y(maxV)+4)+'" fill="#8d99ab" font-size="9">'+fi(maxV)+'</text>';
  s+='<text x="2" y="'+(Y(0)+4)+'" fill="#8d99ab" font-size="9">0</text>';
  (C.fin.planPmts||[]).forEach(function(p){
    var idx=keys.indexOf(p.d); if(idx>=0) s+='<line x1="'+X(idx).toFixed(1)+'" y1="'+padT+'" x2="'+X(idx).toFixed(1)+'" y2="'+(h-padB)+'" stroke="#c9a227" stroke-width="1" opacity=".4"/><text x="'+X(idx).toFixed(1)+'" y="'+(padT+8)+'" fill="#c9a227" font-size="10" text-anchor="middle">★</text>';
  });
  s+='<path d="'+path(dess)+'" stroke="#6fae57" stroke-width="2" fill="none"/>';
  s+='<path d="'+path(c1s)+'" stroke="#c9a227" stroke-width="2" fill="none"/>';
  var lastM=-1;
  keys.forEach(function(k,i){ var mo=noon(k).getMonth(); if(mo!==lastM){ lastM=mo;
    s+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" fill="#8d99ab" font-size="8" text-anchor="middle">'+noon(k).toLocaleDateString("fr-CA",{month:"short"})+'</text>'; } });
  s+='</svg>';
  return s;
}

    '<div><label class="f">% → C1</label><input type="number" value="'+f.split.c1+'" onchange="uS(\'c1\',this.value)"></div>'+
    '<div><label class="f">% → Italie</label><input type="number" value="'+f.split.it+'" onchange="uS(\'it\',this.value)"></div>'+
    '<div><label class="f">% → Bouffe</label><input type="number" value="'+f.split.food+'" onchange="uS(\'food\',this.value)"></div></div>'+
   '<label class="f">Ajustement — Fonds Italie $</label><input type="number" step="0.01" value="'+f.it.toFixed(2)+'" onchange="uF(\'it\',this.value)">'+
   '<label class="f">Ajustement — Fonds bouffe $</label><input type="number" step="0.01" value="'+f.food.toFixed(2)+'" onchange="uF(\'food\',this.value)">'+
  '</div></div>';
  /* abonnements */
  out+='<div class="card"><h2>Charges fixes (abonnements)</h2><table><tr><th>Nom</th><th>$</th><th>Type</th><th>Jour</th><th></th></tr>'+
   f.subs.map(function(s,i){
     return '<tr><td><input value="'+esc(s.nom)+'" onchange="uSub('+i+',\'nom\',this.value)"></td>'+
      '<td style="width:90px"><input type="number" step="0.01" value="'+s.amt+'" onchange="uSub('+i+',\'amt\',this.value)"></td>'+
      '<td style="width:110px"><select onchange="uSub('+i+',\'type\',this.value)">'+
        '<option value="d"'+(s.type==="d"?" selected":"")+'>Débit</option>'+
        '<option value="c"'+(s.type==="c"?" selected":"")+'>Crédit C1</option></select></td>'+
      '<td style="width:70px"><input type="number" min="1" max="31" value="'+s.day+'" onchange="uSub('+i+',\'day\',this.value)"></td>'+
      '<td><button class="ghost" onclick="delSub('+i+')">✕</button></td></tr>';
   }).join("")+
   '</table><button class="ghost" style="margin-top:8px" onclick="addSub()">+ Ajouter une charge</button></div>';
  /* dettes secondaires */
  out+='<div class="card"><h2>Dettes secondaires</h2><table><tr><th>Nom</th><th>Solde $</th><th>Paiement $/mois</th><th>Jour</th><th></th></tr>'+
   f.debts.map(function(s,i){
     return '<tr><td><input value="'+esc(s.nom)+'" onchange="uDebt('+i+',\'nom\',this.value)"></td>'+
      '<td style="width:90px"><input type="number" step="0.01" value="'+s.solde+'" onchange="uDebt('+i+',\'solde\',this.value)"></td>'+
      '<td style="width:90px"><input type="number" value="'+s.pmt+'" onchange="uDebt('+i+',\'pmt\',this.value)"></td>'+
      '<td style="width:70px"><input type="number" min="1" max="31" value="'+s.day+'" onchange="uDebt('+i+',\'day\',this.value)"></td>'+
      '<td><button class="ghost" onclick="delDebt('+i+')">✕</button></td></tr>';
   }).join("")+
   '</table><button class="ghost" style="margin-top:8px" onclick="addDebt()">+ Ajouter</button>'+
   '<p class="dim">Payées via la carte C1 le jour indiqué (comme ton ticket à 40$/mois le 27).</p></div>';
  /* sync */
  out+='<div class="card"><h2>Sync GitHub</h2><div class="grid3">'+
   '<div><label class="f">Owner</label><input value="'+C.gh.owner+'" onchange="uG(\'owner\',this.value)"></div>'+
   '<div><label class="f">Repo</label><input value="'+C.gh.repo+'" onchange="uG(\'repo\',this.value)"></div>'+
   '<div><label class="f">Fichier</label><input value="'+C.gh.file+'" onchange="uG(\'file\',this.value)"></div></div>'+
   '<label class="f">Personal Access Token (stocké localement)</label>'+
   '<input type="password" value="'+(ghTok()?'••••••••':'')+'" onchange="setTok(this.value)" placeholder="ghp_…">'+
   '<p class="dim" id="gh-st">Crée d\'abord civ_data.json (contenu : {}) dans le repo. Même patron que fin_data.json.</p>'+
   '<div class="flexr"><button class="ghost" onclick="expJSON()">Exporter JSON</button>'+
   '<label class="ghost" style="display:inline-block">Importer JSON <input type="file" accept=".json" style="display:none" onchange="impJSON(event)"></label></div>'+
  '</div>';
  /* punitions / pénitences éditables */
  out+='<div class="card"><h2>Pénitences (expiation après rechute)</h2>'+
   '<p class="dim">La liste proposée quand tu dois racheter une rechute. Édite, supprime, ajoute les tiennes — celles que les équipes sportives s\'infligent et que tu peux faire à Montréal.</p>'+
   (C.pen||[]).map(function(p,i){
     return '<div class="flexr" style="margin-bottom:5px"><input value="'+esc(p)+'" onchange="uPen('+i+',this.value)" style="flex:1">'+
      '<button class="ghost" onclick="delPen('+i+')">✕</button></div>';
   }).join("")+
   '<div class="flexr" style="margin-top:8px"><input id="pen-new" placeholder="Nouvelle pénitence (ex. 200 jumping jacks, sprint côte Berri…)" style="flex:1">'+
   '<button class="act" style="width:auto" onclick="addPen()">+ Ajouter</button></div></div>';
  return out;
}

processMissed();
render();
ghLoad();
/* sync quasi temps réel téléphone ↔ PC : recharge au retour sur l'app + toutes les 2 min */
document.addEventListener("visibilitychange",function(){ if(!document.hidden) ghLoad(); });
setInterval(ghLoad, 120000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYM.AW — Entraînement</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0d1117; --panel:#151b24; --panel2:#1b2330; --line:#2a3344;
  --parch:#e7dec8; --dim:#8d99ab; --gold:#c9a227; --gold-dim:#7a6418;
  --green:#6fae57; --green-d:#2e4d24; --red:#c0392b; --red-d:#4d1f19;
  --blue:#4a7fb5; --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-variant:small-caps;letter-spacing:.12em;font-weight:600;margin:0 0 8px}
h1{font-size:20px;color:var(--gold)}
h2{font-size:15px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:5px}
h3{font-size:13px;color:var(--parch)}
small,.dim{color:var(--dim)}
.wrap{max-width:760px;margin:0 auto;padding:12px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:2px solid var(--gold-dim);padding-bottom:8px;margin-bottom:8px}
nav.tabs{display:flex;gap:4px;margin:8px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:13px;padding:10px 13px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--gold);border-color:var(--gold-dim);background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--panel2);border:1px solid var(--line);padding:8px 10px}
.stat b{display:block;font-size:16px;margin-top:2px}
.g{color:var(--green)}.r{color:var(--red)}.au{color:var(--gold)}.bl{color:var(--blue)}
button.act{background:var(--gold-dim);border:1px solid var(--gold);color:#fff;font-family:var(--mono);font-size:14px;padding:12px 16px;cursor:pointer;width:100%}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:12px;padding:8px 11px;cursor:pointer}
input,select,textarea{background:var(--ink);border:1px solid var(--line);color:var(--parch);font-family:var(--mono);font-size:15px;padding:9px;width:100%}
input[type=number]{font-size:17px}
label.f{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:8px 0 3px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
th{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.exrow{border-bottom:1px solid var(--line);padding:9px 0 10px;position:relative}
.exrow.ss{border-left:3px solid var(--blue);padding-left:9px}
.exrow.ss .sstag{position:absolute;left:-3px;top:-1px;background:var(--blue);color:#fff;font-size:8px;padding:0 4px;letter-spacing:.1em}
.exname{font-weight:bold;font-size:14px}
.home-badge{color:var(--gold);font-size:9px;border:1px solid var(--gold-dim);padding:0 4px;border-radius:2px;letter-spacing:.08em;vertical-align:middle}
.exsugg{font-size:11px;color:var(--dim);margin:1px 0 6px}
.exin{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exin .w{width:88px}
.exin .s{width:54px}
.exin .x{color:var(--dim)}
.rpe{display:flex;gap:4px}
.rpe button{width:38px;height:36px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:13px;cursor:pointer}
.rpe button.on{background:var(--gold-dim);border-color:var(--gold);color:#fff}
.skip{margin-left:auto}
.skip button{width:36px;height:36px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:14px}
.skip button.off{background:var(--red-d);border-color:var(--red);color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .d{background:var(--panel2);border:1px solid var(--line);min-height:62px;padding:3px 4px;font-size:9px;position:relative}
.cal .d.ok{border-color:var(--green);background:#16240f}
.cal .d.miss{border-color:var(--red);background:#2b1410}
.cal .d.today{outline:2px solid var(--gold)}
.cal .d .pl{display:block;color:var(--dim)}
.cal .d .xtra{display:block;color:var(--gold)}
.cal .hd{text-align:center;color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.msg{border:1px solid var(--gold-dim);background:#1f1a08;padding:8px 10px;margin:8px 0;font-size:12px}
.phase{padding:10px 12px;margin-bottom:10px}
.phase .pr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.phase .rir{text-align:right;font-size:11px;white-space:nowrap}
.wkrow{padding:7px 10px;margin:5px 0;border:1px solid var(--line)}
.wkrow.cur{background:var(--panel2)}
.flexr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.chart{width:100%;background:var(--ink);border:1px solid var(--line)}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.prog-ex{border-bottom:1px solid var(--line);padding:8px 0}
.prog-ex .row1{display:flex;gap:6px;align-items:center}
.prog-ex .row2{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.prog-ex input.nm{flex:1}
.prog-ex input.sm{width:64px}
.prog-ex select.sm{width:auto}
.setrow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.setlbl{font-size:12px;color:var(--dim);width:54px;flex-shrink:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp{display:inline-flex;align-items:stretch;border:1px solid var(--line);background:var(--ink);border-radius:3px;overflow:hidden}
.stp button{width:44px;min-height:48px;background:var(--panel2);border:none;color:var(--gold);font-size:24px;line-height:1;cursor:pointer;font-family:var(--mono);touch-action:manipulation}
.stp button:active{background:var(--gold-dim);color:#fff}
.stp input{border:none;width:62px;text-align:center;font-size:20px;background:transparent;padding:11px 2px;color:var(--parch)}
.stptag{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;align-self:center}
.setdel{width:42px;min-height:48px;padding:0;color:var(--red);border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px}
.addset{color:var(--green)}
.skipbtn{color:var(--dim)}
.swaprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.menua{color:var(--red);border-color:var(--red)}
.menub{color:var(--gold);border-color:var(--gold-dim)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:18px 10px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--gold-dim);max-width:560px;width:100%;padding:14px;max-height:88vh;display:flex;flex-direction:column}
.modal h3{margin:0}
.bank-list{overflow:auto;margin-top:10px;flex:1;min-height:120px}
.bank-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.bank-item:active,.bank-item:hover{background:var(--panel2)}
.bank-item .cat{font-size:11px;color:var(--dim);white-space:nowrap}
.bank-cat{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:12px 0 2px;border-bottom:1px solid var(--line);padding-bottom:3px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1>🏋️ GYM.AW</h1><div class="dim" style="font-size:10px;letter-spacing:.15em" id="sub"></div></div>
  <div style="text-align:right;font-size:11px" id="top-stats"></div>
</header>
<div id="sync-bar" style="display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11px">
  <span id="sync-dot" style="display:inline-flex;align-items:center;gap:6px"><span id="sync-led" style="width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block"></span><span id="sync-txt">Sync : en attente…</span></span>
  <button onclick="forceSyncGym()" style="background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer">↻ Sync</button>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="app"></div>
<div id="overlay"></div>
<div style="margin-top:16px;font-size:10px;color:var(--dim);text-align:center">GYM.AW — la discipline forge l'attaque.</div>
</div>

<script>
(function(){
"use strict";

/* ============ PROGRAMME PAR DÉFAUT ============ */
/* mode: "lin" = paliers (réussite → +step, 2 échecs → −10%)
   mode: "dp"  = double progression (reps→repHi, puis +step et retour à reps)
   unit: "lbs" (défaut) ou "s" (tenues/temps — reps = secondes)
   loc:  "gym" (défaut) ou "home" (loaded strap à la maison) */
function E(nom,sets,reps,poids,step,mode,opt){
  var o=opt||{};
  return {id:o.id, nom:nom, sets:sets, reps:reps, repHi:o.repHi||reps+2,
          poids:poids, step:step, mode:mode, unit:o.unit||"lbs", ssg:o.ssg||0, aw:!!o.aw, loc:o.loc||"gym", bw:!!o.bw};
}
var DEF_DAYS = {
  lun:{nom:"Pull A · Dos épais", lieu:"Yvon Deschamps", type:"gym"},
  mar:{nom:"Push A · Horizontal", lieu:"Yvon Deschamps", type:"gym"},
  mer:{nom:"Nage récup · zone 2", lieu:"Yvon Deschamps", type:"nage"},
  jeu:{nom:"Jambes + Tronc", lieu:"Yvon Deschamps", type:"gym"},
  ven:{nom:"Pull B · Dos large + AW", lieu:"Yvon Deschamps", type:"gym"},
  sam:{nom:"Push B + Bras (léger)", lieu:"Yvon Deschamps", type:"gym"},
  dim:{nom:"Repos", lieu:"", type:"repos"}
};
var DEF_EX = {
  lun:[
    E("Assisted Pull-up",3,6,-40,5,"lin"),
    E("Seated Cable Row",3,8,135,5,"dp",{repHi:12}),
    E("EZ-Bar Curl",3,8,100,2.5,"dp",{repHi:12,ssg:1}),
    E("Face Pull",3,15,60,2.5,"dp",{repHi:20,ssg:1}),
    E("Hammer Curl",3,8,50,2.5,"dp",{repHi:12,ssg:2,aw:true}),
    E("Wrist Curl",3,12,20,2.5,"dp",{repHi:20,ssg:2,aw:true}),
    E("Hanging Knee Raise",3,10,0,0,"dp",{repHi:15})
  ],
  mar:[
    E("Barbell Bench Press",3,5,185,5,"lin"),
    E("Incline Dumbbell Press",3,8,70,2.5,"dp",{repHi:12}),
    E("Dumbbell Shoulder Press",3,8,60,2.5,"dp",{repHi:12,ssg:1}),
    E("Lateral Raise",3,15,15,2.5,"dp",{repHi:20,ssg:1}),
    E("Triceps Pushdown",3,10,30,2.5,"dp",{repHi:15}),
    E("Pronation (loaded strap)",3,10,35,2.5,"dp",{repHi:14,ssg:3,aw:true,loc:"home"}),
    E("Rising (loaded strap)",3,8,35,2.5,"dp",{repHi:12,ssg:3,aw:true,loc:"home"})
  ],
  mer:[],
  jeu:[
    E("Barbell Squat",3,6,140,5,"lin"),
    E("Romanian Deadlift",3,8,95,5,"lin"),
    E("Single-Leg Squat",2,8,0,0,"dp",{repHi:10,ssg:1}),
    E("Back Extension",3,12,20,2.5,"dp",{repHi:15,ssg:1}),
    E("Plank",3,60,0,5,"dp",{repHi:90,unit:"s",ssg:2}),
    E("Bird Dog (band)",2,10,0,0,"dp",{repHi:12,ssg:2})
  ],
  ven:[
    E("Lat Pulldown",3,10,125,5,"dp",{repHi:15}),
    E("Dumbbell Row",3,10,70,2.5,"dp",{repHi:12}),
    E("Pulldown Bicep Curl",3,10,115,2.5,"dp",{repHi:15,ssg:1}),
    E("Short Curl (DB)",3,12,80,2.5,"dp",{repHi:15,ssg:1,aw:true}),
    E("Finger Curls",3,15,20,2.5,"dp",{repHi:20,aw:true}),
    E("Rising (loaded strap)",4,8,35,2.5,"dp",{repHi:12,aw:true,loc:"home"}),
    E("Side Pressure / wrist wrench",3,10,20,2.5,"dp",{repHi:14,ssg:2,aw:true,loc:"home"}),
    E("Back Pressure / king's move",3,10,20,2.5,"dp",{repHi:14,ssg:2,aw:true,loc:"home"})
  ],
  sam:[
    E("Incline Dumbbell Press",3,10,70,2.5,"dp",{repHi:15}),
    E("Dips",3,8,0,2.5,"dp",{repHi:12}),
    E("Dumbbell Shoulder Press",3,10,60,2.5,"dp",{repHi:12,ssg:1}),
    E("Lateral Raise",3,15,15,2.5,"dp",{repHi:20,ssg:1}),
    E("Triceps Pushdown",3,12,30,2.5,"dp",{repHi:15,ssg:2}),
    E("Cupping (machine)",3,10,60,2.5,"dp",{repHi:14,ssg:2,aw:true}),
    E("Farmer's Carry",3,30,55,2.5,"dp",{repHi:45,unit:"s",aw:true}),
    E("Pronation (loaded strap)",2,15,35,2.5,"dp",{repHi:18,aw:true,loc:"home"})
  ]
};
/* ids */
(function(){ for(var d in DEF_EX) DEF_EX[d].forEach(function(x,i){ x.id=d+"_"+i; }); })();

var DEF_STATE = {
  ts:0,
  days:DEF_DAYS,
  ex:DEF_EX,
  comp:{date:"2026-10-17", nom:"Armbash ArmWrestling Series — Hawkesbury, ON"},
  logs:[],
  body:[],
  sugg:["Escaliers du Mont-Royal","Vélo — canal Lachine","Badminton libre Yvon Deschamps",
        "Bloc à Allez Up","Rando Mont-Saint-Hilaire","Ping-pong parc Lafontaine","Marche rapide 5 km"],
  gh:{owner:"rogdolphe",repo:"tracker-aw",file:"gym_data.json"}
};
var G;
try{ G = JSON.parse(localStorage.getItem("gym_aw_data")||"null"); }catch(e){ G=null; }
if(!G) G = JSON.parse(JSON.stringify(DEF_STATE));
(function merge(d,c){ for(var k in d){ if(c[k]===undefined) c[k]=d[k];
  else if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])) merge(d[k],c[k]); } })(DEF_STATE,G);
/* migration : installe le programme courant (logs/poids/comp conservés) */
function migrate(){
  if(G.progVersion!==3){
    G.days=JSON.parse(JSON.stringify(DEF_DAYS));
    G.ex=JSON.parse(JSON.stringify(DEF_EX));
    if(!G.comp) G.comp=JSON.parse(JSON.stringify(DEF_STATE.comp));
    G.progVersion=3;
  }
}
migrate();

var tab="seance", calRef=new Date(), logKind=null, statEx=null, selDay=null, pendingDel=null;
var bankTarget=null, exMenu=null;
var form={};

/* ============ OUTILS ============ */
var DK=["dim","lun","mar","mer","jeu","ven","sam"];
function $(id){return document.getElementById(id);}
function today(){ return new Date().toLocaleDateString("fr-CA"); }
function dstr(d){ return d.toLocaleDateString("fr-CA"); }
function noon(s){ return new Date(s+"T12:00"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function dayKey(d){ return DK[d.getDay()]; }
function r25(n){ return Math.round(n/2.5)*2.5; }
function save(){ G.ts=Date.now(); localStorage.setItem("gym_aw_data", JSON.stringify(G)); ghQueue(); }
function allEx(){ var out=[],d; for(d in G.ex) G.ex[d].forEach(function(x){out.push(x);}); return out; }
function exById(id){ var a=allEx(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function lastEntries(id,n){
  var out=[];
  for(var i=0;i<G.logs.length && out.length<n;i++){
    var L=G.logs[i]; if(L.kind!=="gym"||!L.entries) continue;
    for(var j=0;j<L.entries.length;j++) if(L.entries[j].id===id){ out.push(L.entries[j]); break; }
  }
  return out;
}
function e1rm(w,r){ return w*(1+r/30); }
function homeBadge(x){ return x.loc==="home"?' <span class="home-badge">🏠 MAISON</span>':''; }

/* ---- séries (poids × reps par série) ---- */
function entrySets(en){
  if(en.s && en.s.length) return en.s;
  if(en.wts && en.wts.length) return en.wts.map(function(w){ return {w:w, r:en.reps}; });
  var arr=[], n=en.sets||1; for(var i=0;i<n;i++) arr.push({w:en.poids||0, r:en.reps||0}); return arr;
}
function entryVol(en, unit){
  if(unit==="s") return 0;
  var v=0; entrySets(en).forEach(function(s){ v+=(s.w||0)*(s.r||0); }); return v;
}
function entryTop(en){
  var m=0; entrySets(en).forEach(function(s){ if((s.w||0)>m) m=s.w; }); return m||en.poids||0;
}
function entrySetsText(en, unit){
  return entrySets(en).map(function(s){
    if(unit==="s") return (s.w>0? s.w+"lb·":"")+(s.r||0)+"s";
    return (s.w>0? s.w+"×"+(s.r||0) : (s.r||0)+" PdC");
  }).join(",  ");
}

/* ---- persistance du brouillon de séance (survit rotation / sortie d'app) ---- */
function saveDraft(){ try{ localStorage.setItem("gym_aw_draft", JSON.stringify({d:today(), logKind:logKind, form:form})); }catch(e){} }
function loadDraft(){
  try{
    var dr=JSON.parse(localStorage.getItem("gym_aw_draft")||"null");
    if(dr && dr.d===today() && dr.logKind){ logKind=dr.logKind; form=dr.form||{}; }
    else if(dr){ localStorage.removeItem("gym_aw_draft"); }
  }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem("gym_aw_draft"); }catch(e){} }

/* pré-remplit les séries d'un exercice (dernière séance, sinon suggestion) */
function ensureSets(x){
  form[x.id]=form[x.id]||{};
  if(!form[x.id].s){
    var sg=suggest(x), n=x.sets||1, last=lastEntries(x.id,1)[0], base=last?entrySets(last):null, arr=[];
    for(var i=0;i<n;i++){
      arr.push({ w:(base&&base[i]?base[i].w:sg.poids), r:(base&&base[i]?base[i].r:sg.reps) });
    }
    form[x.id].s=arr;
  }
  return form[x.id];
}
window.setW=function(id,i,v){ form[id]=form[id]||{}; form[id].s=form[id].s||[]; (form[id].s[i]=form[id].s[i]||{}).w=parseFloat(v)||0; saveDraft(); };
window.setR=function(id,i,v){ form[id]=form[id]||{}; form[id].s=form[id].s||[]; (form[id].s[i]=form[id].s[i]||{}).r=parseFloat(v)||0; saveDraft(); };
window.addSet=function(id){ var f=form[id]; if(!f||!f.s) return; var l=f.s[f.s.length-1]||{w:0,r:0}; f.s.push({w:l.w,r:l.r}); saveDraft(); render(); };
window.delSet=function(id,i){ var f=form[id]; if(!f||!f.s) return; f.s.splice(i,1); if(!f.s.length) f.s.push({w:0,r:0}); saveDraft(); render(); };
window.stepW=function(id,i,dir,step){ form[id]=form[id]||{}; form[id].s=form[id].s||[]; var s=form[id].s[i]=form[id].s[i]||{w:0,r:0};
  s.w=Math.round(((parseFloat(s.w)||0)+dir*step)/0.5)*0.5; var el=$("w_"+id+"_"+i); if(el) el.value=s.w; saveDraft(); };
window.stepR=function(id,i,dir,inc){ form[id]=form[id]||{}; form[id].s=form[id].s||[]; var s=form[id].s[i]=form[id].s[i]||{w:0,r:0};
  s.r=Math.max(0,(parseFloat(s.r)||0)+dir*inc); var el=$("r_"+id+"_"+i); if(el) el.value=s.r; saveDraft(); };

/* ---- banque d'exercices (pour Retirer / Remplacer) ---- */
function B(nom,cat,sets,reps,repHi,poids,step,mode,o){
  o=o||{}; return {nom:nom,cat:cat,sets:sets,reps:reps,repHi:repHi,poids:poids,step:step,mode:mode,unit:o.unit||"lbs",aw:!!o.aw,loc:o.loc||"gym",bw:!!o.bw};
}
var BANK=[
  B("Assisted Pull-up","Dos",3,6,10,-40,5,"lin"),
  B("Pull-up","Dos",3,5,8,0,2.5,"lin",{bw:true}),
  B("Lat Pulldown","Dos",3,10,15,100,5,"dp"),
  B("Seated Cable Row","Dos",3,8,12,120,5,"dp"),
  B("Dumbbell Row","Dos",3,10,12,60,2.5,"dp"),
  B("Barbell Row","Dos",3,8,12,115,5,"dp"),

function bankFilter(q){
  q=(q||"").toLowerCase().trim();
  var out=[]; for(var i=0;i<BANK.length;i++){ var b=BANK[i];
    if(!q || b.nom.toLowerCase().indexOf(q)>=0 || b.cat.toLowerCase().indexOf(q)>=0) out.push({b:b,idx:i}); }
  return out;
}
function bankListHTML(q){
  var items=bankFilter(q); if(!items.length) return '<p class="dim" style="padding:10px">Aucun résultat.</p>';
  var catO={"Dos":0,"Pectoraux":1,"Épaules":2,"Bras":3,"Avant-bras":4,"Bras de fer":5,"Jambes":6,"Tronc":7,"Cardio / cond.":8};
  items.sort(function(a,b){ var d=((catO[a.b.cat]==null?9:catO[a.b.cat]))-((catO[b.b.cat]==null?9:catO[b.b.cat])); return d||a.b.nom.localeCompare(b.b.nom); });
  var out="", lastCat="";
  items.forEach(function(o){
    if(o.b.cat!==lastCat){ out+='<div class="bank-cat">'+esc(o.b.cat)+'</div>'; lastCat=o.b.cat; }
    out+='<div class="bank-item" onclick="chooseBank('+o.idx+')"><span>'+esc(o.b.nom)+
      (o.b.aw?' <span class="bl">⚔</span>':'')+(o.b.loc==="home"?' <span class="home-badge">🏠</span>':'')+'</span>'+
      '<span class="cat">'+o.b.sets+'×'+o.b.reps+(o.b.repHi>o.b.reps?'-'+o.b.repHi:'')+(o.b.unit==="s"?"s":"")+'</span></div>';
  });
  return out;
}

/* ============ PÉRIODISATION (pilotée par la date de compétition) ============ */
function compDate(){ return (G.comp&&G.comp.date)? noon(G.comp.date) : null; }
function daysToComp(){ var c=compDate(); if(!c) return null; var n=new Date(); n.setHours(12,0,0,0); return Math.round((c-n)/86400000); }
function weeksToComp(){ var d=daysToComp(); return d==null?null:Math.ceil(d/7); }
function phaseFor(wk){
  if(wk==null) return {n:"—",rir:"—",vol:"—",focus:"Aucune date de compétition réglée (⚙ Réglages)",col:"#8d99ab"};
  if(wk<0)   return {n:"Hors saison",rir:"3",vol:"libre",focus:"Compétition passée — repos puis nouveau bloc",col:"#8d99ab"};
  if(wk===0) return {n:"Jour J",rir:"—",vol:"—",focus:"Compétition — bon combat",col:"#c9a227"};
  if(wk===1) return {n:"Affûtage",rir:"2-3",vol:"−60%",focus:"Snap court, repos maximal, arriver frais",col:"#c0392b"};
  if(wk<=3)  return {n:"Pic AW",rir:"0-1 (AW)",vol:"bas",focus:"Table fraîche, technique, tous les vecteurs",col:"#c0392b"};
  if(wk<=6)  return {n:"Intensification",rir:"1-2",vol:"général ↓ / AW ↑",focus:"AW sous charge, top sets lourds",col:"#8a5a2b"};
  if(wk===7) return {n:"Décharge",rir:"3",vol:"−45%",focus:"Récup tendineuse avant le pic",col:"#6fae57"};
  if(wk<=11) return {n:"Accumulation",rir:"2-3",vol:"haut",focus:"Construire le volume et la technique",col:"#4a7fb5"};
  return {n:"Base / ré-entrée",rir:"3",vol:"modéré, on monte",focus:"Tendons, technique, recomp — pas de grind",col:"#4a7fb5"};
}

/* ============ MOTEUR DE PROGRESSION ============ */
function fail(ex,en){ var r=(en.reps!=null?en.reps:0); return r < ex.reps; }
function suggest(ex){
  var h=lastEntries(ex.id,2);
  if(!h.length) return {poids:ex.poids, reps:ex.reps, why:"relance"};
  var L=h[0], lr=(L.reps!=null?L.reps:0), top=entryTop(L), ok=!fail(ex,L);
  if(ex.mode==="dp"){
    if(lr>=ex.repHi && ok) return {poids:top+ex.step, reps:ex.reps, why:ex.repHi+(ex.unit==="s"?"s":" reps")+" atteint → +"+ex.step};
    if(ok) return {poids:top, reps:Math.min(lr+(ex.unit==="s"?5:1), ex.repHi), why:"monte vers "+ex.repHi+(ex.unit==="s"?"s":"")};
    return {poids:top, reps:lr, why:"consolide"};
  }
  if(ok) return {poids:top+ex.step, reps:ex.reps, why:"réussi → +"+ex.step};
  if(h[1] && fail(ex,h[1])) return {poids:Math.max(0,r25(top*0.9)), reps:ex.reps, why:"2 échecs → décharge 10%"};
  return {poids:top, reps:ex.reps, why:"échec → même charge"};
}

/* ============ ACTIONS — séance ============ */
function parseWeights(v){
  var arr=String(v).split(/[\s,]+/).map(function(s){return parseFloat(s);}).filter(function(n){return !isNaN(n);});
  return arr;
}
window.uSkip=function(id){ form[id]=form[id]||{}; form[id].skip=!form[id].skip; saveDraft(); render(); };
window.setKind=function(k){ logKind=k; if(!k) clearDraft(); else saveDraft(); render(); };

window.finishGym=function(dk){
  var exs=G.ex[dk]||[], entries=[], prs=[];
  exs.forEach(function(x){
    var f=form[x.id]; if(!f || f.skip) return;
    var sets=(f.s||[]).filter(function(s){ return (s.w||0)>0 || (s.r||0)>0; });
    if(!sets.length) return;
    var top=0, topR=0;
    sets.forEach(function(s){ if((s.w||0)>=top){ top=s.w||0; topR=s.r||0; } });
    entries.push({id:x.id, nom:x.nom, s:sets, poids:top, reps:topR, unit:x.unit});
    var hist=lastEntries(x.id,99), max=0;
    hist.forEach(function(h){ var t=entryTop(h); if(t>max) max=t; });
    if(top>max && top>0 && x.unit==="lbs") prs.push(x.nom+" — "+top+" lb");
  });
  if(!entries.length){ alert("Aucune série entrée."); return; }
  G.logs.unshift({d:today(), kind:"gym", day:dk, entries:entries});
  civFlag();
  form={}; logKind=null; clearDraft(); save(); render();
  if(prs.length) alert("🏆 NOUVEAU PR !\n"+prs.join("\n"));
};

/* ============ SYNC GITHUB ============ */
var ghTimer=null, ghSha=null;
function setSyncStatus(st, msg){
  var led=$("sync-led"), txt=$("sync-txt");
  if(!led||!txt) return;
  var col={ok:"#6fae57", err:"#c0392b", pend:"#c9a227", off:"#8d99ab"}[st]||"#8d99ab";
  led.style.background=col;
  txt.textContent="Sync : "+msg;
}
window.forceSyncGym = function(){ setSyncStatus("pend","envoi…"); ghSave(false); ghLoad(); };
function ghTok(){ return localStorage.getItem("civ_gh_token")||""; }
window.setTok=function(v){ localStorage.setItem("civ_gh_token", v.trim()); };
function ghURL(){ return "https://api.github.com/repos/"+G.gh.owner+"/"+G.gh.repo+"/contents/"+G.gh.file; }
function ghQueue(){ if(!ghTok()) return; clearTimeout(ghTimer); ghTimer=setTimeout(function(){ghSave(false);},1500); }
function ghSave(){
  var t=ghTok(); if(!t){ setSyncStatus("off","pas de token — colle-le dans Réglages"); return; }
  setSyncStatus("pend","envoi…");
  var payload=btoa(unescape(encodeURIComponent(JSON.stringify(G))));
  /* 1) récupérer le sha courant (obligatoire pour mettre à jour un fichier existant) */
  fetch(ghURL(),{headers:{Authorization:"token "+t}})
  .then(function(r){ return r.json().catch(function(){return {};}); })
  .then(function(meta){
    var body={message:"gym sync "+new Date().toISOString(), content:payload};
    if(meta && meta.sha){ body.sha=meta.sha; ghSha=meta.sha; }
    return fetch(ghURL(),{method:"PUT",
      headers:{Authorization:"token "+t,"Content-Type":"application/json"},
      body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status,j:j}; }); });
  })
  .then(function(res){
    if(res.j && res.j.content && res.j.content.sha){
      ghSha=res.j.content.sha;
      setSyncStatus("ok","✓ synchronisé "+new Date().toLocaleTimeString("fr-CA"));
    } else {
      var msg=(res.j && res.j.message) ? res.j.message : ("HTTP "+(res.status||"?"));
      setSyncStatus("err","✗ "+msg);
    }
  })
  .catch(function(){ setSyncStatus("err","✗ erreur réseau"); });
}
function ghLoad(){
  var t=ghTok(); if(!t){ setSyncStatus("off","pas de token — colle-le dans Réglages"); return; }
  setSyncStatus("pend","chargement…");
  fetch(ghURL(),{headers:{Authorization:"token "+t}})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j && j.sha) ghSha=j.sha;
    if(j && j.content){
      var txt=decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))).trim()||"{}";
      var remote={}; try{ remote=JSON.parse(txt); }catch(e){ remote={}; }
      if(remote && remote.logs && (remote.ts||0) > (G.ts||0) && !logKind){
        G=remote;
        (function merge(d,c){ for(var k in d){ if(c[k]===undefined) c[k]=d[k];
          else if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])) merge(d[k],c[k]); } })(DEF_STATE,G);
        migrate();
        localStorage.setItem("gym_aw_data", JSON.stringify(G));
        setSyncStatus("ok","✓ chargé "+new Date().toLocaleTimeString("fr-CA"));
        render();
      } else {
        setSyncStatus("ok","✓ à jour "+new Date().toLocaleTimeString("fr-CA"));
      }
    } else {
      /* fichier absent dans le repo → on le crée avec les données locales */
      setSyncStatus("pend","création de gym_data.json…");
      ghSha=null;
      ghSave(false);
    }
  }).catch(function(){ setSyncStatus("err","✗ erreur réseau — token / permissions?"); });
}

function compl30(){
  var t0=new Date(); t0.setHours(12,0,0,0);
  var planned=0, done=0;
  var lmap={}; G.logs.forEach(function(l){ (lmap[l.d]=lmap[l.d]||[]).push(l); });
  for(var i=1;i<=30;i++){
    var d=new Date(t0); d.setDate(d.getDate()-i);
    var dk=dayKey(d), ty=G.days[dk].type;
    if(ty==="repos") continue;
    planned++;
    var ls=lmap[dstr(d)]||[];
    if(ls.some(function(l){ return (ty==="gym"&&(l.kind==="gym"||l.kind==="aw")) || (ty==="nage"&&l.kind==="nage") || l.kind==="gym" || l.kind==="nage"; })) done++;
  }
  return planned? Math.round(done/planned*100) : 100;
}

function rPlan(){
  var c=compDate();
  if(!c) return '<div class="card"><h2>Plan</h2><p class="dim">Règle une date de compétition dans ⚙ Réglages pour générer ta progression.</p></div>';
  var dc=daysToComp();
  var out='<div class="card"><h2>'+esc(G.comp.nom)+'</h2><p class="dim">'+
    c.toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+
    (dc!=null?' · <b class="au">J-'+dc+'</b> ('+Math.max(0,Math.ceil(dc/7))+' semaines)':'')+'</p>'+
    '<p class="dim" style="font-size:11px">La phase se calcule automatiquement à partir de cette date. Le moteur gère la charge séance par séance ; la phase guide l\'intensité (RIR) et le volume.</p></div>';
  /* graphique : charge totale soulevée par semaine (progression vers l'événement) */
  var vols=[]; for(var b=15;b>=0;b--) vols.push({back:b, v:weekVol(b)});
  while(vols.length>2 && vols[0].v===0) vols.shift();
  var nowM=new Date(); nowM.setHours(12,0,0,0); var dowM=(nowM.getDay()+6)%7;
  var vpts=vols.map(function(o){ var mo=new Date(nowM); mo.setDate(mo.getDate()-dowM-o.back*7); return [mo.getTime(), o.v]; });
  out+='<div class="card"><h3>📊 Charge totale soulevée — progression</h3>'+
    lineChart(vpts,640,170)+
    '<p class="dim" style="font-size:11px">Tonnage (poids × reps, toutes séries) par semaine. Cette sem. : <b class="au">'+fmtVol(weekVol(0))+'</b> · sem. passée : <b>'+fmtVol(weekVol(1))+'</b>. La courbe devrait monter jusqu\'à l\'intensification, puis redescendre à l\'affûtage avant l\'événement.</p></div>';
  var now=new Date(); now.setHours(12,0,0,0);
  var dow=(now.getDay()+6)%7; var mon=new Date(now); mon.setDate(mon.getDate()-dow);
  out+='<div class="card"><h3>Progression vers l\'événement</h3>';
  var wki=new Date(mon), guard=0;
  while(wki.getTime()<=c.getTime()+6*86400000 && guard<60){
    var rem=Math.ceil((c-wki)/86400000/7);
    var ph=phaseFor(rem);
    var cur=(wki.getTime()===mon.getTime());
    out+='<div class="wkrow'+(cur?' cur':'')+'" style="border-left:4px solid '+ph.col+'">'+

/* ----- STATS ----- */
function lineChart(pts,w,h,unit){
  if(pts.length<2) return '<p class="dim">Pas assez de données — logge au moins 2 séances.</p>';
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  if(y1===y0) y1=y0+1;
  var pad=28;
  function X(v){ return pad+(v-x0)/(x1-x0||1)*(w-pad-8); }
  function Y(v){ return h-18-(v-y0)/(y1-y0)*(h-30); }
  var path=pts.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join(" ");
  var s='<svg class="chart" viewBox="0 0 '+w+' '+h+'">';
  s+='<text x="2" y="'+(Y(y1)+4)+'" fill="#8d99ab" font-size="9">'+y1.toFixed(0)+'</text>';
  s+='<text x="2" y="'+(Y(y0)+4)+'" fill="#8d99ab" font-size="9">'+y0.toFixed(0)+'</text>';
  s+='<path d="'+path+'" stroke="#c9a227" stroke-width="2" fill="none"/>';
  pts.forEach(function(p){ s+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3" fill="#c9a227"/>'; });
  s+='</svg>';
  return s;
}

  var distTot=0,minSwim=0; G.logs.forEach(function(l){ if(l.kind==="nage"){distTot+=l.dist||0;minSwim+=l.min||0;} });

  out+='<div class="card"><h3>Poids corporel</h3>';

    out+='<p class="dim">Depuis le début : <b class="'+(diff<=0?'g':'r')+'">'+(diff>0?'+':'')+diff.toFixed(1)+' lb</b></p>';

  out+='</div>';
  return out;
}
function weekVol(back){
  var now=new Date(); now.setHours(12,0,0,0);
  var dow=(now.getDay()+6)%7;
  var monday=new Date(now); monday.setDate(monday.getDate()-dow-back*7);
  var sunday=new Date(monday); sunday.setDate(sunday.getDate()+6);
  var v=0;
  G.logs.forEach(function(l){
    if(l.kind!=="gym") return;
    var d=noon(l.d);
    if(d>=monday&&d<=sunday) (l.entries||[]).forEach(function(en){
      var x=exById(en.id);
      v+=entryVol(en, x?x.unit:"lbs");
    });
  });
  return v;
}
function fmtVol(v){ return v>=1000? (v/1000).toFixed(1)+"k lb" : Math.round(v)+" lb"; }
function volChart(){
  var vals=[]; for(var i=7;i>=0;i--) vals.push(weekVol(i));
  var max=Math.max.apply(null,vals.concat([1]));
  var w=640,h=140,bw=w/8-10;
  var s='<svg class="chart" viewBox="0 0 '+w+' '+h+'">';
  vals.forEach(function(v,i){
    var bh=v/max*(h-30), x=i*(w/8)+5;
    s+='<rect x="'+x+'" y="'+(h-18-bh)+'" width="'+bw+'" height="'+bh+'" fill="'+(i===7?'#c9a227':'#7a6418')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(h-4)+'" fill="#8d99ab" font-size="9" text-anchor="middle">S-'+(7-i)+'</text>';
    if(v>0) s+='<text x="'+(x+bw/2)+'" y="'+(h-22-bh)+'" fill="#e7dec8" font-size="9" text-anchor="middle">'+fmtVol(v)+'</text>';
  });
  s+='</svg>';
  return s;
}
